    // 白键：7 个
    [0, 2, 4, 5, 7, 9, 11].forEach(pc => {
      const b = document.createElement('button');
      b.className = 'pkey';
      b.type = 'button';
      b.textContent = NOTE_NAMES[pc];
      b.addEventListener('click', () => onPianoKeyClick(pc));
      whiteBox.appendChild(b);
      pianoKeyBtns[pc] = b;
    });

    // 黑键：5 个。at = 插在第几个白键之后（1 → C|D 之间）
    [[1, 1], [3, 2], [6, 4], [8, 5], [10, 6]].forEach(pair => {
      const pc = pair[0], at = pair[1];
      const b = document.createElement('button');
      b.className = 'pkey black';
      b.type = 'button';
      b.textContent = NOTE_NAMES[pc];
      b.style.left = (at * 100 / 7) + '%';
      b.addEventListener('click', () => onPianoKeyClick(pc));
      blackBox.appendChild(b);
      pianoKeyBtns[pc] = b;
    });

    pianoKeysEl.appendChild(whiteBox);
    pianoKeysEl.appendChild(blackBox);
  }

  function updateButtons(){
    if (mode === 'piano'){
      pianoKeyBtns.forEach((b, pc) => {
        const midi = (pianoOctave + 1) * 12 + pc;
        const isActive = (activeKey === midi);
        const isLocked = (lockedKey === midi);
        b.classList.toggle('active', isActive || isLocked);
        b.classList.toggle('in-tune', isLocked && running && Math.abs(smoothCents) <= IN_TUNE);
      });
    } else {
      stringBtns.forEach((b, i) => {
        const isActive = (activeKey === i);
        const isLocked = (lockedKey === i);
        b.classList.toggle('active', isActive || isLocked);
        b.classList.toggle('in-tune', isLocked && running && Math.abs(smoothCents) <= IN_TUNE);
      });
    }
  }

  function switchMode(newMode){
    if (mode === newMode) return;
    mode = newMode;
    lockedKey = null; activeKey = null;
    resetSmoothing();
    modeTabsEl.forEach(t => {
      t.classList.toggle('active', t.dataset.mode === newMode);
    });
    const inst = INSTRUMENTS[mode];
    if (inst.type === 'strings'){
      stringsEl.style.display = '';
      pianoArea.classList.remove('show');
      buildStringButtons();
    } else {
      stringsEl.style.display = 'none';
      pianoArea.classList.add('show');
      buildPianoKeys();
      updateOctaveDisplay();
    }
    hintText.innerHTML = inst.hint;
    clearDisplay();
    setListeningText();
    centsEl.className = 'cents';
    updateButtons();
    writeSetting(MODE_KEY, mode);
  }

  modeTabsEl.forEach(t => {
    t.addEventListener('click', () => switchMode(t.dataset.mode));
  });

  function updateOctaveDisplay(){
    octValueEl.textContent = 'C' + pianoOctave;
    octDownEl.disabled = (pianoOctave <= 1);
    octUpEl.disabled   = (pianoOctave >= 7);
  }
  octDownEl.addEventListener('click', () => {
    if (pianoOctave > 1){
      pianoOctave--;
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateOctaveDisplay(); updateButtons();
    }
  });
  octUpEl.addEventListener('click', () => {
    if (pianoOctave < 7){
      pianoOctave++;
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateOctaveDisplay(); updateButtons();
    }
  });

  const A4_KEY = 'shixin-a4';
  const MODE_KEY = 'shixin-instrument';

  function readSetting(key){
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeSetting(key, value){
    try { localStorage.setItem(key, String(value)); } catch (e) {}
  }

  /* 无效、超范围、空值都回到 440。步进与按钮一致，0.5Hz。 */
  function parseA4(raw){
    if (raw == null || raw === '') return 440;
    const n = Number(raw);
    if (!isFinite(n)) return 440;
    const snapped = Math.round(n * 2) / 2;
    if (snapped < 430 || snapped > 450) return 440;
    return snapped;
  }
  function parseMode(raw){
    if (raw === 'guitar' || raw === 'ukulele' || raw === 'piano') return raw;
    return 'guitar';
  }

  function updateA4Display(){
    a4ValueEl.innerHTML = a4Cal + '<span class="unit">Hz</span>';
  }
  function nudgeA4(delta){
    const next = Math.round((a4Cal + delta) * 10) / 10;
    if (next < 430 || next > 450) return;
    a4Cal = next;
    updateA4Display();
    resetSmoothing();
    writeSetting(A4_KEY, a4Cal);
  }
  a4DownEl.addEventListener('click', () => nudgeA4(-0.5));
  a4UpEl.addEventListener('click', () => nudgeA4(0.5));

  viewToggleEl.addEventListener('click', (e) => {
    const t = e.target.closest('.view-btn');
    if (!t) return;
    view = t.dataset.view;
    viewToggleEl.querySelectorAll('.view-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    if (view === 'needle'){
      gaugeBlock.classList.remove('hide');
      strobeView.classList.remove('show');
    } else {
      gaugeBlock.classList.add('hide');
      strobeView.classList.add('show');
      resizeStrobe();
    }
  });

  function resizeStrobe(){
    const dpr = window.devicePixelRatio || 1;
    const rect = strobeCanvas.getBoundingClientRect();
    /* 隐藏时尺寸是 0。这里绝不能把 canvas.width 写成 0 ——
       canvas 的固有宽度会跟着变 0，.strobe-view 又靠内容定宽，
       两边互等，下一次显示时永远撑不开（频闪页全黑就是这个原因）。 */
    if (rect.width < 1 || rect.height < 1) return;
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);
    if (strobeCanvas.width !== w)  strobeCanvas.width  = w;
    if (strobeCanvas.height !== h) strobeCanvas.height = h;
    drawStrobe();   /* 切过来先画一帧静态条纹，不然是一块空画布 */
  }
  window.addEventListener('resize', resizeStrobe);

  async function onStringClick(i){
    if (lockedKey === i){
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateButtons(); return;
    }
    lockedKey = i; activeKey = i;
    resetSmoothing(); updateButtons();
    const inst = INSTRUMENTS[mode];
    const s = inst.strings[i];
    await playReference(getFreq(s.midi), 1.4, {
      key: inst.prefix + s.name.replace('#', 's') + s.oct,
      rate: 1
    });
  }

  async function onPianoKeyClick(pc){
    const midi = (pianoOctave + 1) * 12 + pc;
    if (lockedKey === midi){
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateButtons(); return;
    }
    lockedKey = midi; activeKey = midi;
    resetSmoothing(); updateButtons();
    await playReference(getFreq(midi), 1.4, nearestPianoSample(midi));
  }

  /* 音量条：16 格，按电平点亮（与节拍页同一套视觉） */
  const LEVEL_SEGS = 16;
  let levelSegItems = [];

  function buildLevelSeg(){
    levelSegEl.innerHTML = '';
    levelSegItems = [];
    for (let i = 0; i < LEVEL_SEGS; i++){
      const s = document.createElement('i');
      levelSegEl.appendChild(s);
      levelSegItems.push(s);
    }
  }

  /* 传 0-100 的电平，点亮相应格数 */
  function paintLevel(v){
    const n = Math.round(Math.max(0, Math.min(100, v)) / 100 * LEVEL_SEGS);
    for (let i = 0; i < LEVEL_SEGS; i++){
      levelSegItems[i].classList.toggle('on', i < n);
    }
  }

  /* 给可能卡住的异步操作加超时。
     浏览器的 getUserMedia / AudioContext.resume 在某些情况下（权限弹窗
     被忽略、蓝牙耳机切换、系统音频服务异常）会一直 pending 不 resolve，
     导致界面停在「启动中」不动 —— 加上超时就变成可以理解的报错。 */
  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error(label + '超时')); }, ms);
      })
    ]);
  }

  async function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended'){
      // 只等 3 秒：拖太久就直接往下走，getUserMedia 可能照样能成功
      try { await withTimeout(audioCtx.resume(), 3000, '音频'); } catch(e){}
    }
    return audioCtx;
  }

  /* ══════════════════════════════════════════════
     真实乐器录音
     采样放在 audio/ 目录（与页面同源）。
     加载失败（如用 file:// 直接打开）就回退到下面的合成音。
     ══════════════════════════════════════════════ */
  const SAMPLE_DIR = 'audio/';
  /* 音频 URL 带内容哈希（见 web/audio-manifest.js）。
     哈希变了 URL 就变了，Service Worker 的缓存自然失效 ——
     否则换了采样，老用户永远听不到新的。
     清单没加载时退化成不带版本（首次访问兜底）。 */
  function sampleUrl(key){
    if (window.AudioManifest) return window.AudioManifest.url(key);
    return SAMPLE_DIR + key + '.m4a';
  }
  const sampleBufs = {};      /* key → AudioBuffer */
  const sampleJobs = {};      /* key → Promise */

  /* 钢琴采样点（与 audio/ 里的文件一一对应） */
  const PIANO_POINTS = [24,30,36,42,48,54,60,66,72,78,84,90,96,102,108];  /* C1 Fs1 … C8 */

  function midiToSampleName(midi){
    const pc = midi % 12;
    const oct = Math.floor(midi / 12) - 1;
    return NOTE_NAMES[pc].replace('#', 's') + oct;
  }

  /* 找离 midi 最近的采样点，返回 {key, rate}；差太远则返回 null（改用合成音） */
  function nearestPianoSample(midi){
    let best = PIANO_POINTS[0], bd = Math.abs(midi - best);
    for (let i = 1; i < PIANO_POINTS.length; i++){
      const d = Math.abs(PIANO_POINTS[i] - midi);
      if (d < bd){ bd = d; best = PIANO_POINTS[i]; }
    }
    if (bd > 6) return null;          /* 变调过大会失真，不如用合成音 */
    return {
      key: 'piano_' + midiToSampleName(best),
      rate: Math.pow(2, (midi - best) / 12)
    };
  }

  function loadSample(key){
    if (sampleBufs[key]) return Promise.resolve(sampleBufs[key]);
    if (sampleJobs[key]) return sampleJobs[key];
    sampleJobs[key] = (async () => {
      try {
        const ctx = await ensureAudio();
        const res = await fetch(sampleUrl(key));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const raw = await res.arrayBuffer();
        const buf = await ctx.decodeAudioData(raw);
        sampleBufs[key] = buf;
        return buf;
      } catch (e){
        sampleJobs[key] = null;
        return null;
      }
    })();
    return sampleJobs[key];
  }

  /* ══════════════════════════════════════════════
     手机外放补偿
     ══════════════════════════════════════════════
     实测（22050Hz 采样，按 LUFS 归一）：

       吉他六弦   E2  A2  D3  G3  B3  E4
       外放损失  14.7 13.1 8.7 13.1 13.9 3.8 dB

     手机小喇叭 400Hz 以下基本发不出声，而吉他低音弦的基频
     全在这个区间（E2=82Hz、A2=110Hz、D3=147Hz）。
     所以「听不到弦音」不是音量小，是频段被物理滤掉了 ——
     单靠加大音量只能让中高频更拆，低音弦还是没声。

     解法是谐波激励：把低频非线性失真成 2/3/4 次谐波。
     人耳有「缺失基频」效应，只有 2、3、4 次谐波也能听出 82Hz
     这个音高，而谐波（164/246/328Hz）正好落在手机能放的频段。

     拓扑（经典 bass exciter）：
        原信号 ─────────────────────────────┐
          └→ 低通250 → 驱动 → 高通450 → 激励增益 ┴→ 限幅 → 输出
     先低通再去驱动，保证只对低频做非线性 —— 否则中高频也会被
     拆成一片刺耳的互调失真。
     后级再高通，只留新生的谐波，不与原信号重复。 */
  const SAMPLE_GAIN = {
    /* 吉他/尤克：原始峰值已在 -3dBFS，几乎没有 headroom。
       增益之上还有 0.9 的总系数，所以这里卡在 1.25 以内 ——
       实测超过就会把限幅器推进 knee（0.8），瞬态开始被压。
       低音弦的“听得见”靠下面的谐波激励，不靠硬提增益。 */
    guitar_A2: 1.20, guitar_E4: 1.25,
    guitar_D3: 1.00, guitar_G3: 1.00, guitar_B3: 1.00, guitar_E2: 1.00,
    /* 尤克里里：同上，卡 1.25 */
    uke_A4: 1.25, uke_C4: 1.26, uke_E4: 1.25, uke_G4: 1.27,
    /* 钢琴：峰值比吉他低 4-15dB，按「-22 LUFS、最多 +9dB」补偿。
       高音 C6-C8 原始 RMS 极低但峰值不缺，所以卡 +9dB 上限，
       再高会把尾音底噪一并抬出来。 */
    piano_C1: 1.45,  piano_C2: 1.84,  piano_C3: 1.80,  piano_C4: 2.40,
    piano_C5: 2.82,  piano_C6: 2.82,  piano_C7: 2.82,  piano_C8: 2.82,
    piano_Fs1: 1.14, piano_Fs2: 1.32, piano_Fs3: 1.93, piano_Fs4: 2.24,
    piano_Fs5: 2.82, piano_Fs6: 2.82, piano_Fs7: 2.82
  };

  /* 激励强度：按实测外放损失分配（0 = 不激励）
     E4 只丢 3.8dB，不开 —— 多开只会把音色弄脏。 */
  const SAMPLE_EXCITE = {
    guitar_E2: 1.00,   /* 丢 14.7dB */
    guitar_B3: 0.95,   /* 丢 13.9dB */
    guitar_A2: 0.90,   /* 丢 13.1dB */
    guitar_G3: 0.90,   /* 丢 13.1dB */
    guitar_D3: 0.60,   /* 丢  8.7dB */
    piano_C1: 0.55, piano_Fs1: 0.55,
    piano_C2: 0.45, piano_Fs2: 0.45,
    piano_C3: 0.30, piano_Fs3: 0.30
  };


  /* 采样总总线：全局限幅器只建一次。
     以前是每次点击都新建一串 Gain/WaveShaper —— 按快了就是几十个
     废弃节点挂在 destination 上，不回收。 */
  let sampleBus = null, sampleBusCtx = null;
  function getSampleBus(ctx){
    /* 必须校验总线属于当前 context：
       stop() 会 audioCtx.close() 并把 audioCtx 置空，重新点音符时
       ensureAudioSync() 会建一个新 context。若沿用旧总线，
       音频会连到已关闭的 context 上 —— 点下去一点声音都没有。
       所以记下建总线时的 ctx，不是同一个就重建。 */
    if (sampleBus && sampleBusCtx === ctx) return sampleBus;
    const g = ctx.createGain();
    g.gain.value = 1;
    const lim = makeLimiter(ctx);
    g.connect(lim);
    lim.connect(ctx.destination);
    sampleBus = g;
    sampleBusCtx = ctx;
    return sampleBus;
  }

  /* 播放已缓存的采样；没缓存返回 false */
  function fireSample(key, rate, dur){
    const buf = sampleBufs[key];
    if (!buf || !audioCtx) return false;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    if (rate && Math.abs(rate - 1) > 1e-4) src.playbackRate.value = rate;

    const g = audioCtx.createGain();
    g.gain.value = 0.9 * (SAMPLE_GAIN[key] || 1);
    const out = getSampleBus(audioCtx);

    src.connect(g);
    g.connect(out);

    /* 手机外放补偿：只有低频损失严重的采样才走这条支路 */
    const excit = SAMPLE_EXCITE[key] || 0;
    if (excit > 0){
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 300;
      lp.Q.value = 0.7;

      const shaper = audioCtx.createWaveShaper();
      shaper.curve = driveCurve(5.0);
      shaper.oversample = '4x';

      /* 高通卡在 400：手机喇叭的下限就在这附近。
         一开始写成 450，结果 G3(196Hz) 的二次谐波 392 被一起滤掉，
         实测只提升 2.2dB —— 正好差在这一次谐波上。 */
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 400;
      hp.Q.value = 0.7;

      const eg = audioCtx.createGain();
      eg.gain.value = 0.9 * excit * 0.62;

      src.connect(lp);
      lp.connect(shaper);
      shaper.connect(hp);
      hp.connect(eg);
      eg.connect(out);
      /* 源结束就断开整条支路，不留悬挂节点 */
      src.onended = function(){
        try { lp.disconnect(); shaper.disconnect(); hp.disconnect(); eg.disconnect(); } catch(e){}
      };
    }

    src.start();
    playingRef = true;
    setTimeout(() => { playingRef = false; }, ((dur || 1.4) + 0.15) * 1000);
    return true;
  }

  /* 演奏一个标准音。
     sample = { key, rate } 时优先用真实录音。 */
  /* ── 点击发声：零延迟优先 ──
     原来的写法是 async + 一上来就 await ensureAudio()，
     采样没缓存时还要再 await loadSample() 走一次网络请求 ——
     第一次点某个音要等几百毫秒才出声，点快了还容易漏。

     现在按「能立刻出声就先出声」排序：
       ① 采样已在内存 → 同步启动，0 等待
       ② 采样没就绪   → 立刻用合成音顶上（同时后台补载，下次就快了）
       ③ 上下文被挂起 → 立即触发 resume，恢复后接着播
     函数仍返回 Promise，调用处的 await 照旧可用。 */
  function playReference(freq, duration, sample){
    duration = duration || 1.4;

    /* ① 已缓存的真实录音：同步播放，不等任何东西 */
    if (sample && sample.key && fireSample(sample.key, sample.rate, duration)) {
      return Promise.resolve();
    }

    /* ② 后台补载，供下一次点击使用（不阻塞本次发声） */
    if (sample && sample.key && !sampleBufs[sample.key]) loadSample(sample.key);

    /* ③ 合成音立刻顶上 */
    const ctx = ensureAudioSync();
    if (ctx && ctx.state === 'running') {
      playSynth(ctx, freq, duration);
      return Promise.resolve();
    }
    /* 上下文还没 running（首次交互前被浏览器挂起）：
       先同步尝试恢复，恢复后马上补播，通常只有几十毫秒 */
    return ensureAudio().then(c => playSynth(c, freq, duration)).catch(() => {});
  }

  /* 同步取出 AudioContext（首次调用时创建）。
     decodeAudioData 在 suspended 状态下也能用，所以预加载不必等交互。 */
  function ensureAudioSync(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    return audioCtx;
  }

  /* 合成音：短促的三角波 + 八度泛音，用作采样未就绪时的即时兜底 */
  function playSynth(ctx, freq, duration){
    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.12;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.22, now + 0.025);
    master.gain.setValueAtTime(0.22, now + duration - 0.15);
    master.gain.linearRampToValueAtTime(0.0001, now + duration);
    osc1.connect(master);
    osc2.connect(g2).connect(master);
    master.connect(ctx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + duration + 0.03);
    osc2.stop(now + duration + 0.03);
    playingRef = true;
    setTimeout(() => { playingRef = false; }, (duration + 0.15) * 1000);
  }

  /* ── 采样预加载 ──
     25 个文件共 391KB，全部解码进内存约 2MB，代价可接受。
     页面空闲时串行拉取（串行是为了不和首屏抢带宽），
     这样第一次点音符听到的就是真实录音，而不是合成音。
     预加载失败也不影响功能 —— playReference 会退到合成音。 */
  function preloadSamples(){
    const keys = [];
    for (const k in INSTRUMENTS){
      const inst = INSTRUMENTS[k];
      if (inst.type === 'strings' && inst.prefix){
        inst.strings.forEach(st => {
          keys.push(inst.prefix + st.name.replace('#', 's') + st.oct);
        });
      }
    }
    PIANO_POINTS.forEach(m => keys.push('piano_' + midiToSampleName(m)));
    const uniq = Array.from(new Set(keys));

    let i = 0;
    function next(){
      if (i >= uniq.length) return;
      loadSample(uniq[i++]).then(next, next);
    }
    next();
  }

  /* 页面一空闲就开始预加载 */
  if (window.requestIdleCallback){
    requestIdleCallback(preloadSamples, { timeout: 2500 });
  } else {
    setTimeout(preloadSamples, 1200);
  }

  /* 首次任意触摸就把 AudioContext 唤醒 —— 别等到点音符那一刻。
     用捕获阶段 + once，保证先于业务逻辑执行。 */
  ['pointerdown', 'touchstart', 'mousedown'].forEach(ev => {
    document.addEventListener(ev, () => {
      const c = ensureAudioSync();
      if (c && c.state === 'suspended') c.resume().catch(() => {});
    }, { capture: true, passive: true, once: true });
  });

  /* 分析窗口长度：按最低频率算出需要多少个样本才是 2 的幂。
     吉他 70Hz → 5×44100/70 = 3150 → 4096
     尤克 200Hz → 1103 → 2048
     钢琴 65Hz → 3392 → 4096 */
  function pitchWindow(minFreq, sampleRate, avail){
    const need = Math.ceil(MIN_CYCLES * sampleRate / minFreq);
    let size = WINDOW_MIN;
    while (size < need && size < WINDOW_MAX) size *= 2;
    return Math.min(size, avail);
  }

  function detectPitch(buf, sampleRate, minFreq, maxFreq){
    const SIZE = pitchWindow(minFreq, sampleRate, buf.length);
    const offset = buf.length - SIZE;
    let mean = 0;
    for (let i = 0; i < SIZE; i++) mean += buf[offset + i];
    mean /= SIZE;
    const minLag = Math.max(2, Math.floor(sampleRate / maxFreq));
    /* 每个 lag 至少留 SIZE/3 个样本参与相关，否则统计量太少，峰值虚高 */
    const maxLag = Math.min(Math.floor(SIZE * 2 / 3), Math.floor(sampleRate / minFreq));
    const c = corrBuf;
    let maxVal = -1, maxPos = -1;
    for (let lag = minLag; lag <= maxLag; lag++){
      let num = 0, d1 = 0, d2 = 0;
      const limit = SIZE - lag;
      for (let i = 0; i < limit; i++){
        const a = buf[offset + i] - mean;
        const b = buf[offset + i + lag] - mean;
        num += a * b; d1 += a * a; d2 += b * b;
      }
      const den = Math.sqrt(d1 * d2);
      const nc = den > 1e-9 ? num / den : 0;
      c[lag] = nc;
      if (nc > maxVal){ maxVal = nc; maxPos = lag; }
    }
    if (maxPos < 0 || maxVal < NC_MIN) return null;
    const thr = maxVal * 0.93;
    for (let lag = minLag + 1; lag < maxPos; lag++){
      if (c[lag] > thr && c[lag] >= c[lag-1] && c[lag] >= c[lag+1]){ maxPos = lag; break; }
    }
    let delta = 0;
    if (maxPos > minLag && maxPos < maxLag){
      const y1 = c[maxPos-1], y2 = c[maxPos], y3 = c[maxPos+1];
      const den = 2 * (y1 + y3 - 2 * y2);
      if (den !== 0) delta = -(y3 - y1) / den;
      if (delta > 1) delta = 1;
      if (delta < -1) delta = -1;
    }
    const period = maxPos + delta;
    if (period <= 0) return null;
    const freq = sampleRate / period;
    if (freq < minFreq || freq > maxFreq) return null;
    return freq;
  }

  /* ══════════════════════════════════════════
     自由弹奏时的八度折叠

     自相关法在低音弦上容易锁到二次谐波（高八度）。
     锁定某根弦时可以直接按目标频率折；自由弹奏时没有目标，
     所以换个办法：把实测值和「每根弦 × 1, 2, 3 倍」都算一遍距离，
     取整体最优的那组合 —— 如果某个弦的二次谐波比任何弦的基频都更贴近，
     就判定为锁到谐波，折回基频。

     为什么最高只试到 3 倍：吉他 6 弦 E2 的 3 次谐波已经到 247Hz，
     再往上就落进别的弦的音域，容易误判。
     ══════════════════════════════════════════ */
  /* 只认二次谐波，不认三次。
     原因：三次谐波会撞上别的弦 ——
       E2 的 3 次 = 247.2Hz，正好是 B3
       A2 的 3 次 = 330.0Hz，正好是 E4
     这是物理上的天然歧义，无法区分「弹了 B3」和「E2 的泛音」。
     强行判会把正常的高音弦判成低音谐波，比不判更糟。
     二次谐波没有这个问题：吉他六根弦里没有任何一根落在别根的八度上。 */
  const HARMONICS = [1, 2];

  function nearestString(freq){
    const strings = INSTRUMENTS[mode].strings;
    let best = 0, bestC = Infinity;
    for (let i = 0; i < strings.length; i++){
      const c = Math.abs(1200 * Math.log2(freq / getFreq(strings[i].midi)));
      if (c < bestC){ bestC = c; best = i; }
    }
    return best;
  }

  /* 返回折回基频后的频率。判断不成立时原样返回。 */
  function foldToHarmonic(freq){
    if (mode === 'piano') return freq;
    const strings = INSTRUMENTS[mode].strings;

    /* 先看实测值直接匹配基频有多近 */
    let bestBase = Infinity;
    for (let i = 0; i < strings.length; i++){
      const c = Math.abs(1200 * Math.log2(freq / getFreq(strings[i].midi)));
      if (c < bestBase) bestBase = c;
    }
    /* 已经足够近（在准音区内），就是基频，不动 */
    if (bestBase <= IN_TUNE * 2) return freq;

    /* 试「某根弦的 n 次谐波」是否明显更贴近 */
    let bestHarm = Infinity, bestHarmFreq = freq;
    for (let i = 0; i < strings.length; i++){
      const f0 = getFreq(strings[i].midi);
      for (let h = 0; h < HARMONICS.length; h++){
        const n = HARMONICS[h];
        if (n === 1) continue;
        const c = Math.abs(1200 * Math.log2(freq / (f0 * n)));
        if (c < bestHarm){ bestHarm = c; bestHarmFreq = f0; }
      }
    }

    /* 谐波解释必须比基频解释好 3 倍以上，且本身够近（50 音分内）才认 */
    if (bestHarm * 3 < bestBase && bestHarm < 50){
      return bestHarmFreq;
    }
    return freq;
  }

  function processPitch(freqRaw){
    freqHistory.push(freqRaw);
    if (freqHistory.length > HISTORY_SIZE) freqHistory.shift();
    const sorted = freqHistory.slice().sort((a, b) => a - b);
    let median = sorted[Math.floor(sorted.length / 2)];

    /* 八度折叠是后面的事 —— 先让原始频率去判弹错弦，
       否则 D3（146.8Hz）会被折成 73.4Hz 反而更像 E2。 */

    let candId;
    if (mode === 'piano'){
      candId = Math.round(freqToMidi(median));
    } else {
      /* 自由弹奏（没锁定某根弦）时也要做八度折叠。
         低音弦基频弱、二次谐波强，自相关很容易锁到高八度 ——
         实测吉他上会这样错：
           弹 E2 但测到 164.8Hz → 匹配成 D3（差 200 音分）
           弹 A2 但测到 220.0Hz → 匹配成 G3（差 200 音分）
           弹 G3 但测到 392.0Hz → 匹配成 E4（差 300 音分）
         显示的是完全不同的弦，用户会以为琴坏了两根。

         做法：先按实测值找最近的弦，再试它的整数分音，
         哪个「弦 + 整数倍」最贴近实测值就取哪个。 */
      median = foldToHarmonic(median);
      candId = nearestString(median);
    }
    let displayId;
    if (lockedKey !== null){
      displayId = lockedKey;
      candidateId = null; candidateN = 0;
    } else if (displayedId === null){
      displayedId = candId; displayId = candId;
      smoothCents = 0; candidateId = null; candidateN = 0;
    } else if (candId === displayedId){
      candidateId = null; candidateN = 0; displayId = displayedId;
    } else {
      if (candidateId === candId) candidateN++;
      else { candidateId = candId; candidateN = 1; }
      if (candidateN >= SWITCH_NEED){
        displayedId = candId; displayId = candId;
        smoothCents = 0; candidateId = null; candidateN = 0;
      } else displayId = displayedId;
    }
    let targetFreq;
    if (mode === 'piano') targetFreq = getFreq(displayId);
    else targetFreq = getFreq(INSTRUMENTS[mode].strings[displayId].midi);

    const rawMedian = median;   /* 折叠前的真实测量值 */

    /* ── 弹错弦：先用「未折叠」的原始频率判 ──
       折叠是为了修谐波误锁，但它会把弹错的音拉回目标弦附近，
       所以判定必须在折叠之前完成，并把结果传下去。 */
    let wrongNow = null;
    if (lockedKey !== null && mode !== 'piano'){
      const rawCents = Math.abs(1200 * Math.log2(median / targetFreq));
      if (rawCents > IN_TUNE){
        wrongNow = findWrongString(median, lockedKey);
      }
    }

    /* ── 八度折叠 ──
       放在这里，是因为弹错弦已经用原始频率判过了。
       吉他低音弦基频弱、谐波强，自相关容易锁到二次谐波；
       锁定某根弦时把偏离超过一个八度的折回来。
       钢琴不折 —— 它没有「锁定某根弦」这个概念，音域也太宽。 */
    if (lockedKey !== null && mode !== 'piano'){
      let guard = 0;
      while (median > targetFreq * 1.6 && guard++ < 4) median /= 2;
      guard = 0;
      while (median < targetFreq / 1.6 && guard++ < 4) median *= 2;
    }

    const centsRaw = 1200 * Math.log2(median / targetFreq);
    const gap = Math.abs(centsRaw - smoothCents);
    const alpha = gap > EMA_FAST_GAP ? EMA_FAST : EMA_SLOW;
    smoothCents += (centsRaw - smoothCents) * alpha;
    updateDisplay(displayId, median, smoothCents, wrongNow, rawMedian);
  }

  /* ══════════════════════════════════════════
     弹错弦检测

     锁定了某根弦（用户点了它），但实测音高更接近另一根 ——
     这时不应该继续显示「偏离 47 音分」，而应该直接说弹的是哪根。
     学生最容易在这里困惑：以为琴严重不准，其实是拨错了弦。

     判定两道门槛：
       1. 另一根弦离得更近，且比目标弦好至少 WRONG_RATIO 倍
          （收紧一点，避免弦振动不稳时来回误报）
       2. 连续命中 WRONG_HOLD 帧才确认（防起音的瞬态误判）
     ══════════════════════════════════════════ */
  const WRONG_RATIO = 4.0;    /* 音分差多少倍才算「明显更接近」 */
  const WRONG_HOLD  = 3;      /* 连续几帧确认 */

  let wrongId = null, wrongN = 0;

  /* 找比锁定弦更接近实测音高的那根；没有则返回 null */
  function findWrongString(freq, locked){
    if (mode === 'piano') return null;   /* 钢琴不用这个概念 */
    const strings = INSTRUMENTS[mode].strings;

    const dLocked = Math.abs(1200 * Math.log2(freq / getFreq(strings[locked].midi)));
    let best = -1, bestC = Infinity;
    for (let i = 0; i < strings.length; i++){
      if (i === locked) continue;
      const c = Math.abs(1200 * Math.log2(freq / getFreq(strings[i].midi)));
      if (c < bestC){ bestC = c; best = i; }
    }
    /* 必须明显比锁定弦近 */
    if (best >= 0 && bestC * WRONG_RATIO < dLocked) return best;
    return null;
  }

  function resetWrongString(){
    wrongId = null; wrongN = 0;
    centsEl.classList.remove('wrong');
    noteEl.classList.remove('wrong');
  }

  function updateDisplay(displayId, freq, cents, wrongArg, rawFreq){
    const clamped = Math.max(-50, Math.min(50, cents));
    needleTarget = clamped * G_DEG_PER_CENT;
    const absC = Math.abs(cents);
    const ok = absC <= IN_TUNE;

    /* 弹错弦：用 processPitch 传来的判定（基于未折叠的原始频率） */
    const wrong = wrongArg;
    if (wrong !== null && wrong !== undefined){
      wrongN++;
      wrongId = wrong;
    } else {
      wrongN = 0;
      wrongId = null;
    }
    const isWrong = (wrongId !== null && wrongN >= WRONG_HOLD);

    appEl.classList.toggle('tuning-ok', ok && !isWrong);
    appEl.classList.toggle('wrong-string', isWrong);
    setNeedleFaded(isWrong);

    let displayName, displayOct;
    if (mode === 'piano'){
      const n = midiToNote(displayId);
      displayName = n.name; displayOct = n.octave;
    } else {
      const s = INSTRUMENTS[mode].strings[displayId];
      displayName = s.name; displayOct = s.oct;
    }
    noteEl.innerHTML =
      /* 左侧隐形孪生八度：只占宽度，保证字母本身居中 */
      '<span class="oct ghost" aria-hidden="true">' + displayOct + '</span>' +
      '<span class="letter">' + displayName + '</span>' +
      '<span class="oct">' + displayOct + '</span>';
    /* 有音名了：回到「音名居中 + 音分/赫兹固定在下方」的布局 */
    gaugeOverlay.classList.remove('idle');
    /* 弹错时显示「真实测到的频率」，不是折叠后的值 ——
       折叠是为了让指针走到合理位置，但报给用户的数字应该诚实。 */
    freqEl.textContent = rawFreq.toFixed(2) + ' Hz';

    if (isWrong){
      /* 弹错了：不显示音分，直接说这是哪根弦 */
      const ws = INSTRUMENTS[mode].strings[wrongId];
      const ls = INSTRUMENTS[mode].strings[lockedKey];
      centsEl.textContent = '这是 ' + ws.num + ' 弦 ' + ws.name + ws.oct +
                            '，不是 ' + ls.num + ' 弦 ' + ls.name + ls.oct;
      centsEl.className = 'cents wrong';
      noteEl.classList.add('wrong');
    } else if (ok){
      noteEl.classList.remove('wrong');
      centsEl.textContent = '准音'; centsEl.className = 'cents ok';
    }
    else if (cents > 0){
      noteEl.classList.remove('wrong');
      centsEl.textContent = '+' + cents.toFixed(0) + '¢  偏高'; centsEl.className = 'cents high';
    }
    else {
      noteEl.classList.remove('wrong');
      centsEl.textContent = Math.abs(cents).toFixed(0) + '¢  偏低'; centsEl.className = 'cents low';
    }
    activeKey = displayId;
    updateButtons();

    /* 弹错时：把检测到的那根弦按钮也标一下，方便对照 */
    stringBtns.forEach(function(b, i){
      b.classList.toggle('hint-wrong', isWrong && i === wrongId);
    });
  }

  /* 监听中的提示文案
     不用「…」字符（在等宽字体下会缩成一团），
     而是三个点各自带相位、由 CSS 依次亮起 —— 让人看得出程序在跑。 */
  function setListeningText(){
    if (!running){
      centsEl.textContent = '轻触开始';
      return;
    }
    centsEl.innerHTML =
      '拨响一个音<span class="dots">' +
      '<span>.</span><span>.</span><span>.</span></span>';
  }

  function clearDisplay(){
    /* 不再画破折号占位 —— 84px 的横杠很抢眼。
       没有音名时切回 idle：提示文字回到圆心居中。 */
    noteEl.innerHTML = '';
    gaugeOverlay.classList.add('idle');
    setListeningText();
    centsEl.className = 'cents';
    freqEl.textContent = '';
    needleTarget = 0; smoothCents = 0;
    displayedId = null; candidateId = null; candidateN = 0;
    activeKey = lockedKey;
    appEl.classList.remove('tuning-ok');
    appEl.classList.remove('wrong-string');
    resetWrongString();
    stringBtns.forEach(function(b){ b.classList.remove('hint-wrong'); });
    updateButtons();
  }

  function resetSmoothing(){
    freqHistory = [];
    displayedId = null; candidateId = null; candidateN = 0;
    smoothCents = 0; needleVel = 0; needleTarget = 0;
    resetWrongString();
    appEl.classList.remove('wrong-string');
    if (typeof stringBtns !== 'undefined' && stringBtns.length){
      stringBtns.forEach(function(b){ b.classList.remove('hint-wrong'); });
    }
  }

  /* 指针物理的一步积分：只算角度，不碰 DOM */
  function stepNeedle(dt){
    const w = 2 * Math.PI * NEEDLE_HZ;
    const accel = w * w * (needleTarget - needleAngle)
                - 2 * NEEDLE_ZETA * w * needleVel;
    needleVel   += accel * dt;
    needleAngle += needleVel * dt;

    if (Math.abs(needleTarget - needleAngle) < NEEDLE_DEADZONE &&
        Math.abs(needleVel) < NEEDLE_STOP_VEL){
      needleAngle = needleTarget; needleVel = 0;
    }
  }

  /* 把当前角度画到 SVG 上 */
  let needleFaded = false;

  function paintNeedle(){
    const rad = needleAngle * Math.PI / 180;
    const rTip = G_R - 5;
    const x = G_CX + rTip * Math.sin(rad);
    const y = G_CY - rTip * Math.cos(rad);
    needleLine.setAttribute('x2', x.toFixed(2));
    needleLine.setAttribute('y2', y.toFixed(2));
    needleTip.setAttribute('cx', x.toFixed(2));
    needleTip.setAttribute('cy', y.toFixed(2));
  }

  /* 弹错弦时把指针隐掉
     为什么不用 CSS：stroke 是 JS 写的内联属性，样式表的规则压不过它。
     直接改属性最可靠，用 CSS transition 补上淡出过程。 */
  function setNeedleFaded(faded){
    if (faded === needleFaded) return;
    needleFaded = faded;
    /* 设在 <g> 上：里面只有 line + tip，opacity 同时作用到两者，
       而且 <g> 自身没有 stroke/fill 属性来跟 CSS 打架。

       不做 transition —— 弹错弦是「纠正性提示」，瞬时切换更清楚，
       也能避免动画在弱性能设备上拖慢反馈。 */
    const g = document.getElementById('needle');
    if (!g) return;
    g.style.opacity = faded ? '0.12' : '1';
  }

  function updateNeedle(ts){
    /* 用真实时间步长，60Hz / 120Hz 屏手感一致。
       切后台回来时 ts 会跳很大，限幅到 50ms，避免指针瞬移。 */
    let dt = lastNeedleTs ? (ts - lastNeedleTs) / 1000 : (1 / 60);
    lastNeedleTs = ts;
    if (!(dt > 0) || dt > 0.05) dt = 1 / 60;

    stepNeedle(dt);
    paintNeedle();
  }

  /* 停止后让指针自己摆回中央
     不能靠 loop() —— 它在 running=false 时直接 return，指针会停在原地。
     这里单独跑一个 rAF，复用同一套弹簧物理，所以回程和中间移动手感一致。 */
  let needleHomeRaf = 0;

  function animateNeedleHome(){
    cancelAnimationFrame(needleHomeRaf);
    needleTarget = 0;
    let last = 0;

    function frame(ts){
      let dt = last ? (ts - last) / 1000 : (1 / 60);
      last = ts;
      if (!(dt > 0) || dt > 0.05) dt = 1 / 60;

      stepNeedle(dt);
      paintNeedle();

      /* 到位了就停 —— 别让 rAF 永久转下去 */
      if (Math.abs(needleAngle) > 0.04 || Math.abs(needleVel) > 0.4){
        needleHomeRaf = requestAnimationFrame(frame);
      } else {
        needleAngle = 0; needleVel = 0; lastNeedleTs = 0;
        paintNeedle();
      }
    }
    needleHomeRaf = requestAnimationFrame(frame);
  }

  function drawStrobe(){
    const W = strobeCanvas.width;
    const H = strobeCanvas.height;
    if (W === 0 || H === 0) return;
    strobeCtx.setTransform(1, 0, 0, 1, 0, 0);
    strobeCtx.clearRect(0, 0, W, H);
    strobeCtx.fillStyle = theme().surface2;
    strobeCtx.fillRect(0, 0, W, H);
    const dpr = window.devicePixelRatio || 1;
    const inTune = Math.abs(smoothCents) < 1.2;
    const period = STROBE_PERIOD * dpr;
    const stripe = STROBE_STRIPE * dpr;
    const offset = ((strobePhase * dpr) % period + period) % period;
    strobeCtx.fillStyle = inTune
        ? `rgba(${theme().successRgb},.55)`
        : `rgba(${theme().accentRgb},.42)`;
    for (let x = -period - offset; x < W + period; x += period){
      strobeCtx.fillRect(x, 0, stripe, H);
    }
  }

  let lastAnalysis = 0;
  function loop(ts){
    if (!running){ lastStrobeTs = 0; return; }
    /* 真实时间步长：频闪按秒积分，60Hz 与 120Hz 屏上速度和方向一致。
       切后台回来时 ts 会跳很大，限幅到 50ms。 */
    let dt = lastStrobeTs ? (ts - lastStrobeTs) / 1000 : (1 / 60);
    lastStrobeTs = ts;
    if (!(dt > 0) || dt > 0.05) dt = 1 / 60;
    if (!playingRef && ts - lastAnalysis > ANALYSIS_MS){
      lastAnalysis = ts;
      analyser.getFloatTimeDomainData(timeBuf);
      let sum = 0;
      for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
      const rms = Math.sqrt(sum / timeBuf.length);
      const targetLv = Math.min(100, Math.sqrt(rms) * 380);
      smoothLevel += (targetLv - smoothLevel) * 0.35;
      paintLevel(smoothLevel);
      if (rms < RMS_MIN){
        missFrames++;
        freqHistory = [];
        candidateId = null; candidateN = 0;
        if (missFrames > 12 && lastGoodTs && ts - lastGoodTs > 800) clearDisplay();
      } else {
        const [minF, maxF] = INSTRUMENTS[mode].detectRange;
        const f = detectPitch(timeBuf, audioCtx.sampleRate, minF, maxF);
        if (f){ missFrames = 0; lastGoodTs = ts; processPitch(f); }
        else {
          missFrames++;
          if (missFrames > 15 && lastGoodTs && ts - lastGoodTs > 900) clearDisplay();
        }
      }
    }
    updateNeedle(ts);
    if (Math.abs(smoothCents) >= 0.4){
      strobePhase += smoothCents * STROBE_SPEED * dt;
      if (strobePhase > 1e6)  strobePhase -= 1e6;
      if (strobePhase < -1e6) strobePhase += 1e6;
    }
    if (view === 'strobe') drawStrobe();
    requestAnimationFrame(loop);
  }

  /* 关掉当前麦克风的全部音轨，录音指示灯才会灭。 */
  function releaseMic(){
    micGen++;
    const s = micStream;
    micStream = null;
    if (!s) return;
    try { s.getTracks().forEach(function(t){ t.stop(); }); } catch(_){}
  }

  function stopTracks(stream){
    if (!stream) return;
    try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(_){}
  }

  /* 申请麦克风。超时后迟到的流、页面已经隐藏、或这次申请已被 releaseMic 作废时，
     都要把音轨关掉，不能留在 micStream 里。 */
  async function acquireMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('浏览器不支持麦克风');
    }
    const gen = micGen;
    const gum = navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 }
    });
    let stream;
    try {
      stream = await withTimeout(gum, 10000, '麦克风');
    } catch (e){
      // 权限弹窗被忽略 / 麦克风被占 / 系统音频异常时，这个 Promise 会一直挂着。
      // 等 10 秒还没结果就报错，并在后台把迟到拿到的流关掉（不然麦克风被白占）。
      gum.then(function(s){ stopTracks(s); }).catch(function(){});
      throw e;
    }
    if (gen !== micGen || document.hidden){
      stopTracks(stream);
      const err = new Error('页面已隐藏');
      err.silent = true;
      throw err;
    }
    micStream = stream;
    return stream;
  }

  function wireMic(ctx, stream){
    const src = ctx.createMediaStreamSource(stream);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 55; hp.Q.value = 0.6;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3500; lp.Q.value = 0.6;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0;
    src.connect(hp); hp.connect(lp); lp.connect(analyser);
    timeBuf = new Float32Array(analyser.fftSize);
    corrBuf = new Float32Array(analyser.fftSize);
  }

  async function start(){
    /* 如果停止后的归位动画还在跑，先停掉 —— 否则会和 loop 抢着画指针 */
    cancelAnimationFrame(needleHomeRaf);
    needleHomeRaf = 0;
    startBtn.disabled = true;
    startBtn.textContent = '启动中';
    try {
      const ctx = await ensureAudio();
      const stream = await acquireMic();
      wireMic(ctx, stream);
      running = true;
      lastGoodTs = performance.now();
      lastAnalysis = 0; missFrames = 0; smoothLevel = 0;
      lastStrobeTs = 0;
      resetSmoothing();
      micStatus.classList.add('on');
      micText.textContent = '监听中';
      appEl.classList.add('listening');   /* 开启监听波纹 */
      startBtn.disabled = false;
      startBtn.textContent = '停止';
      startBtn.classList.add('stop');
      clearDisplay();
      setListeningText();
      requestAnimationFrame(() => {
        resizeStrobe();
        requestAnimationFrame(loop);
      });
    } catch (err){
      /* 申请过程中失败、或拿到流之后接线失败：音轨不能留着 */
      releaseMic();
      running = false;
      const silent = !!(err && err.silent);
      if (!silent) console.error(err);
      let msg = '无法访问麦克风';
      if (err && err.name === 'NotAllowedError') msg = '麦克风权限被拒绝';
      else if (err && err.name === 'NotFoundError') msg = '未找到麦克风设备';
      else if (err && err.name === 'NotReadableError') msg = '麦克风被其他程序占用';
      else if (err && /超时/.test(err.message || '')) {
        msg = err.message + '\n\n' +
              '可能是浏览器把麦克风权限拦住了。\n' +
              '点地址栏左边的图标 → 把「麦克风」改成「允许」，然后再试一次。';
      }
      else if (err && err.message) msg = err.message;
      startBtn.disabled = false;
      startBtn.textContent = '开始调音';
      micStatus.classList.remove('on');
      micText.textContent = '未启动';
      appEl.classList.remove('listening');   /* 启动失败也别留波纹 */
      if (!silent) alert(msg);
    }
  }

  function stop(){
    running = false;
    releaseMic();
    if (audioCtx){ try { audioCtx.close(); } catch(e){} audioCtx = null; }
    /* 总线绑在已关闭的 context 上，一起丢掉 */
    sampleBus = null; sampleBusCtx = null;
    analyser = null;
    smoothLevel = 0;
    paintLevel(0);
    micStatus.classList.remove('on');
    micText.textContent = '已停止';
    appEl.classList.remove('listening');   /* 关闭监听波纹 */
    startBtn.textContent = '开始调音';
    startBtn.classList.remove('stop');
    clearDisplay();
    centsEl.textContent = '轻触开始';
    animateNeedleHome();   /* 指针摆回中央 */
  }

  startBtn.addEventListener('click', () => {
    if (running) stop(); else start();
  });

  /* ── 圆形命中检测 ──
     圆环元素的盒子是外接正方形，四角的空白不该响应点击。
     用点到圆心的距离判断，ratio = 圆半径 / 元素半宽。
     加上 2px 容差，让描边外侧的边缘也能点中。 */
  function hitCircle(el, clientX, clientY, ratio){
    if (!el) return false;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const rad = Math.min(r.width, r.height) / 2 * ratio + 2;
    const dx = clientX - cx, dy = clientY - cy;
    return dx * dx + dy * dy <= rad * rad;
  }

  /* 圆环点按 = 开始 / 停止（取代底部按钮）
     startBtn 已隐藏，但它仍是状态与文字的唯一来源，
     这里只把点击转过去，不改动 start()/stop() 的任何逻辑。

     触发区严格限定在圆内 —— SVG viewBox 是 300，圆半径 135，
     所以可见圆只占外接正方形的 87%（面积约 76%），四角是死区。 */
  const gaugeSvg  = gaugeBlock.querySelector('.gauge-svg');
  /* ratio = 圆半径 / 半宽。viewBox 300、圆 r=135 → 135 / 150 */
  const RING_RATIO = 135 / 150;
  gaugeBlock.addEventListener('click', (e) => {
    if (startBtn.disabled) return;        /* 「启动中」时忽略重复点击 */
    if (!hitCircle(gaugeSvg, e.clientX, e.clientY, RING_RATIO)) return;
    startBtn.click();
  });

  /* 频闪视图：点画布开始/停止。
     频闪是矩形画布，没有圆可参考，所以整块都可点。
     不加这个的话，切到频闪后就没地方可以开始了（圆环被 hide）。 */
  strobeView.addEventListener('click', () => {
    if (startBtn.disabled) return;
    startBtn.click();
  });

  /* 切到后台时音轨已经停了。若界面仍是「监听中」，回到前台再重新打开麦克风。 */
  function resumeListening(){
    if (document.hidden || !running || micStream || micRestore) return;
    const job = (async function(){
      try {
        const ctx = await ensureAudio();
        if (!running || document.hidden || micStream) return;
        const stream = await acquireMic();
        if (!running || document.hidden || !micStream){
          releaseMic();
          return;
        }
        wireMic(ctx, stream);
      } catch (e){
        releaseMic();
        /* 还在前台、又不是「页面已隐藏」：恢复失败就停掉，避免停在「监听中」却没有麦克风 */
        if (running && !document.hidden && !(e && e.silent)) stop();
      }
    })();
    micRestore = job;
    function done(){
      if (micRestore === job) micRestore = null;
      if (!document.hidden && running && !micStream) resumeListening();
    }
    job.then(done, done);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      releaseMic();
      if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    } else if (running){
      resumeListening();
    } else if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  });

  /* 关掉页面、或进入往返缓存时，visibilitychange 不一定先到 */
  window.addEventListener('pagehide', function(){ releaseMic(); });
  window.addEventListener('pageshow', function(){
    if (!document.hidden && running) resumeListening();
  });

  buildStringButtons();
  buildPianoKeys();
  buildLevelSeg();
  updateOctaveDisplay();
  a4Cal = parseA4(readSetting(A4_KEY));
  updateA4Display();
  updateButtons();
  clearDisplay();
  resizeStrobe();
  const savedMode = parseMode(readSetting(MODE_KEY));
  if (savedMode !== mode) switchMode(savedMode);
})();
</script>

<script>
/* ════════════════════════════════════════════════════════════
   节拍器（由 tools/add_metronome_js.py 插入）

     1. 核心逻辑 —— 重拍计算、速度术语、范围常量
     2. 音频引擎 —— Web Audio 预调度，保证节拍稳定
     3. 界面控制 —— 胶囊切换、拍号面板、圆环拖动、播放按钮
   ════════════════════════════════════════════════════════════ */

/* ─────────── 1. 核心逻辑 ─────────── */
/* ══════════════════════════════════════════════════════════════
   节拍器核心逻辑（纯计算，不碰 DOM / 音频）

   单独放在这里是为了能脱离浏览器测试 ——
   节拍器的重拍安排和速度术语都容易写错，需要能验证。
   ══════════════════════════════════════════════════════════════ */

/* ── 速度术语 ──
   按意大利传统区间划分，upTo 是上界（含）。
   中英对照方便教学时对应。 */
const TEMPO_TERMS = [
  { upTo: 40,       it: 'Grave',       cn: '庄板'   },
  { upTo: 60,       it: 'Largo',       cn: '广板'   },
  { upTo: 66,       it: 'Larghetto',   cn: '小广板' },
  { upTo: 76,       it: 'Adagio',      cn: '柔板'   },
  { upTo: 108,      it: 'Andante',     cn: '行板'   },
  { upTo: 120,      it: 'Moderato',    cn: '中板'   },
  { upTo: 168,      it: 'Allegro',     cn: '快板'   },
  { upTo: 200,      it: 'Presto',      cn: '急板'   },
  { upTo: Infinity, it: 'Prestissimo', cn: '最急板' },
];

function tempoTerm(bpm) {
  for (const t of TEMPO_TERMS) {
    if (bpm <= t.upTo) return t;
  }
  return TEMPO_TERMS[TEMPO_TERMS.length - 1];
}

/* ── 重拍安排 ──
   返回数组，每项取值：
     2 = 重拍（每小节第一拍）
     1 = 次重拍（分组头）
     0 = 弱拍

   规则（按先后顺序判断）：
     1. 分子 ≤ 4          → 只有第一拍重
     2. 分子是 3 的倍数     → 每三拍一组
        （6/8、9/8、12/8、6/4、9/4 ……）
     3. 3/8 特殊处理       → 当作单拍子，不分三组
     4. 分子是 4 的倍数     → 每四拍一组（12/16、16/16 这类）
     5. 其它（5、7 等）     → 第一拍重，其余弱
*/
function accentPattern(num, den) {
  const pattern = new Array(num).fill(0);
  if (num <= 0) return pattern;

  pattern[0] = 2;                       // 第一拍总是重拍

  if (num <= 4) return pattern;         // 单拍子，够简单

  // 复拍子：分子是 3 的倍数（且大于 3）
  const isCompound = (num % 3 === 0);
  // 3/8 视为单拍子（三拍等分，不按 3 分组）
  const shouldGroup = isCompound && !(den === 8 && num === 3);

  if (shouldGroup) {
    for (let i = 3; i < num; i += 3) {
      pattern[i] = 1;
    }
    return pattern;
  }

  // 四拍分组：12/16、16/16 这类复拍子
  if (num % 4 === 0) {
    for (let i = 4; i < num; i += 4) {
      pattern[i] = 1;
    }
    return pattern;
  }

  // 其它（5、7、11 ……）：第一拍重，其余弱
  return pattern;
}

/* ── 拍号范围 ──
   分子 2-12，分母 2/4/6/8/12 */
const NUM_MIN = 2;
const NUM_MAX = 12;
const DEN_VALUES = [2, 4, 6, 8, 12];

function clampNum(n) {
  return Math.max(NUM_MIN, Math.min(NUM_MAX, Math.round(n)));
}

function stepDen(den, dir) {
  let i = DEN_VALUES.indexOf(den);
  if (i < 0) i = 1;                     // 认不出来就当 4/4
  i = (i + dir + DEN_VALUES.length) % DEN_VALUES.length;
  return DEN_VALUES[i];
}

/* ── 常用拍号（下拉里的快捷项）── */
const METER_PRESETS = [
  { num: 2, den: 4 },
  { num: 3, den: 4 },
  { num: 4, den: 4 },
  { num: 6, den: 8 },
  { num: 2, den: 2 },
];

/* ── BPM 范围 ── */
const BPM_MIN = 30;
const BPM_MAX = 250;

function clampBpm(b) {
  return Math.max(BPM_MIN, Math.min(BPM_MAX, Math.round(b)));
}

/* ── 拖动灵敏度 ──
   转一圈（360°）大约变化多少 BPM。
   90 的手感：转 60° 变 15 BPM，转一圈变 90。
   太小调不动，太大调不准。 */
const DRAG_BPM_PER_TURN = 90;

/* ─────────── 2. 音频引擎 ─────────── */
/* ══════════════════════════════════════════════════════════════
   节拍器音频引擎

   为什么不用 setTimeout 直接发声：
     setTimeout 的误差会累积（每拍偏几毫秒，一分钟后能差出半拍），
     而且页面切到后台会被浏览器降频到 1 次/秒，节拍直接乱掉。

   做法：Web Audio 的预调度（look-ahead scheduler）
     · 每 25ms 醒一次（这个频率够低，不影响性能）
     · 每次把未来 100ms 内该响的拍子，提前"预约"给音频时钟
     · 到点由音频硬件精确触发，不依赖 JS 定时精度
     结果：切后台、页面卡顿，节拍都不会漂。
   ══════════════════════════════════════════════════════════════ */

const LOOKAHEAD_MS = 25;      // 多久检查一次
const SCHEDULE_AHEAD = 0.2;   // 提前多少秒预排（2026-10 从 0.1 提到 0.2：
                              // 后台节流时 setInterval 可能被压到 250ms 一次，
                              // 0.1 的窗口不够用，会断拍）

/* ══════════════════════════════════════════════════════════
   节拍音色

   全部用 Web Audio 合成，不依赖外部音频文件。
   每个音色自己决定重拍/弱拍的频率、包络、噪声量。
   约定：kind 2 = 重拍，1 = 次强拍，0 = 弱拍。
   ══════════════════════════════════════════════════════════ */

/* 噪声只生成一次，反复使用 —— 原来每个拍都新建一个 buffer，很浪费 */
let _noiseBuf = null;
function noiseBuffer(ctx){
  if (_noiseBuf && _noiseBuf.sampleRate === ctx.sampleRate) return _noiseBuf;
  const n = Math.floor(ctx.sampleRate * 0.06);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  _noiseBuf = buf;
  return buf;
}

/* 发一声：正弦振荡 + 可选噪声，最通用的形状
   opt.dest —— 输出目的地。传了就连过去（节拍器要经过限幅总线），
   没传则直接连 destination（兼容旧调用）。 */
function hitTone(ctx, at, opt){
  const decay = opt.decay;
  const peak  = opt.peak;
  const dest  = opt.dest || ctx.destination;

  if (opt.freq){
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = opt.wave || 'sine';
    osc.frequency.setValueAtTime(opt.freq, at);
    if (opt.slide && opt.slide !== 1){
      osc.frequency.exponentialRampToValueAtTime(
        Math.max(20, opt.freq * opt.slide), at + decay);
    }
    env.gain.setValueAtTime(0, at);
    env.gain.linearRampToValueAtTime(peak, at + (opt.attack || 0.0012));
    env.gain.exponentialRampToValueAtTime(0.0001, at + decay);
    osc.connect(env);
    env.connect(dest);
    osc.start(at);
    osc.stop(at + decay + 0.01);
  }

  if (opt.noise){
    const src = ctx.createBufferSource();
    const env = ctx.createGain();
    let node = src;
    src.buffer = noiseBuffer(ctx);

    if (opt.noiseFreq){
      const f = ctx.createBiquadFilter();
      f.type = opt.noiseType || 'bandpass';
      f.frequency.value = opt.noiseFreq;
      f.Q.value = opt.noiseQ || 1.2;
      src.connect(f);
      node = f;
    }
    env.gain.setValueAtTime(peak * opt.noise, at);
    env.gain.exponentialRampToValueAtTime(0.0001, at + (opt.noiseDecay || 0.012));
    node.connect(env);
    env.connect(dest);
    src.start(at);
    src.stop(at + (opt.noiseDecay || 0.012) + 0.005);
  }
}

/* 音色表。freq/gain 都是 [弱拍, 次强拍, 重拍] */
const CLICK_STYLES = [
  {

      /* 金属咔哒：极短的方波 + 大量高频噪声 */

  {
    id: 'stick', name: '鼓棒', desc: '录音棚敲击',
    play(ctx, at, kind, vol, dest){

      /* 鼓棒敲边：中频 + 短噪声，带一点木质 */

      });

  },
  {

    play(ctx, at, kind, vol, dest){
      const f = kind === 2 ? 1320 : (kind === 1 ? 1100 : 880);
      const g = kind === 2 ? 1.0  : (kind === 1 ? 0.74 : 0.54);
      const decay = kind === 2 ? 0.085 : 0.065;
      hitTone(ctx, at, {
        freq: f, wave: 'square', decay: decay,
        peak: g * vol * 0.62, dest: dest,
        attack: 0.004
      });
    }
  },
  {
    id: 'kick', name: '低鼓', desc: '低频、沉稳',
    play(ctx, at, kind, vol, dest){
      const f = kind === 2 ? 150 : (kind === 1 ? 120 : 96);
      const g = kind === 2 ? 1.0 : (kind === 1 ? 0.72 : 0.50);
      /* 低频鼓：频率快速下滑，衰减稍长 */
      hitTone(ctx, at, {
        freq: f, slide: 0.42, decay: kind === 2 ? 0.12 : 0.095,
        peak: g * vol * 0.95, attack: 0.002, dest: dest,
        noise: 0.18, noiseFreq: 420, noiseType: 'lowpass', noiseDecay: 0.02
      });
    }
  },
  {
    id: 'soft', name: '柔音', desc: '轻、不抢拍',
    play(ctx, at, kind, vol, dest){
      const f = kind === 2 ? 880 : (kind === 1 ? 740 : 620);
      const g = kind === 2 ? 1.0 : (kind === 1 ? 0.70 : 0.48);
      /* 柔和的三角波，慢起音、长衰减 */
      hitTone(ctx, at, {
        freq: f, wave: 'triangle', slide: 0.92,
        decay: kind === 2 ? 0.10 : 0.08,
        peak: g * vol * 0.62, attack: 0.006, dest: dest
      });
    }
  }
];

const CLICK_BY_ID = {};
CLICK_STYLES.forEach(s => { CLICK_BY_ID[s.id] = s; });

function Metronome() {
  this.ctx = null;
  this.bus = null;            // 输出总线（含限幅），ensureCtx 时建立

  this.bpm = 120;
  this.num = 4;               // 分子
  this.den = 4;               // 分母
  this.pattern = [2, 0, 0, 0];  // 重拍安排

  this.playing = false;
  this.currentBeat = -1;      // 当前拍（用于界面高亮）
  this.nextNoteTime = 0;      // 下一拍的音频时间
  this.beatIndex = 0;         // 排到第几拍了
  this.timerId = null;

  this.onBeat = null;         // 每拍的回调（用于界面闪动）

  // 音量（0-1）
  this.volume = 0.7;

  // 音色（见 CLICK_STYLES）
  this.styleId = 'click';
}

/* ── 拍间隔（秒）──
   一拍的长度 = 全音符 ÷ 分母。
   而全音符 = 4 个四分音符，所以：

     拍长 = (60 / BPM) × (4 / 分母)

   验证：
     分母 4  → 60/BPM × 1    = 四分音符
     分母 8  → 60/BPM × 0.5  = 八分音符
     分母 2  → 60/BPM × 2    = 二分音符
     分母 6  → 60/BPM × 2/3  = 六分音符
     分母 12 → 60/BPM × 1/3  = 十二分音符
*/
Metronome.prototype.beatDuration = function () {
  const quarter = 60 / this.bpm;
  return quarter * (4 / this.den);
};

/* ── 确保音频上下文 ── */
Metronome.prototype.ensureCtx = function () {
  if (!this.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.buildBus();
  }
  if (this.ctx.state === 'suspended') {
    this.ctx.resume();
  }
  return this.ctx;
};

/* ── 输出总线 ──
   所有拍子汇入一个限幅器再到 destination。
   以前每声直连 destination：为了听得见而提高峰值后，
   重拍的正弦与噪声包络相加会超过 1.0 —— 手机扬声器上就是破音。
   限幅器 |x| > 0.8 才介入，正常音量下一丝不变，也不引入延迟。 */
Metronome.prototype.buildBus = function () {
  if (!this.ctx || this.bus) return this.bus;
  const g = this.ctx.createGain();
  g.gain.value = 1;
  const lim = this.ctx.createWaveShaper();
  lim.curve = limiterCurve();
  lim.oversample = '4x';
  g.connect(lim);
  lim.connect(this.ctx.destination);
  this.bus = g;
  return g;
};

/* ── 合成一声"嗒" ──
   用正弦波 + 极快衰减，接近木鱼/电子节拍器的听感。
   重拍：音高更高、更长、更响。
   次重拍：中间水平。
   弱拍：最低最轻。

   at  —— 何时发声（音频时间轴）
   kind —— 2 重拍 / 1 次重拍 / 0 弱拍
*/
Metronome.prototype.click = function (at, kind) {
  const style = CLICK_BY_ID[this.styleId] || CLICK_STYLES[0];
  style.play(this.ctx, at, kind, this.volume, this.bus || this.buildBus());
};


/* ── 调度循环 ──
   把 SCHEDULE_AHEAD 秒内该响的拍子全部预约出去。 */
Metronome.prototype.scheduler = function () {
  const ctx = this.ctx;
  if (!ctx || !this.playing) return;

  /* 追上进度
     页面卡顿、切后台回来时，nextNoteTime 可能已经落在过去。
     原来的 while 会把这些「已经错过」的拍子全部补发一遍 ——
     Web Audio 对过去的时间戳会立即发声，听起来就是一连串「咯咯咯咯」连击。
     正确做法：直接跳过它们，把节拍相位对齐到「现在」。 */
  const beatDur = this.beatDuration();
  if (this.nextNoteTime < ctx.currentTime - 0.02) {
    const missed = Math.ceil((ctx.currentTime - this.nextNoteTime) / beatDur);
    this.nextNoteTime += missed * beatDur;
    this.beatIndex = (this.beatIndex + missed) % this.num;
    this.skippedBeats = (this.skippedBeats || 0) + missed;
  }

  while (this.nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    const kind = this.pattern[this.beatIndex] !== undefined
      ? this.pattern[this.beatIndex]
      : 0;

    this.click(this.nextNoteTime, kind);

    // 通知界面（延后到真正发声的时刻再闪，避免提前闪）
    if (this.onBeat) {
      const delay = (this.nextNoteTime - ctx.currentTime) * 1000;
      const idx = this.beatIndex;
      setTimeout(() => {
        if (this.playing) this.onBeat(idx, kind);
      }, Math.max(0, delay));
    }

    // 推进到下一拍
    this.nextNoteTime += beatDur;
    this.beatIndex = (this.beatIndex + 1) % this.num;
  }
};

/* ── 开始 ── */
Metronome.prototype.start = function () {
  if (this.playing) return;
  this.ensureCtx();

  this.playing = true;
  this.beatIndex = 0;
  this.skippedBeats = 0;
  // 稍微延后一点起拍，避免第一声被切掉
  this.nextNoteTime = this.ctx.currentTime + 0.06;

  this.scheduler();
  this.timerId = setInterval(() => this.scheduler(), LOOKAHEAD_MS);
};

/* ── 停止 ── */
Metronome.prototype.stop = function () {
  this.playing = false;
  if (this.timerId) {
    clearInterval(this.timerId);
    this.timerId = null;
  }
  this.beatIndex = 0;
  this.currentBeat = -1;
};

/* ── 改速度（运行中也能立即生效）── */
Metronome.prototype.setBpm = function (bpm) {
  this.bpm = clampBpm(bpm);
};

/* ── 改拍号 ──
   同时重算重拍安排。如果正在响，下一小节生效（不打断当前小节）。 */
Metronome.prototype.setMeter = function (num, den) {
  this.num = clampNum(num);
  this.den = den;
  this.pattern = accentPattern(this.num, this.den);

  if (this.beatIndex >= this.num) {
    this.beatIndex = 0;
  }
};

/* ── 拍号文字 ── */
Metronome.prototype.meterLabel = function () {
  return this.num + '/' + this.den;
};


/* ─────────── 3. 界面控制 ─────────── */

/* ══════════════════════════════════════════════════════════════
   节拍器界面（由 tools/add_metronome_js.py 插入）
   ══════════════════════════════════════════════════════════════ */

(function initMetronome(){

  /* ══════════════════════════════════════════════════════
     元素
     ══════════════════════════════════════════════════════ */

  const el = {
    tabs:       document.getElementById('appTabs'),
    tabTuner:   document.getElementById('tabTuner'),
    tabMetro:   document.getElementById('tabMetro'),
    pageTuner:  document.getElementById('pageTuner'),
    pageMetro:  document.getElementById('pageMetro'),

    meterBtn:   document.getElementById('meterBtn'),
    meterLabel: document.getElementById('meterLabel'),
    meterSheet: document.getElementById('meterSheet'),
    meterClose: document.getElementById('meterClose'),
    numWheel:   document.getElementById('numWheel'),
    denWheel:   document.getElementById('denWheel'),
    soundBtn:   document.getElementById('soundBtn'),
    soundLabel: document.getElementById('soundLabel'),
    soundSheet: document.getElementById('soundSheet'),
    soundClose: document.getElementById('soundClose'),
    soundGrid:  document.getElementById('soundGrid'),

    ring:       document.getElementById('metroRing'),
    center:     document.getElementById('ringCenter'),
    progress:   document.getElementById('ringProgress'),
    pulseRing:  document.getElementById('pulseRing'),
    bpmValue:   document.getElementById('bpmValue'),
    bpmInput:   document.getElementById('bpmInput'),
    bpmTerm:    document.getElementById('bpmTerm'),
    beatDots:   document.getElementById('beatDots'),
    vol:        document.getElementById('volSeg'),
  };

  // 缺任何一个都不往下走 —— 后面到处在用，
  // 中途爆 null 更难查。
  const missing = Object.keys(el).filter(k => !el[k]);
  if (missing.length) {
    console.warn('[节拍器] 缺少元素，已跳过初始化：', missing.join(', '));
    return;
  }

  const metro = new Metronome();

  /* ── 圆环尺寸 → CSS 变量 ──
     量出圆环直径写进 --ring-size，圆内的数字、术语按它缩放。
     圆环大小取决于屏幕高度和宽度，各机型差异很大，
     量着来才能保证“数字约占圆环 1/3”在真机上成立。 */
  function syncRingSize(){
    const area = el.ring.parentElement;
    if (!area) return;

    const maxD = parseFloat(getComputedStyle(area).getPropertyValue('--ring-max')) || 310;
    const w = area.clientWidth;
    const h = area.clientHeight;

    if (!(w > 0) || !(h > 0)) return;

    // 取「可用宽 / 可用高 / 上限」三者最小 —— 三者都不依赖圆环内容，
    // 所以不会出现「尺寸依赖字号、字号又依赖尺寸」的塌缩。
    const d = Math.max(120, Math.min(w, h, maxD));
    el.ring.style.setProperty('--ring-size', d.toFixed(1) + 'px');
  }
  if (window.ResizeObserver) {
    // 观察外层区域，不能观察圆环自己 —— 那会形成反馈环。
    new ResizeObserver(syncRingSize).observe(el.ring.parentElement);
  }
  syncRingSize();
  window.addEventListener('resize', syncRingSize);
  window.addEventListener('orientationchange', syncRingSize);

  /* ── 音量：16 格分段刻度 ──
     指针位置 → 音量（连续映射，不卡格）。
     同时也支持键盘方向键，以及 role=slider 的取值播报。 */
  const VOL_SEGS = 16;

  function buildVolSegs(){
    let h = '';
    for (let i = 0; i < VOL_SEGS; i++) h += '<i></i>';
    el.vol.innerHTML = h;
  }

  function paintVolume(){
    const n = Math.round(metro.volume * VOL_SEGS);
    const items = el.vol.children;
    for (let i = 0; i < items.length; i++) {
      items[i].classList.toggle('on', i < n);
    }
    el.vol.setAttribute('aria-valuenow', String(Math.round(metro.volume * 100)));
  }

  function setVolFromX(clientX){
    const r = el.vol.getBoundingClientRect();
    if (r.width <= 0) return;
    const t = (clientX - r.left) / r.width;
    metro.volume = Math.max(0, Math.min(1, t));
    paintVolume();
  }

  let volDown = false;
  el.vol.addEventListener('pointerdown', (e) => {
    volDown = true;
    try { el.vol.setPointerCapture(e.pointerId); } catch (_) {}
    setVolFromX(e.clientX);
  });
  el.vol.addEventListener('pointermove', (e) => {
    if (volDown) setVolFromX(e.clientX);
  });
  function volUp(e){
    volDown = false;
    try { el.vol.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  el.vol.addEventListener('pointerup', volUp);
  el.vol.addEventListener('pointercancel', volUp);

  el.vol.addEventListener('keydown', (e) => {
    let d = 0;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown')  d = -0.05;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = 0.05;
    else if (e.key === 'Home') { metro.volume = 0; paintVolume(); e.preventDefault(); return; }
    else if (e.key === 'End')  { metro.volume = 1; paintVolume(); e.preventDefault(); return; }
    else return;
    e.preventDefault();
    metro.volume = Math.max(0, Math.min(1, metro.volume + d));
    paintVolume();
  });

  buildVolSegs();
  paintVolume();

  // 是否正在输入速度（切页、空格键都要看这个）
  let editing = false;
  let currentPage = 'tuner';

  /* ══════════════════════════════════════════════════════
     页面切换（胶囊滑块）
     ══════════════════════════════════════════════════════ */

  function switchPage(page) {
    if (page === currentPage) return;
    currentPage = page;

    const isMetro = (page === 'metro');

    el.tabTuner.classList.toggle('active', !isMetro);
    el.tabMetro.classList.toggle('active',  isMetro);
    el.tabs.dataset.index = isMetro ? '1' : '0';

    el.pageTuner.classList.toggle('active', !isMetro);
    el.pageMetro.classList.toggle('active',  isMetro);

    document.body.dataset.page = page;

    /* 设置面板跨页残留：在调音页开着面板切到节拍页，
       面板里只剩「下载安装」；若在 App 内连这一项也没有，
       就会露出一个空条。切页时直接收起。 */
    try {
      const sp = document.getElementById('settingsPanel');
      const sb = document.getElementById('settingsBtn');
      if (sp && sp.classList.contains('open')) {
        sp.classList.remove('open');
        if (sb) sb.classList.remove('active');
      }
    } catch (e) {}

    if (isMetro) {
      // 切到节拍页：停掉调音器，释放麦克风。
      // running/stop 在调音器自己的闭包里，这里拿不到，
      // 所以看麦克风状态灯（由调音器维护），再点它的按钮触发停止。
      try {
        const mic = document.getElementById('micStatus');
        const tunerBtn = document.getElementById('startBtn');
        if (mic && mic.classList.contains('on') && tunerBtn) {
          tunerBtn.click();
        }
      } catch (e) {}

      // 节拍页初始是隐藏的（display:none），刚切过来时之前量的尺寸是 0。
      // ResizeObserver 通常会补触发，但不依赖它 —— 等布局落定后显式量一次。
      requestAnimationFrame(syncRingSize);
    } else {
      // 切回调音页：节拍器停掉。
      // 它的声音会被麦克风收进去，导致音高检测乱跳。
      if (metro.playing) stopMetro();
    }

    // 正在输入速度的话，先结束输入（避免输入框一直张着）
    if (editing) endEdit(true);

    // 顺手收起设置面板 —— 切页后还张着会显得乱
    try {
      const panel = document.getElementById('settingsPanel');
      const gear  = document.getElementById('settingsBtn');
      if (panel && panel.classList.contains('open')) {
        panel.classList.remove('open');
        if (gear) gear.classList.remove('active');
      }
    } catch (e) {}
  }

  el.tabTuner.addEventListener('click', () => switchPage('tuner'));
  el.tabMetro.addEventListener('click', () => switchPage('metro'));

  /* ══════════════════════════════════════════════════════
     拍号选择面板
     ══════════════════════════════════════════════════════ */

  /* ── 双列滚轮 ──
     不用原生滚动：每项按相对位置绝对定位，拖动换算成索引变化。
     这样能精确控制居中，也方便每跨一格震一下。 */
  const WHEEL_H  = 46;                             // 单项高度
  const NUM_LIST = [];
  for (let n = NUM_MIN; n <= NUM_MAX; n++) NUM_LIST.push(n);
  const DEN_LIST = DEN_VALUES.slice();

  function buzz(ms){
    try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (_) {}
  }

  // 只渲染中间 ±2 行 —— 屏幕上看得见的就这几行，多了也白画
  function makeWheel(rootEl, list, getIdx, onPick){
    function render(){
      const cur = getIdx();
      let h = '';
      for (let k = -2; k <= 2; k++) {
        const i = cur + k;
        if (i < 0 || i >= list.length) continue;
        const cls = k === 0 ? 'sel' : (Math.abs(k) === 1 ? 'near' : 'far');
        h += '<div class="meter-wheel-item ' + cls + '" '
           + 'style="transform:translateY(' + (k * WHEEL_H) + 'px)">'
           + list[i] + '</div>';
      }
      rootEl.innerHTML = h;
      rootEl.setAttribute('aria-valuemin', String(list[0]));
      rootEl.setAttribute('aria-valuemax', String(list[list.length - 1]));
      rootEl.setAttribute('aria-valuenow', String(list[cur]));
    }

    let drag = null;
    rootEl.addEventListener('pointerdown', (e) => {
      drag = { y: e.clientY, start: getIdx() };
      try { rootEl.setPointerCapture(e.pointerId); } catch (_) {}
    });

    rootEl.addEventListener('pointermove', (e) => {
      if (!drag) return;
      // 往上拖 = 列表往上走 = 索引增大
      const step = Math.round((drag.y - e.clientY) / WHEEL_H);
      let i = drag.start + step;
      i = Math.max(0, Math.min(list.length - 1, i));
      if (i !== getIdx()) {
        onPick(i);
        buzz(8);
        render();
      }
    });

    function endDrag(){ drag = null; }
    rootEl.addEventListener('pointerup', endDrag);
    rootEl.addEventListener('pointercancel', endDrag);

    // 键盘：上下键一格一格走
    rootEl.addEventListener('keydown', (e) => {
      let d = 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') d = -1;
      else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') d = 1;
      else return;
      e.preventDefault();
      const i = Math.max(0, Math.min(list.length - 1, getIdx() + d));
      if (i !== getIdx()) { onPick(i); buzz(8); render(); }
    });

    render();
    return render;
  }

  const renderNumWheel = makeWheel(
    el.numWheel, NUM_LIST,
    () => NUM_LIST.indexOf(metro.num),
    (i) => setMeter(NUM_LIST[i], metro.den)
  );
  const renderDenWheel = makeWheel(
    el.denWheel, DEN_LIST,
    () => DEN_LIST.indexOf(metro.den),
    (i) => setMeter(metro.num, DEN_LIST[i])
  );

  function renderWheels(){ renderNumWheel(); renderDenWheel(); }

  let sheetPushed = false;
  let ignorePop = false;
  function sheetsOpen(){
    const sp = document.getElementById('settingsPanel');
    return (sp && sp.classList.contains('open'))
      || el.meterSheet.classList.contains('open')
      || el.soundSheet.classList.contains('open');
  }
  function rememberSheet(){
    if (sheetPushed) return;
    try {
      history.pushState({ shixinSheet: 1 }, '');
      sheetPushed = true;
    } catch (e) {}
  }
  function forgetSheet(){
    if (sheetsOpen() || !sheetPushed) return;
    sheetPushed = false;
    ignorePop = true;
    try { history.back(); } catch (e) { ignorePop = false; }
  }
  window.__sheetRemember = rememberSheet;
  window.__sheetForget = forgetSheet;
  window.addEventListener('popstate', () => {
    if (ignorePop) { ignorePop = false; return; }
    sheetPushed = false;
    const sp = document.getElementById('settingsPanel');
    const sb = document.getElementById('settingsBtn');
    if (sp) sp.classList.remove('open');
    if (sb) sb.classList.remove('active');
    el.meterSheet.classList.remove('open');
    el.soundSheet.classList.remove('open');
  });

  function openSheet() {
    closeSoundSheet(false);
    const sp = document.getElementById('settingsPanel');
    const sb = document.getElementById('settingsBtn');
    if (sp) sp.classList.remove('open');
    if (sb) sb.classList.remove('active');
    el.meterSheet.classList.add('open');
    rememberSheet();
  }
  function closeSheet() {
    el.meterSheet.classList.remove('open');
    forgetSheet();
  }

  el.meterBtn.addEventListener('click', openSheet);
  el.meterClose.addEventListener('click', closeSheet);
  // 点遮罩也能关
  el.meterSheet.addEventListener('click', (e) => {
    if (e.target === el.meterSheet) closeSheet();
  });

  /* ══════════════════════════════════════════════════════
     音色选择
     卡片列表由 CLICK_STYLES 生成；选中项存入 localStorage，
     下次打开还在。点卡片会立即试听一声（重拍）。
     ══════════════════════════════════════════════════════ */

  const SOUND_KEY = 'shixin-metro-sound';
  const BPM_KEY = 'shixin-metro-bpm';
  const METER_KEY = 'shixin-metro-meter';

  function readStore(key){
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeStore(key, value){
    try { localStorage.setItem(key, String(value)); } catch (e) {}
  }

  /* 不是整数、或超出 30–250，就回到默认 120。 */
  function parseStoredBpm(raw){
    if (typeof raw !== 'string' || !/^\d{1,3}$/.test(raw)) return 120;
    const n = parseInt(raw, 10);
    if (n < BPM_MIN || n > BPM_MAX) return 120;
    return n;
  }
  /* 分子 2–12，分母只能是 2/4/6/8/12。格式必须是「6/8」。 */
  function parseStoredMeter(raw){
    const fallback = { num: 4, den: 4 };
    if (typeof raw !== 'string') return fallback;
    const m = /^(\d{1,2})\/(\d{1,2})$/.exec(raw);
    if (!m) return fallback;
    const num = parseInt(m[1], 10);
    const den = parseInt(m[2], 10);
    if (num < NUM_MIN || num > NUM_MAX) return fallback;
    if (DEN_VALUES.indexOf(den) < 0) return fallback;
    return { num: num, den: den };
  }

  function renderSounds(){
    el.soundGrid.innerHTML = '';
    CLICK_STYLES.forEach(function(s){
      const b = document.createElement('button');
      b.className = 'sound-card' + (metro.styleId === s.id ? ' on' : '');
      b.type = 'button';
      b.dataset.id = s.id;
      b.innerHTML = '<span class="sname">' + s.name + '</span>' +
                    '<span class="sdesc">' + s.desc + '</span>';
      b.addEventListener('click', function(){ pickSound(s.id); });
      el.soundGrid.appendChild(b);
    });
  }

  function pickSound(id){
    metro.styleId = id;
    const s = CLICK_BY_ID[id];
    el.soundLabel.textContent = s ? s.name : '音色';

    /* 不重建整个网格 —— 只切换选中类，
       否则每点一下就重建 7 个按钮，过渡动画会被打断 */
    el.soundGrid.querySelectorAll('.sound-card').forEach(function(c){
      c.classList.toggle('on', c.dataset.id === id);
    });

    /* 试听：即使没在播放也给一声重拍，让人听到区别 */
    if (!metro.playing){
      metro.ensureCtx();
      metro.click(metro.ctx.currentTime + 0.02, 2);
    }

    try { localStorage.setItem(SOUND_KEY, id); } catch (e) {}
  }

  function openSoundSheet(){
    el.meterSheet.classList.remove('open');
    const sp = document.getElementById('settingsPanel');
    const sb = document.getElementById('settingsBtn');
    if (sp) sp.classList.remove('open');
    if (sb) sb.classList.remove('active');
    renderSounds();
    el.soundSheet.classList.add('open');
    rememberSheet();
  }
  function closeSoundSheet(notify){
    el.soundSheet.classList.remove('open');
    if (notify !== false) forgetSheet();
  }

  function bindSheetDrag(grab, closeFn){
    const body = grab.parentElement;
    let dragging = false, startY = 0, dy = 0;
    grab.addEventListener('pointerdown', (e) => {
      if (!grab.closest('.settings-panel.open, .meter-sheet.open, .sound-sheet.open')) return;
      dragging = true;
      startY = e.clientY;
      dy = 0;
      body.style.transition = 'none';
      try { grab.setPointerCapture(e.pointerId); } catch (err) {}
    });
    grab.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      body.style.transform = 'translateY(' + dy + 'px)';
    });
    function end(){
      if (!dragging) return;
      dragging = false;
      body.style.transition = '';
      body.style.transform = '';
      if (dy > 72) closeFn();
    }
    grab.addEventListener('pointerup', end);
    grab.addEventListener('pointercancel', end);
  }
  bindSheetDrag(document.getElementById('settingsGrab'), () => {
    const sp = document.getElementById('settingsPanel');
    const sb = document.getElementById('settingsBtn');
    if (sp) sp.classList.remove('open');
    if (sb) sb.classList.remove('active');
    forgetSheet();
  });
  bindSheetDrag(document.getElementById('meterGrab'), closeSheet);
  bindSheetDrag(document.getElementById('soundGrab'), closeSoundSheet);

  el.soundBtn.addEventListener('click', openSoundSheet);
  el.soundClose.addEventListener('click', closeSoundSheet);
  el.soundSheet.addEventListener('click', function(e){
    if (e.target === el.soundSheet) closeSoundSheet();
  });

  /* 恢复上次选的音色 */
  (function restoreSound(){
    let saved = null;
    try { saved = localStorage.getItem(SOUND_KEY); } catch (e) {}
    if (saved && CLICK_BY_ID[saved]) metro.styleId = saved;
    const s = CLICK_BY_ID[metro.styleId];
    el.soundLabel.textContent = s.name;
    renderSounds();
  })();

  /* ══════════════════════════════════════════════════════
     拍号设置
     ══════════════════════════════════════════════════════ */

  function setMeter(num, den) {
    metro.setMeter(num, den);

    el.meterLabel.textContent = metro.num + '/' + metro.den;
    renderWheels();
    buildBeatDots();
    clearBeatHighlight();
    writeStore(METER_KEY, metro.num + '/' + metro.den);
  }

  /* ══════════════════════════════════════════════════════
     拍点指示
     ══════════════════════════════════════════════════════ */

  function buildBeatDots() {
    el.beatDots.innerHTML = '';
    // 拍子多的话缩小间距，避免挤成一片
    el.beatDots.classList.toggle('dense', metro.num > 8);

    for (let i = 0; i < metro.num; i++) {
      const d = document.createElement('div');
      d.className = 'beat-dot' + (metro.pattern[i] === 2 ? ' accent' : '');
      el.beatDots.appendChild(d);
    }
  }

  function clearBeatHighlight() {
    el.beatDots.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('on'));
    el.pulseRing.classList.remove('beat');
  }

  function highlightBeat(index, kind) {
    const dots = el.beatDots.querySelectorAll('.beat-dot');
    dots.forEach((d, i) => d.classList.toggle('on', i === index));

    // 脉冲：先移除再加，让动画能重播
    el.pulseRing.classList.remove('beat');
    void el.pulseRing.offsetWidth;
    el.pulseRing.classList.add('beat');
  }

  /* ══════════════════════════════════════════════════════
     BPM 显示
     ══════════════════════════════════════════════════════ */

  // 进度弧：270° 的弧，按 BPM 在范围内的比例显示
  const RING_R = 90;
  const RING_C = 2 * Math.PI * RING_R;      // 周长
  const ARC_LEN = RING_C * 0.75;            // 270° 的弧长

  function updateProgress() {
    const ratio = (metro.bpm - BPM_MIN) / (BPM_MAX - BPM_MIN);
    const len = ARC_LEN * Math.max(0, Math.min(1, ratio));
    el.progress.style.strokeDasharray = len + ' ' + RING_C;
  }

  function paintBpm() {
    el.bpmValue.textContent = metro.bpm;
    const t = tempoTerm(metro.bpm);
    el.bpmTerm.textContent = t.it;
    updateProgress();
  }

  function setBpm(bpm) {
    const old = metro.bpm;
    metro.setBpm(bpm);
    if (metro.bpm === old) return;
    paintBpm();
    writeStore(BPM_KEY, metro.bpm);
  }

  /* ══════════════════════════════════════════════════════
     键盘输入 BPM（点数字进入）
     ══════════════════════════════════════════════════════ */

  function beginEdit() {
    if (editing) return;
    editing = true;

    el.bpmInput.value = metro.bpm;
    el.bpmValue.classList.add('hidden');
    el.bpmInput.classList.add('show');

    // 聚焦并全选，方便直接覆盖输入
    setTimeout(() => {
      el.bpmInput.focus();
      try { el.bpmInput.setSelectionRange(0, 9); } catch (e) {}
    }, 30);
  }

  function endEdit(commit) {
    if (!editing) return;
    editing = false;

    if (commit) {
      const raw = (el.bpmInput.value || '').replace(/[^0-9]/g, '');
      if (raw) {
        setBpm(clampBpm(parseInt(raw, 10)));
      }
    }

    el.bpmInput.classList.remove('show');
    el.bpmValue.classList.remove('hidden');
    paintBpm();
  }

  el.bpmValue.addEventListener('click', (e) => {
    e.stopPropagation();
    beginEdit();
  });

  el.bpmInput.addEventListener('input', () => {
    // 只留数字，最多 3 位
    const clean = el.bpmInput.value.replace(/[^0-9]/g, '').slice(0, 3);
    if (clean !== el.bpmInput.value) el.bpmInput.value = clean;
  });

  el.bpmInput.addEventListener('keydown', (e) => {
    e.stopPropagation();          // 不要触发空格键的播放/停止
    if (e.key === 'Enter') {
      e.preventDefault();
      endEdit(true);
      el.bpmInput.blur();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      endEdit(false);
      el.bpmInput.blur();
    }
  });

  // 失焦就确认（手机上点空白处也会走这里）
  el.bpmInput.addEventListener('blur', () => endEdit(true));

  // 在输入框上的触摸/鼠标操作不要传给圆环
  ['pointerdown', 'pointermove', 'pointerup', 'click'].forEach(ev => {
    el.bpmInput.addEventListener(ev, (e) => e.stopPropagation());
  });

  /* ══════════════════════════════════════════════════════
     圆环拖动调速
     ══════════════════════════════════════════════════════ */

  let drag = null;

  // 触点相对圆心的角度（度，顺时针，0 = 正右）
  function angleAt(clientX, clientY) {
    const rect = el.ring.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
  }

  /* 圆形命中检测：圓环元素的盒子是外接正方形，四角的空白不该响应。
     ratio = 圆半径 / 半宽。SVG viewBox 200、圆 r=90 → 90 / 100。 */
  const RING_RATIO = 90 / 100;
  function inRing(clientX, clientY) {
    const rect = el.ring.getBoundingClientRect();
    if (!rect.width || !rect.height) return false;
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const rad = Math.min(rect.width, rect.height) / 2 * RING_RATIO + 2;
    const dx = clientX - cx, dy = clientY - cy;
    return dx * dx + dy * dy <= rad * rad;
  }

  function onDown(e) {
    // 圆形内的输入要素不算拖动：数字、输入框
    if (e.target.closest) {
      if (e.target.closest('.ring-bpm')) return;
      if (e.target.closest('.ring-bpm-input')) return;
    }

    // 正在输入速度时，先结束输入，不要误触拖动
    if (editing) return;

    /* 严格限定在圆内：外接正方形的四角不响应，
       所以那里按下既不会开始节拍器，也不会启动拖动。
       按下后拖到圆外仍继续拖动（见 onMove）。 */
    if (!inRing(e.clientX, e.clientY)) return;

    const x = e.clientX, y = e.clientY;
    drag = {
      last:   angleAt(x, y),
      start:  metro.bpm,
      accum:  0,
      moved:  false,
    };

    try { el.ring.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onMove(e) {
    if (!drag) return;

    const a = angleAt(e.clientX, e.clientY);

    // 角度增量，处理跨越 ±180° 的回绕
    let d = a - drag.last;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;

    drag.accum += d;
    drag.last = a;

    // 位移太小就当没动 —— 避免手指抖动误改速度
    if (!drag.moved) {
      if (Math.abs(drag.accum) < 3) return;
      drag.moved = true;
    }

    const deltaBpm = drag.accum / 360 * DRAG_BPM_PER_TURN;
    setBpm(Math.round(drag.start + deltaBpm));

    e.preventDefault();
  }

  function onUp(e) {
    if (!drag) return;
    const wasDrag = drag.moved;
    drag = null;
    try { el.ring.releasePointerCapture(e.pointerId); } catch (err) {}

    // 只是点了一下（没拖动）→ 当作播放/停止
    if (!wasDrag) {
      if (metro.playing) stopMetro(); else startMetro();
    }
  }

  /* ══════════════════════════════════════════════════════
     播放 / 停止

     没有单独的播放按钮 —— 点圆环任意位置（含圆心）即开始/停止。
     播放中通过数字变主色来表示状态。
     ══════════════════════════════════════════════════════ */

  function startMetro() {
    metro.onBeat = (index, kind) => highlightBeat(index, kind);
    metro.start();

    el.bpmValue.classList.add('playing');
    el.center.classList.add('playing');
    el.ring.setAttribute('aria-label', '节拍器运行中，点一下停止');
  }

  function stopMetro() {
    metro.stop();

    el.bpmValue.classList.remove('playing');
    el.center.classList.remove('playing');
    el.ring.setAttribute('aria-label', '节拍器已停止，点一下开始');
    clearBeatHighlight();
  }

  el.ring.addEventListener('pointerdown', onDown);
  el.ring.addEventListener('pointermove', onMove);
  el.ring.addEventListener('pointerup', onUp);
  el.ring.addEventListener('pointercancel', () => { drag = null; });

  // 空格键快捷开关（输入框里打字时不触发）
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (editing) return;                              // 正在输入速度
    if (currentPage !== 'metro') return;
    if (el.meterSheet.classList.contains('open')) return;
    if (el.soundSheet.classList.contains('open')) return;
    e.preventDefault();
    if (metro.playing) stopMetro(); else startMetro();
  });

  /* ══════════════════════════════════════════════════════
     切到后台时清掉高亮（播放不停 —— 用户可能就想让它响着）
     ══════════════════════════════════════════════════════ */

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearBeatHighlight();
  });

  /* ══════════════════════════════════════════════════════
     初始化
     ══════════════════════════════════════════════════════ */

  const bootMeter = parseStoredMeter(readStore(METER_KEY));
  const bootBpm = parseStoredBpm(readStore(BPM_KEY));
  setMeter(bootMeter.num, bootMeter.den);
  metro.setBpm(bootBpm);
  paintBpm();                 // 初始化时直接画，不能走 setBpm（值没变会跳过）
  writeStore(BPM_KEY, metro.bpm);
  el.ring.setAttribute('aria-label', '节拍器已停止，点一下开始');
  document.body.dataset.page = 'tuner';
  el.tabs.dataset.index = '0';

})();

</script>
<!-- /METRONOME-JS-INSERTED -->
</body>
