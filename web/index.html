<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>调音·节拍</title>
<style>
  /* Roboto 只覆盖西文和数字（拉丁子集，本地 woff2）。
     中文不在 unicode-range 里，直接用后面的系统黑体，不访问 Google Fonts。 */
  @font-face{
    font-family:"Roboto";
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url("fonts/roboto-400.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303,U+0309,U+0323,U+2002,U+2009,U+200B,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Roboto";
    font-style:normal;
    font-weight:500;
    font-display:swap;
    src:url("fonts/roboto-500.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303,U+0309,U+0323,U+2002,U+2009,U+200B,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Roboto";
    font-style:normal;
    font-weight:700;
    font-display:swap;
    src:url("fonts/roboto-700.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303,U+0309,U+0323,U+2002,U+2009,U+200B,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2044,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD;
  }
  :root{
    --bg:#0e0c0a;
    --surface:#1a1815;
    --surface-2:#211f1b;
    --surface-3:#2b2823;
    --border:rgba(240,235,227,.14);
    --border-2:rgba(240,235,227,.22);
    --text:#f0ebe3;
    --text-2:#c8bba8;
    --text-3:#a89c8e;

    /* 主题色（由 tools/ui_tool.py 生成）*/
    --accent:#d4a574;
    --accent-light:#e3bd93;
    --accent-soft:rgba(212,165,116,.13);
    --accent-rgb:212,165,116;
    --accent-light-rgb:227,189,147;

    /* 「对音准」用同色系更亮的一层金 —— 不再用绿色 */
    --success:#f0cb8c;
    --success-rgb:240,203,140;
    --warn:#e0a458;
    --warn-rgb:224,164,88;

    /* 品牌金色：只用在 logo 与品牌名上 */
    --gold:#d4a574;
  }
  /* 设计令牌。放在第二个 :root 里，避免「改界面」重写配色块时把间距和字号清掉。 */
  :root{
    --space-1:4px;
    --space-2:8px;
    --space-3:12px;
    --space-4:16px;
    --space-5:24px;
    --space-6:32px;
    --space-8:48px;

    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --radius-xl:24px;

    --outline:var(--border);
    --outline-strong:var(--border-2);
    --outline-accent:rgba(var(--accent-rgb),.72);
    --surface-selected:rgba(var(--accent-rgb),.16);

    --elev-1:0 1px 2px rgba(0,0,0,.40);
    --elev-2:0 8px 24px rgba(0,0,0,.46);
    --elev-3:0 18px 44px rgba(0,0,0,.58), 0 2px 8px rgba(0,0,0,.36);

    --fs-title:18px;
    --fs-body:15px;
    --fs-caption:13px;
    --fs-note:96px;
    --fs-cents:22px;

    /* 字重跟字号对齐：标题 Medium，正文/说明 Regular，强调数字 Bold */
    --fw-title:500;
    --fw-body:400;
    --fw-caption:400;
    --fw-bold:700;
    --font-sans:"Roboto","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    --t-press:120ms cubic-bezier(.2,0,0,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;height:100%}
  body{
    min-height:100dvh;
    display:flex;align-items:stretch;justify-content:center;
    padding:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -8%, rgba(var(--accent-rgb),.07), transparent 62%),
      radial-gradient(ellipse 70% 45% at 50% 108%, rgba(var(--accent-rgb),.035), transparent 70%);
    color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
    font-weight:400;
    letter-spacing:.005em;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:100%;
    min-height:100dvh;
    height:100dvh;
    position:relative;
    background:var(--surface);
    border:0;
    border-radius:0;
    padding:calc(var(--space-4) + env(safe-area-inset-top)) var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    row-gap:0;
    box-shadow:none;
    overflow:hidden;
  }
  /* 大屏幕时回到居中卡片 */
  @media (min-width: 520px){
    body{padding:var(--space-5);align-items:center}
    .app{
      max-width:460px;
      height:auto;
      min-height:calc(100dvh - 48px);
      max-height:calc(100dvh - 48px);
      border:1px solid var(--outline);
      border-radius:var(--radius-xl);
      padding:var(--space-5);
      box-shadow:var(--elev-3), inset 0 1px 0 rgba(240,235,227,.04);
    }
  }

  /* ============ 顶部 ============ */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    gap:var(--space-2);margin:0;flex:none;
    position:relative;
  }
  .brand{
    display:flex;flex-direction:column;align-items:center;gap:var(--space-1);
    flex:none;
  }
  .brand-mark{width:36px;height:36px;flex:none;display:block}
  .brand-text{display:flex;flex-direction:column;align-items:center}
  .brand-cn{
    font-size:var(--fs-caption);font-weight:var(--fw-title);line-height:1;
    letter-spacing:.04em;color:var(--gold);
    white-space:nowrap;
  }
  .brand-en{ display:none }

  /* 右侧：小太阳在上，麦克风状态在它正下方 */
  .header-right{
    display:flex;flex-direction:column;align-items:center;
    gap:var(--space-1);flex:none;
  }

  .mic{
    display:flex;align-items:center;gap:var(--space-1);
    font-size:var(--fs-caption);font-weight:var(--fw-caption);color:var(--text-2);
    letter-spacing:.02em;
    order:2;
    white-space:nowrap;
  }
  .mic .dot{
    width:6px;height:6px;border-radius:50%;
    background:#6a6156;transition:background var(--t-press), box-shadow var(--t-press);
  }
  .mic.on .dot{background:var(--success);box-shadow:0 0 6px var(--success)}
  .mic.on{color:var(--accent-light)}

  .settings-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);cursor:pointer;
    width:40px;height:40px;border-radius:var(--radius-md);
    display:flex;align-items:center;justify-content:center;
    transition:background var(--t-press), color var(--t-press), transform var(--t-press), box-shadow var(--t-press);
    padding:0;
    order:1;
  }
  .settings-btn:active{background:var(--surface-3);transform:scale(.98)}
  .settings-btn.active{
    color:var(--accent-light);
    background:var(--surface-selected);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
  }
  /* 页面图标：24 网格、圆角线条。颜色跟按钮走，默认次要文字，选中为金。 */
  .icon{
    width:24px;height:24px;flex:none;display:block;
    fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  }

  /* 设置：底部抽屉。遮罩淡入，卡片从下方滑入。 */
  .settings-panel{
    position:fixed;inset:0;
    z-index:70;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity 200ms cubic-bezier(.2,0,0,1);
  }
  .settings-panel.open{ opacity:1;pointer-events:auto }
  .settings-inner{
    width:100%;max-width:460px;
    background:var(--surface-2);
    border:1px solid var(--outline-strong);
    border-bottom:0;
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    padding:0 var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom));
    box-shadow:var(--elev-3);
    transform:translateY(100%);
    transition:transform 220ms cubic-bezier(.2,0,0,1);
  }
  .settings-panel.open .settings-inner{ transform:translateY(0) }
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:var(--space-3) 0;gap:var(--space-2);
  }
  .setting-row + .setting-row{border-top:1px solid var(--outline)}
  .setting-label{
    font-size:var(--fs-body);font-weight:500;color:var(--text-2);
    letter-spacing:.02em;
  }

  .a4-control{
    display:flex;align-items:center;gap:0;
    background:var(--surface-3);border-radius:var(--radius-sm);
    padding:2px;
  }
  .a4-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);font-size:var(--fs-body);font-weight:500;
    width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;
    font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background var(--t-press), color var(--t-press), transform var(--t-press);
  }
  .a4-btn:active{background:rgba(240,235,227,.08);color:var(--text);transform:scale(.98)}
  .a4-value{
    font-size:var(--fs-body);font-weight:500;color:var(--text);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    padding:0 var(--space-2);
    min-width:72px;text-align:center;
  }
  .a4-value .unit{
    font-size:var(--fs-caption);color:var(--text-3);margin-left:2px;
  }

  .view-toggle{
    display:flex;background:var(--surface-3);
    border-radius:var(--radius-sm);padding:2px;gap:2px;
  }
  .view-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);font-family:inherit;
    font-size:var(--fs-caption);font-weight:500;
    padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;
    letter-spacing:.02em;
    transition:background var(--t-press), color var(--t-press), transform var(--t-press), box-shadow var(--t-press);
  }
  .view-btn:active{transform:scale(.98)}
  .view-btn.active{
    background:var(--surface-selected);
    color:var(--accent-light);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
  }

  /* ============ 模式标签 ============ */
  .mode-tabs{
    display:flex;background:var(--surface-2);
    border:1px solid var(--outline);
    border-radius:var(--radius-md);padding:var(--space-1);gap:var(--space-1);
    min-height:48px;
    margin:0;flex:none;
  }
  .mode-tab{
    flex:1;appearance:none;border:0;background:transparent;
    color:var(--text-2);font-family:inherit;
    font-size:var(--fs-body);font-weight:500;
    padding:var(--space-2) var(--space-1);border-radius:var(--radius-sm);cursor:pointer;
    transition:background var(--t-press), color var(--t-press), transform var(--t-press), box-shadow var(--t-press);
    letter-spacing:.04em;
  }
  .mode-tab:active{transform:scale(.98)}
  .mode-tab.active{
    background:var(--surface-selected);
    color:var(--accent-light);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
  }

  /* ============ 中间区域（可变高） ============ */
  .center{
    /* 表盘按内容高度排，不把剩余空白全吞进这一块。
       整页用 .app 的 space-between 把空白均分到各段之间。 */
    flex:0 0 auto;
    max-height:none;
    display:flex;align-items:center;justify-content:center;
    min-height:0;
    padding:0;
    margin:0;
  }


  /* ============ 表盘区（含音名） ============ */
  .gauge-block{
    position:relative;
    width:100%;
    margin:0 auto;
    cursor:pointer;          /* 点它开始/停止 */
  }
  .gauge-svg{
    display:block;
    width:100%;max-width:310px;height:auto;
    margin:0 auto;overflow:visible;
  }
  /* 指针：从圆心指向刻度 */
  #needleLine, #needleTip{
    transition:stroke .25s, fill .25s;
  }
  .app.tuning-ok #needleLine{ stroke:var(--success); }
  .app.tuning-ok #needleTip{ fill:var(--success); }
  .app.tuning-ok .gauge-arc{ stroke:rgba(var(--success-rgb),.55); }
  /* 刻度由脚本按音分画线，这里只加粗，不改位置 */
  #ticks line{ stroke-width:1.9; }
  #ticks line:nth-child(6){ stroke-width:2.8; }

  /* 音名叠层
     运行中：音名精确居中于圆心（指针轴心），音分与赫兹固定在下方
     待机：三者回到正常流，整体居中 —— 否则「轻触开始」会偏下 */
  .gauge-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;justify-content:center;
    pointer-events:none;
    text-align:center;
  }
  .note{
    font-weight:var(--fw-title);line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
    transition:color .3s;
    font-variant-numeric:tabular-nums;
    /* 居中的是「字母」，八度靠右侧一个隐形孪生兄弟抵消宽度，
       因此字母中心 = 圆环圆心。见下面的 .ghost */
    display:flex;align-items:baseline;justify-content:center;
    /* 背景色光晕：指针从字后面穿过时，在笔画周围被柔化，
       像表盘上印的字盖住了指针 —— 比硬遮罩自然 */
    text-shadow:
      0 0 7px var(--surface), 0 0 7px var(--surface),
      0 0 3px var(--surface), 0 0 3px var(--surface);
  }
  .note .letter{font-size:var(--fs-note);letter-spacing:-.04em;font-weight:var(--fw-title)}
  .note .oct{
    font-size:32px;font-weight:var(--fw-title);
    color:var(--text-2);
    margin-left:6px;
    letter-spacing:0;
  }
  /* 左侧的隐形孪生八度：宽度与右侧八度完全相等、镜像摆放。
     两边同宽 → justify-content:center 居中的就是字母本身。
     不用写死像素，八度变成两位也能自动平衡。 */
  .note .oct.ghost{
    visibility:hidden;
    margin-left:0;margin-right:6px;
  }
  .app.tuning-ok .note{color:var(--success)}
  .app.tuning-ok .note .oct{color:var(--success);opacity:.7}

  /* 音分：运行时固定在音名下方 */
  .cents{
    position:absolute;
    left:0;right:0;
    top:50%;margin-top:60px;
    font-size:var(--fs-cents);font-weight:var(--fw-bold);
    letter-spacing:.02em;
    line-height:1.15;
    color:var(--text-2);
    transition:color .3s;
    font-variant-numeric:tabular-nums;
    text-shadow:
      0 0 9px var(--surface), 0 0 9px var(--surface),
      0 0 4px var(--surface);
  }
  .cents.high{color:var(--warn)}
  .cents.low{color:var(--warn)}
  .cents.ok{color:var(--success)}

  /* 赫兹：紧跟在音分下方 */
  .freq-line{
    position:absolute;
    left:0;right:0;
    top:50%;margin-top:96px;
    font-size:var(--fs-caption);font-weight:var(--fw-caption);
    color:var(--text-2);
    letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
    text-shadow:
      0 0 9px var(--surface), 0 0 9px var(--surface),
      0 0 4px var(--surface);
  }
  .freq-line:empty{ display:none }

  /* 待机：三者回到正常流，整体居中 */
  .gauge-overlay.idle{
    flex-direction:column;
    gap:0;
  }
  .gauge-overlay.idle .cents{
    position:static;margin-top:0;
    font-size:var(--fs-title);font-weight:500;
  }
  .gauge-overlay.idle .freq-line{
    position:static;margin-top:5px;
  }

  /* ── 待机呼吸 ──
     不往页面里加任何新图形，只让现成的提示文字自己慢慢明暗。
     4.8 秒一轮 —— 慢到不抢注意力，但看得出页面是活的。 */
  .gauge-overlay.idle .cents{
    animation:idleBreath 4.8s ease-in-out infinite;
  }
  @keyframes idleBreath{
    0%,100%{ opacity:.9 }
    50%    { opacity:1   }
  }

  /* ── 监听波纹 ──
     两层极淡的圆环，从文字位置向外缓缓散开。
     圆心已有呼吸光点，这里只在监听时出现，与待机区分开。 */
  .listen-wave{
    position:absolute;left:50%;top:50%;
    width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;
    border:1px solid rgba(var(--success-rgb),.22);
    pointer-events:none;display:none;
    animation:listenWave 3.6s ease-out infinite;
  }
  .listen-wave:nth-of-type(2){ animation-delay:1.8s }
  .app.listening .listen-wave{ display:block }
  @keyframes listenWave{
    0%  { transform:scale(1);    opacity:.42 }
    75% { opacity:.05 }
    100%{ transform:scale(1.5);  opacity:0 }
  }

  /* 监听中的三个点：逐个亮，看得出程序在跑 */
  .cents .dots span{
    opacity:.28;
    animation:dotPulse 1.5s ease-in-out infinite;
  }
  .cents .dots span:nth-child(2){ animation-delay:.2s }
  .cents .dots span:nth-child(3){ animation-delay:.4s }
  @keyframes dotPulse{
    0%,70%,100%{ opacity:.26 }
    32%        { opacity:1   }
  }

  /* ── 弹错弦 ──
     用橙色警示，与「偏高/偏低」的暖金、准音的亮金区分开。
     指针此时没意义（它指向的是那根你没拨的弦），所以淡下去。 */
  .cents.wrong{
    color:#e0a458;
    font-size:var(--fs-body);
    font-weight:500;
    letter-spacing:.02em;
    line-height:1.45;
    max-width:240px;
    margin-left:auto;margin-right:auto;
    animation:wrongIn .28s ease-out;
  }
  @keyframes wrongIn{
    from{ opacity:0; transform:translateY(-3px) }
    to  { opacity:1; transform:translateY(0) }
  }
  .note.wrong .letter,
  .note.wrong .oct{ opacity:.38 }
  /* 指针在弹错弦时的淡出由 JS 控制（见 paintNeedleFaded）。
     CSS 改不动 —— stroke/fill 是 JS 写在元素上的内联属性，优先级更高。 */

  /* 该弦按钮提示一下是它 */
  .sbtn.hint-wrong{
    border-color:rgba(224,164,88,.55);
    background:rgba(224,164,88,.08);
  }
  .sbtn.hint-wrong .nm{ color:#e0a458 }
  .sbtn.hint-wrong .num{ color:rgba(224,164,88,.72) }

  /* 音量条：16 格分段刻度（与节拍页同款）
     高度与间距跟节拍页一致，切页时不跳。 */
  .level-row{
    display:flex;flex-direction:column;align-items:stretch;gap:var(--space-2);
    width:min(84%, 312px);
    margin:0 auto;flex:none;
  }
  .level-label{
    font-size:var(--fs-caption);font-weight:var(--fw-caption);color:var(--text-2);
    letter-spacing:.08em;flex:none;
  }
  .level-seg{
    display:flex;align-items:center;gap:8px;
    width:100%;height:20px;
    -webkit-tap-highlight-color:transparent;
  }
  .level-seg i{
    flex:1 1 0;min-width:0;
    height:20px;border-radius:6px;
    background:var(--surface-3);
    transition:background .12s ease-out;
  }
  .level-seg i.on{ background:var(--accent) }
  .level-seg i.tuned{ background:var(--success) }

  /* 频闪视图 */
  /* 必须自带宽度。.center 是 flex 容器，.strobe-view 作为 flex 项默认由内容定宽；
     canvas 的 width:100% 又要反过来问父级要宽度 —— 两边互相等，最后塌成 0，
     整个频闪页就是一片黑（只剩两道边框重叠成一条竖线）。
     max-width 与表盘同宽，两个视图切换时宽度观感一致。 */
  .strobe-view{display:none;width:100%;max-width:310px}
  .strobe-view.show{display:block}
  .gauge-block.hide{display:none}
  #strobeCanvas{
    display:block;width:100%;height:220px;
    border-radius:var(--radius-lg);
    background:var(--surface-2);
    border:1px solid var(--outline);
  }

  /* ============ 弦按钮 ============ */
  /* 弦按钮区贴到圆环底边。
     .center 是 flex 居中，圆环 310 在 446 的区域里上下各留 55.5px 空白；
     弦按钮若从 .center 底边开始，就会比节拍页的拍点整整低 53px。
     用负 margin 吃掉这段留白，让它的顶边正好在圆环底（≈561.5），
     于是「音符中心」与「拍点中心」都落在 636。
     断点里圆环变小、留白也随之变小，所以各断点单独给值。 */
  .target-area{margin:0;flex:none}
  .strings{display:grid;gap:var(--space-2);margin-top:0}
  .strings.guitar{grid-template-columns:repeat(6,1fr)}
  .strings.ukulele{grid-template-columns:repeat(4,1fr)}
  .sbtn{
    appearance:none;cursor:pointer;font-family:inherit;
    border:1px solid var(--outline-strong);
    background:var(--surface-2);
    border-radius:var(--radius-md);
    padding:0 2px var(--space-2);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;
    transition:background var(--t-press), border-color var(--t-press), transform var(--t-press), box-shadow var(--t-press);
  }
  .sbtn:active{transform:scale(.98)}
  /* 弦：按真实弦径画的粗细，两端渐隐 —— 像一根真的弦 */
  .wirewrap{
    width:100%;height:11px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .wire{
    width:88%;border-radius:2px;background:var(--text-3);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
    transition:background .22s, box-shadow .22s;
  }
  .sbtn .num{
    font-size:var(--fs-caption);font-weight:var(--fw-caption);color:var(--text-3);
    letter-spacing:.02em;line-height:1;margin-top:var(--space-1);
    transition:color var(--t-press);
  }
  .sbtn .nm{
    font-size:var(--fs-title);font-weight:500;line-height:1;
    color:var(--text);transition:color var(--t-press);
    letter-spacing:.01em;
    display:flex;align-items:baseline;margin-top:var(--space-2);
  }
  /* 八度下标：E₂ 与 E₄ 一眼分得开 */
  .sbtn .nm i{
    font-style:normal;font-size:11px;font-weight:400;
    color:var(--text-3);margin-left:1.5px;
    transition:color .22s;
  }
  .sbtn.active{
    border-color:var(--outline-accent);
    background:var(--surface-selected);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
  }
  .sbtn.active .nm{color:var(--accent-light)}
  .sbtn.active .nm i{color:var(--accent)}
  .sbtn.active .num{color:var(--accent-light)}
  .sbtn.active .wire{background:var(--accent);box-shadow:0 0 7px rgba(var(--accent-rgb),.55)}

  .sbtn.in-tune{
    border-color:rgba(var(--success-rgb),.6);
    background:rgba(var(--success-rgb),.10);
  }
  .sbtn.in-tune .nm{color:var(--success)}
  .sbtn.in-tune .nm i{color:rgba(var(--success-rgb),.82)}
  .sbtn.in-tune .num{color:rgba(var(--success-rgb),.74)}
  .sbtn.in-tune .wire{background:var(--success);box-shadow:0 0 10px rgba(var(--success-rgb),.65)}

  /* 钢琴：八度行和琴键算同一段，段与段的间距由整页均分 */
  .piano-area{display:none}
  .piano-area.show{display:block}
  .octave-row{
    display:flex;align-items:center;justify-content:center;
    gap:var(--space-4);margin-bottom:var(--space-2);height:40px;
  }
  .oct-btn{
    width:40px;height:40px;border-radius:var(--radius-sm);
    border:1px solid var(--outline-strong);
    background:var(--surface-2);
    color:var(--text-2);font-size:var(--fs-body);font-weight:500;
    cursor:pointer;
    transition:background var(--t-press), transform var(--t-press), color var(--t-press);
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
  }
  .oct-btn:active{transform:scale(.98);background:var(--surface-3);color:var(--text)}
  .oct-btn:disabled{opacity:.25;cursor:not-allowed}
  .oct-display{
    min-width:80px;text-align:center;
    font-size:var(--fs-body);font-weight:500;color:var(--text);
    letter-spacing:.08em;font-variant-numeric:tabular-nums;
    padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);
    background:var(--surface-2);
    border:1px solid var(--outline-strong);
  }
  /* 钢琴键盘：真钢琴布局
     7 个白键平铺，5 个黑键压在白键交界处（宽、高均约为白键 6 成）。
     整行高度锁 56px，与弦按钮同高 —— 两种模式的这一行始终对齐。 */
  .piano-keys{
    position:relative;
    height:56px;
  }
  .pk-white{
    display:flex;gap:3px;height:100%;
  }
  .pk-black{
    position:absolute;
    left:0;right:0;top:0;
    height:60%;
    pointer-events:none;        /* 容器不挡白键，黑键自己收事件 */
  }
  .pkey{
    appearance:none;cursor:pointer;font-family:inherit;
    font-weight:500;
    padding:0 2px;
    transition:background .12s, color .12s, transform .12s;
    letter-spacing:.01em;
  }
  /* 白键 */
  .pk-white .pkey{
    flex:1 1 0;min-width:0;
    border:1px solid rgba(0,0,0,.28);
    background:#e9e9e9;
    color:#5f5f5f;
    font-size:12px;
    border-radius:0 0 8px 8px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:5px;
  }
  .pk-white .pkey:active{ background:#cfcfcf }
  .pk-white .pkey.active{
    background:var(--accent);
    color:#1a1a1a;
  }
  .pk-white .pkey.in-tune{
    background:var(--success);
    color:#2a1f0d;
  }
  /* 黑键 */
  .pk-black .pkey{
    position:absolute;top:0;
    width:7.6%;
    height:100%;
    transform:translateX(-50%);
    pointer-events:auto;
    border:1px solid #000;
    background:#1c1c1c;
    color:#9a9a9a;
    font-size:10px;
    border-radius:0 0 5px 5px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:4px;
    box-shadow:0 2px 5px rgba(0,0,0,.55);
  }
  .pk-black .pkey:active{ background:#000 }
  .pk-black .pkey.active{
    background:var(--accent);
    color:#1a1a1a;
  }
  .pk-black .pkey.in-tune{
    background:var(--success);
    color:#2a1f0d;
  }

  /* ============ 主按钮 ============
     已停用：开始/停止改由点击圆环触发。
     元素保留是因为 start()/stop() 内部仍会读写它的状态，
     彻底删除会连带改十几处逻辑 —— 隐藏是风险最小的做法。 */
  .start{ display:none }
  .start-legacy{
    width:100%;appearance:none;border:0;cursor:pointer;
    font-family:inherit;
    margin-top:32px;
    padding:15px;border-radius:14px;
    font-size:15px;font-weight:500;
    letter-spacing:.14em;
    color:#1a1410;
    background:linear-gradient(180deg, var(--accent-light), var(--accent));
    box-shadow:
      0 1px 0 rgba(255,255,255,.25) inset,
      0 4px 14px rgba(var(--accent-rgb),.15);
    transition:all .2s;
    flex:none;
  }
  .start:active{transform:scale(.99);filter:brightness(.95)}
  .start.stop{
    background:transparent;
    color:var(--text-2);
    border:1px solid var(--border-2);
    box-shadow:none;
  }
  .start:disabled{opacity:.5;cursor:wait}

  .hint{
    text-align:center;
    font-size:var(--fs-caption);font-weight:var(--fw-caption);
    color:var(--text-2);
    margin:0;
    letter-spacing:.02em;
    line-height:1.5;
    flex:none;
  }
  .hint b{color:var(--text);font-weight:500}

  /* 小屏高度时压缩 */
  /* ── 小屏适配 ──
     圆环尺寸断点与节拍器完全一致（265 / 210 / 160 / 132），
     否则切页时两个圆环会一大一小地跳。
     弦按钮的 padding 不要在矮屏改动 —— 顶部那条弦会贴边。 */
  @media (max-height:780px){
    .app{ row-gap:var(--space-3) }
    .gauge-svg{ max-width:265px }
    .note .letter{font-size:76px}
    .note .oct{font-size:24px}
    .cents{ font-size:20px; margin-top:48px }
    .gauge-overlay.idle .cents{ font-size:var(--fs-body) }
    .freq-line{ font-size:var(--fs-caption); margin-top:76px }
    /* 矮屏上音量标签与刻度并排，少占一行高度 */
    .level-row{flex-direction:row;align-items:center;gap:var(--space-2);margin-top:0}
  }
  @media (max-height:660px){
    .app{ row-gap:var(--space-2) }
    .gauge-svg{ max-width:210px }
    .note .letter{font-size:56px}
    .note .oct{font-size:18px}
    .cents{ font-size:var(--fs-body); margin-top:36px }
    .freq-line{ margin-top:56px }
    .level-row{flex-direction:row;align-items:center;gap:var(--space-2);margin-top:0}
    .sbtn{padding:0 2px var(--space-1)}
    .sbtn .nm{font-size:var(--fs-body)}
    .sbtn .num{font-size:12px}
  }
  @media (max-height:600px){
    #strobeCanvas{height:200px}
    .center{max-height:none}
  }
  @media (max-height:560px){
    .gauge-svg{ max-width:160px }
    #strobeCanvas{height:180px}
    .note .letter{font-size:44px}
    .note .oct{font-size:14px}
    .cents{ font-size:var(--fs-caption); margin-top:26px }
    .freq-line{ margin-top:44px; font-size:12px }
  }
  @media (max-height:430px){
    .gauge-svg{ max-width:132px }
    #strobeCanvas{height:150px}
    .note .letter{font-size:36px}
    .note .oct{font-size:12px}
    .cents{ font-size:12px; margin-top:20px }
    .freq-line{ margin-top:34px; font-size:11px }
  }

  /* ── 横屏专用 ──
     竖屏单栏在 844x390 下会把圆环压到 132px（按钮都难点准），
     同时 844 的宽度全浪费在两侧。改成左右两栏：
     左圆环、右弦按钮 + 音量 + 提示。
     只作用于调音页（节拍页结构不同，另有一套适配）。
     加 min-aspect-ratio:3/2 是为了排除「窗口被拉成接近正方形」的情况 ——
     仅靠 orientation:landscape 时，420x420 这种方窗口也会被当成横屏手机，
     平白切成两栏。真手机横屏 844/390=2.2、667/375=1.8，都远超 1.5。 */
    @media (orientation: landscape) and (max-height: 520px) and (min-aspect-ratio: 3/2){
    /* 横屏手机宽度 844，但 min-width:520 的平板规则会把它锁成 460 的居中卡片，
       844 里近一半是黑边。这里放开成全屏。 */
    .app{
      max-width:100%;
      height:100dvh;
      min-height:100dvh;
      justify-content:flex-start;
      row-gap:var(--space-2);
      border:0; border-radius:0;
      padding:var(--space-2) var(--space-5) calc(var(--space-2) + env(safe-area-inset-bottom));
    }
    #pageTuner.active{
      display:grid;
      grid-template-columns:1fr 1fr;
      /* 三行等分：右栏三件（弦 / 音量 / 提示）均分剩余高度，
         与左栏圆环的视觉重心对齐，不会全挤在上半截。 */
      grid-template-rows:auto 1fr 1fr 1fr;
      column-gap:var(--space-5);
      align-items:center;
    }
    #pageTuner .mode-tabs{
      grid-column:1 / -1; grid-row:1;
      margin:0 auto 2px; max-width:420px; width:100%;
    }
    #pageTuner .center{
      grid-column:1; grid-row:2 / 5;
      margin-top:0; min-height:0;
      justify-content:center;      /* 纵向居中，圆环不被顶到上沿 */
      /* 竖屏那套 flex:1 + 封顶 + 顶部内边距是给单栏用的，
         横屏是两栏 grid，圆环在这一格里居中即可 —— 全部还原。 */
      flex:none; max-height:none; padding-top:0;
    }
    /* flex 列里 .gauge-block 默认可压缩，会把 SVG 压出容器被 overflow 裁掉 */
    #pageTuner .gauge-block{ flex:none }
    #pageTuner .target-area{ grid-column:2; grid-row:2; align-self:center }
    #pageTuner .strings{ margin-top:0 }
    #pageTuner .level-row{
      grid-column:2; grid-row:3;
      margin-top:0; width:100%;
    }
    #pageTuner .hint{
      grid-column:2; grid-row:4;
      align-self:center; margin-top:0;
    }
    /* 56vh 让圆环始终留出上下呼吸；250px 封顶防止平板横屏过大。
       注意：节拍页在横屏下不能同步放大 —— 单栏结构里圆环每大 1px
       就多占 1px 高度，放大到 218 会撑破 390 并溢出 69px。
       节拍页保持 132（不溢出，只是偏小），这是浏览器横屏的次要场景。 */
    #pageTuner .gauge-svg{ max-width:min(56vh, 250px); margin:0 auto }
    #pageTuner .header{ margin-bottom:0 }
  }

  /* ===== 手机 App 下载入口（由 tools/build_web.py 自动插入） ===== */
  .app-install-link{
    display:inline-flex;align-items:center;
    font-size:12px;font-weight:500;letter-spacing:.02em;
    color:var(--accent);text-decoration:none;
    padding:6px 13px;border-radius:8px;
    background:var(--accent-soft);
    transition:transform .18s ease,background .18s ease;
    white-space:nowrap;
  }
  .app-install-link:active{transform:scale(.95);background:rgba(var(--accent-rgb),.22)}

  /* METRO-BLOCK:CSS */
  /* ══════════════════════════════════════════════════════
     节拍器样式（由 tools/add_metronome.py 插入）
     ══════════════════════════════════════════════════════ */

  /* 顶部胶囊：调音 / 节拍，滑块标出当前页 */
  .app-tabs{
    position:relative;
    flex:1 1 auto;min-width:0;max-width:248px;
    display:flex;
    height:48px;
    background:var(--surface-2);
    border-radius:var(--radius-lg);
    box-shadow:inset 0 0 0 1px var(--outline);
    padding:4px;
    box-sizing:border-box;
  }
  .app-tabs-thumb{
    position:absolute;
    top:4px;left:4px;
    width:calc(50% - 4px);
    height:calc(100% - 8px);
    border-radius:var(--radius-md);
    background:var(--surface-selected);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
    transition:transform 200ms cubic-bezier(.2,0,0,1);
    pointer-events:none;
  }
  .app-tabs[data-index="1"] .app-tabs-thumb{ transform:translateX(100%) }
  .app-tab{
    position:relative;z-index:1;
    appearance:none;border:0;background:transparent;
    color:var(--text-2);
    font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-title);
    letter-spacing:.02em;
    padding:0 4px;cursor:pointer;
    transition:color 160ms cubic-bezier(.2,0,0,1);
    -webkit-tap-highlight-color:transparent;
    flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .app-tab.active{ color:var(--accent-light) }
  .app-tab .icon{ width:18px;height:18px }

  /* 页面容器：顶栏和底栏之间的一列，内部均分 */
  .page{display:none;flex-direction:column;flex:1;min-height:0}
  .page.active{
    display:flex;
    justify-content:space-between;
    animation:pageIn 200ms cubic-bezier(.2,0,0,1);
  }
  @keyframes pageIn{
    from{ opacity:0 }
    to{ opacity:1 }
  }

  /* 切换页时的显示差异 */
  body[data-page="metro"] .mic{display:none}
  body[data-page="metro"] .setting-row:not(#appRow){display:none}

  /* ══════════════════════════════════════════════════════
     节拍器
     ══════════════════════════════════════════════════════ */
  .metro-wrap{
    display:contents;
  }

  /* ── 音色抽屉 ──
     与拍号抽屉同一套骨架，只是内容换成一排可选卡片 */
  .sound-sheet{
    position:fixed;inset:0;
    z-index:81;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity 200ms cubic-bezier(.2,0,0,1);
  }
  .sound-sheet.open{ opacity:1;pointer-events:auto }
  .sound-sheet-body{
    width:100%;max-width:460px;
    background:var(--surface-2);
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    padding:0 var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform 220ms cubic-bezier(.2,0,0,1);
    border:1px solid var(--outline-strong);
    border-bottom:0;
    box-shadow:var(--elev-3);
  }
  .sound-sheet.open .sound-sheet-body{ transform:translateY(0) }
  .sound-sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:var(--space-4);
  }
  .sound-sheet-title,
  .meter-sheet-title{
    font-size:var(--fs-title);font-weight:500;color:var(--text);
    letter-spacing:.04em;
  }
  .sound-sheet-close,
  .meter-sheet-close{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);
    width:40px;height:40px;padding:0;cursor:pointer;
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background var(--t-press), color var(--t-press), transform var(--t-press);
  }
  .sound-sheet-close:active,
  .meter-sheet-close:active{ transform:scale(.98); background:var(--surface-selected); }

  /* 音色格子 */
  .sound-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:var(--space-2);
  }
  .sound-card{
    appearance:none;font-family:inherit;cursor:pointer;
    text-align:left;
    border:1px solid var(--outline-strong);
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:var(--space-3) var(--space-4);
    display:flex;flex-direction:column;gap:var(--space-1);
    transition:background var(--t-press), border-color var(--t-press), transform var(--t-press), box-shadow var(--t-press);
    -webkit-tap-highlight-color:transparent;
  }
  .sound-card:active{ transform:scale(.98) }
  .sound-card .sname{
    font-size:var(--fs-body);font-weight:500;color:var(--text);
    letter-spacing:.04em;transition:color var(--t-press);
  }
  .sound-card .sdesc{
    font-size:var(--fs-caption);color:var(--text-2);letter-spacing:.02em;
  }
  .sound-card.on{
    border-color:var(--outline-accent);
    background:var(--surface-selected);
    box-shadow:inset 0 0 0 1px var(--outline-accent);
  }
  .sound-card.on .sname{ color:var(--accent-light) }
  .sound-card.on .sdesc{ color:var(--text-2) }

  /* 音色按钮：比拍号按钮轻一点 —— 它是选项，不是状态 */
  .sound-btn .sname-mini{
    font-size:var(--fs-body);font-weight:500;
    color:inherit;
    max-width:76px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ── 顶部：拍号选择器（居中）── */
  .metro-top{
    display:flex;justify-content:center;align-items:center;
    gap:var(--space-2);
    flex:none;margin:0;
    min-height:48px;
  }
  .meter-btn{
    appearance:none;border:1px solid var(--outline-strong);
    background:var(--surface-2);
    color:var(--text);
    font-family:inherit;font-size:var(--fs-body);font-weight:500;
    letter-spacing:.04em;
    padding:var(--space-3) var(--space-4);

    -webkit-tap-highlight-color:transparent;

  body:has(#meterSheet.open) #meterBtn,

  /* ── 圆环调速区 ── */
  .metro-ring-area{
    --ring-max:310px;          /* 圆环直径上限（小屏断点会调低） */
    flex:0 0 auto;
    max-height:none;
    display:flex;align-items:center;justify-content:center;
    /* 给脚本一个不依赖圆环自身的高度，否则直径会卡在初值 */
    min-height:var(--ring-max);
    position:relative;
    overflow:visible;
    padding:0;
  }
  /* 圆环尺寸由 JS（syncRingSize）按可用空间算出，写进 --ring-size。
     这里必须给「固定」的宽高 —— 不能让尺寸由内容撑开，
     否则会形成「宽度→字号→数字宽度→宽度」的塌缩循环。 */
  .metro-ring{
    position:relative;
    width:var(--ring-size, 260px);
    height:var(--ring-size, 260px);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;          /* 拖动时不要触发页面滚动 */
    cursor:grab;
    -webkit-tap-highlight-color:transparent;
  }

  .metro-ring svg{
    position:absolute;inset:0;width:100%;height:100%;
    overflow:visible;
  }

  /* 底圈：暗色轨道 */
  .ring-track{
    fill:none;
    stroke:rgba(240,235,227,.22);
    stroke-width:2.4;
    stroke-linecap:round;
  }
  /* 进度弧：显示当前 BPM 在范围内的位置 */
  .ring-progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:3;
    stroke-linecap:round;
    opacity:.5;
    transition:stroke-dashoffset .1s linear;
  }
  /* 脉冲环：每拍扩散 */
  .pulse-ring{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.5;
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  .pulse-ring.beat{
    animation:metroPulse .44s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes metroPulse{
    0%   { opacity:.7; transform:scale(.68) }
    100% { opacity:0;  transform:scale(1.02) }

  /* ── 圆心：数字 + 术语 ──

  .ring-center{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    width:80%;                  /* 限制在圆内 */
    pointer-events:none;        /* 空白处让拖动/点击穿透到圆环 */
  }

  /* 数字：占圆环直径的 1/3 以上，可点击输入 */
  /* 字号跟着圆环实际大小缩放 —— 这样"数字约占圆环 1/3"在任何屏幕上
     都成立。写死像素的话，小屏圆环被压小、字不变，就是"圈小字大"。
     内边距和圆角用 em，自动随字号等比缩放。 */
  .ring-bpm{
    pointer-events:auto;
    appearance:none;border:0;background:transparent;
    font-family:inherit;
    font-size:calc(var(--ring-size, 310px) * .339);
    font-weight:var(--fw-body);
    line-height:.92;
    color:var(--text);
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    padding:.057em .152em;
    border-radius:.152em;
    cursor:text;
    transition:color .2s, background .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .ring-bpm:active{ background:var(--surface-2) }
  .ring-bpm.hidden{ display:none }
  /* 播放中：数字变主色 */
  .ring-bpm.playing{ color:var(--accent) }

  /* 输入框：尺寸跟数字一致，避免跳动。

  .ring-bpm-input{
    display:none;
    pointer-events:auto;
    font-family:inherit;
    font-size:calc(var(--ring-size, 310px) * .339);
    font-weight:var(--fw-body);
    line-height:.92;
    color:var(--accent);
    background:var(--surface-2);
    border:2px solid var(--accent);
    border-radius:.152em;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    padding:.057em .038em;
    outline:none;

  .ring-bpm-input.show{ display:block }

  /* 播放中术语也跟着亮一点 */
  .ring-center.playing .ring-term{ color:var(--accent); opacity:.75 }

  /* ── 拍点指示 ──
     亮起的点带光晕：亮起瞬间点亮（.04s），熄灭时慢慢消退（.22s），
     形成「闪一下」的观感。光晕颜色跟随主题色（--accent-rgb）。 */
  .beat-dots{
    display:flex;justify-content:center;align-items:center;
    gap:var(--space-4);flex:none;
    height:32px;
    margin:0;

  .beat-dot{
    width:14px;height:14px;border-radius:50%;

               box-shadow .22s ease-out;
  }
  .beat-dot.accent{ width:16px;height:16px }
  .beat-dot.on{

  .beat-dots.dense .beat-dot.accent{ width:12px;height:12px }
  .beat-dots.dense .beat-dot.on{

  /* ── 音量条 ──
     左小喇叭 —— 滑杆 —— 右大喇叭，照抄常见播放器的心智模型。

  /* ── 音量条：16 格分段刻度 ──
     格子的高度（20px）跟拍点直径（14-16px）同一个量级，
     看起来是一套东西。拖动连续生效，不卡格。 */
  .vol-row{
    display:flex;align-items:center;justify-content:center;
    flex:none;
    width:min(84%, 312px);
    margin:0 auto;
    padding:0;
  }
  .vol-seg{

  .vol-seg:focus-visible{ outline:2px solid var(--accent);outline-offset:4px }

  /* 节拍的提示行：位置刻意对齐调音页那一行，切换时底部不跳 */
  .metro-hint{ margin-top:0 }

  /* ══════════════════════════════════════════════════════
     拍号选择面板（底部弹出）
     ══════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════
     拍号选择：顶部下拉抽屉 + 双列滚轮
     分子 / 分母各一列，上下滑动选择，中间那条即选中。
     ══════════════════════════════════════════════════════ */
  .meter-sheet{
    position:fixed;inset:0;
    z-index:80;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity 200ms cubic-bezier(.2,0,0,1);
  }
  .meter-sheet.open{
    opacity:1;pointer-events:auto;
  }
  .meter-sheet-body{
    width:100%;max-width:460px;
    background:var(--surface-2);
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    padding:0 var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom));
    transform:translateY(100%);

    border:1px solid var(--outline-strong);
    border-bottom:0;
    box-shadow:var(--elev-3);

    display:flex;justify-content:center;align-items:center;
    padding:10px 0 6px;
    touch-action:none;
    cursor:grab;
  }
  .sheet-handle{
    width:32px;height:4px;border-radius:2px;
    background:rgba(240,235,227,.32);
  }
  .meter-sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:var(--space-2);
  }

  /* ── 双列滚轮 ── */
  .meter-wheels{
    position:relative;
    display:flex;
    height:236px;              /* 5 行 × 46 + 留白 */
    margin-top:4px;
  }
  /* 中间的选中高亮条 */
  .meter-wheels::before{
    content:'';
    position:absolute;
    left:6px;right:6px;top:50%;
    height:52px;
    transform:translateY(-50%);
    border-radius:var(--radius-md);
    background:var(--surface-selected);
    border:1px solid var(--outline-accent);
    pointer-events:none;
  }
  .meter-wheel{
    position:relative;
    flex:1 1 0;min-width:0;
    height:100%;
    touch-action:none;
    cursor:grab;
    -webkit-tap-highlight-color:transparent;
    -webkit-mask-image:linear-gradient(to bottom,
      transparent, #000 26%, #000 74%, transparent);
            mask-image:linear-gradient(to bottom,
      transparent, #000 26%, #000 74%, transparent);

  .meter-wheel:active{ cursor:grabbing }
  .meter-wheel-item{
    position:absolute;
    left:0;right:0;top:50%;
    height:46px;margin-top:-23px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--text-3);
    transition:color .16s, font-size .16s, opacity .16s;
    pointer-events:none;
  }
  .meter-wheel-item.near{ color:var(--text-2) }
  .meter-wheel-item.sel{ color:var(--text);font-size:25px }
  .meter-wheel-item.far{ opacity:.72 }

  /* ── 小屏适配 ──
     数字保持占圆环直径的 1/3 左右；

  @media (max-height: 780px){

  @media (max-height: 660px){

    .ring-center{ width:74% }
    .vol-row{ margin-top:0 }
  }
  @media (max-height: 560px){

    .vol-row{ margin-top:0 }

  @media (max-height: 430px){

    .beat-dots{ height:24px; gap:var(--space-2); margin-top:0 }
    .beat-dot{ width:10px; height:10px }

    .vol-row{ margin-top:0 }
  }
  /* /METRO-BLOCK:CSS */

  /* 节拍页在 App 内没有任何可设置的项：
     标准音高/视图被 data-page 规则隐藏，App 内「下载安装」也被藏了

  body.in-app[data-page="metro"] .settings-btn{
    visibility:hidden;
    pointer-events:none;

  }

     画布（canvas）读不到 CSS 变量，只能在运行时取出来。
     只读一次就缓存 —— getComputedStyle 很慢，不能放在动画循环里。 */
  let __themeCache = null;
  function theme(){
    if (__themeCache) return __themeCache;
    let cs = null;
    try { cs = getComputedStyle(document.documentElement); } catch(e){}
    const get = (name, fallback) => {
      if (!cs) return fallback;
      const v = cs.getPropertyValue(name);
      return (v && v.trim()) || fallback;
    };
    __themeCache = {
      accent:     get('--accent', '#a0a0a0'),
      accentRgb:  get('--accent-rgb', '160,160,160'),
      successRgb: get('--success-rgb', '127,200,127'),
      surface2:   get('--surface-2', '#1f1f1f'),
      text:       get('--text', '#f0f0f0')
    };
    return __themeCache;
  }

  /* ══════════════════════════════════════════════
     音频共用的曲线工具
     ══════════════════════════════════════════════
     第一个 <script> 的采样播放和第三个 <script> 的节拍器都要用，
     所以必须放在全局作用域 —— 藏在任一个 IIFE 里另一段就够不到。 */
  /* tanh 驱动曲线：软饱和，奇数阶为主，听感偏“胆味”
     不像硬削波那样产生大量刺耳高阶。 */
  let driveCurveCache = null;
  function driveCurve(k){
    if (driveCurveCache && driveCurveCache.k === k) return driveCurveCache.c;
    const n = 2048, c = new Float32Array(n);
    const norm = Math.tanh(k);
    for (let i = 0; i < n; i++){
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(k * x) / norm;
    }
    driveCurveCache = { k: k, c: c };
    return c;
  }

  /* 软限幅：|x| ≤ 0.8 时完全线性，超过后平滑压到 0.99。
     零延迟（WaveShaper 不做 lookahead），不会给节拍器/音符
     带来任何可听延迟 —— 这点在改之前是硬要求。
     小于阈值的信号一丝不变，所以不会糊掉正常音量下的音色。 */
  let limiterCurveCache = null;
  function limiterCurve(){
    if (limiterCurveCache) return limiterCurveCache;
    const n = 4096, c = new Float32Array(n);
    /* knee 定在 0.85（-1.4dBFS）：实测加谐波激励后，E2 的峰值会到
       -0.9dBFS —— 用 0.8 的话会被压掉近 1dB，低音弦的起音就钝了。
       0.85 下这点超出只压 0.002，等于不介入；真正过 1.0 时仍然兜得住。 */
    const knee = 0.85, ceil = 0.99;
    for (let i = 0; i < n; i++){
      const x = (i / (n - 1)) * 2 - 1;
      const a = Math.abs(x);
      let y;
      if (a <= knee) y = a;
      else y = knee + (ceil - knee) * Math.tanh((a - knee) / (ceil - knee));
      c[i] = x < 0 ? -y : y;
    }
    limiterCurveCache = c;
    return c;
  }

  function makeLimiter(ctx){
    const ws = ctx.createWaveShaper();
    ws.curve = limiterCurve();
    ws.oversample = '4x';    /* 过采样，避免限幅本身产生混叠 */
    return ws;
  }

  const STROBE_SPEED   = 60;

  (function buildTicks(){
    const NS = 'http://www.w3.org/2000/svg';
    for (let c = -50; c <= 50; c += 10){
      const deg = c * G_DEG_PER_CENT;
      const rad = deg * Math.PI / 180;
      const isMain = (c === 0);
      const isMid  = (Math.abs(c) === 25);
      const rIn  = G_R - (isMain ? 14 : (isMid ? 10 : 5));
      const rOut = G_R;
      const x1 = G_CX + rIn * Math.sin(rad);
      const y1 = G_CY - rIn * Math.cos(rad);
      const x2 = G_CX + rOut * Math.sin(rad);
      const y2 = G_CY - rOut * Math.cos(rad);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1.toFixed(2));
      line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2));
      line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('stroke', isMain ? 'rgba(var(--success-rgb),.8)' : 'rgba(240,235,227,.2)');
      line.setAttribute('stroke-width', isMain ? '2' : (isMid ? '1.6' : '1.2'));
      line.setAttribute('stroke-linecap', 'round');

    const lo = Math.min.apply(null, arr), hi = Math.max.apply(null, arr);
    if (hi === lo) return 4.5;
    return Math.round((2.5 + (g - lo) / (hi - lo) * 5.5) * 100) / 100;
  }
