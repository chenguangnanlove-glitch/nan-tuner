<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>始信音乐 · 调音器</title>
<style>
  :root{
    --bg:#0e0c0a;
    --surface:#1a1815;
    --surface-2:#211f1b;
    --surface-3:#2b2823;
    --border:rgba(240,235,227,.06);
    --border-2:rgba(240,235,227,.10);
    --text:#f0ebe3;
    --text-2:#948a7d;
    --text-3:#5e5750;

    /* 主题色（由 tools/ui_tool.py 生成）*/
    --accent:#d4a574;
    --accent-light:#e3bd93;
    --accent-soft:rgba(212,165,116,.13);
    --accent-rgb:212,165,116;
    --accent-light-rgb:227,189,147;

    /* 「对音准」用同色系更亮的一层金 —— 不再用绿色 */
    --success:#f0cb8c;
    --success-rgb:240,203,140;
    --warn:#e0a458;
    --warn-rgb:224,164,88;

    /* 品牌金色：只用在 logo 与品牌名上 */
    --gold:#d4a574;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;height:100%}
  body{
    min-height:100dvh;
    display:flex;align-items:stretch;justify-content:center;
    padding:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -8%, rgba(var(--accent-rgb),.07), transparent 62%),
      radial-gradient(ellipse 70% 45% at 50% 108%, rgba(var(--accent-rgb),.035), transparent 70%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
    font-weight:400;
    letter-spacing:.005em;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:100%;
    min-height:100dvh;
    position:relative;
    background:var(--surface);
    border:0;
    border-radius:0;
    padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    box-shadow:none;
    overflow:hidden;
  }
  /* 大屏幕时回到居中卡片 */
  @media (min-width: 520px){
    body{padding:20px;align-items:center}
    .app{
      max-width:460px;
      min-height:calc(100dvh - 40px);
      border:1px solid var(--border);
      border-radius:26px;
      padding:26px 22px 24px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(240,235,227,.04);
    }
  }

  /* ============ 顶部 ============ */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:50px;flex:none;
    position:relative;   /* 设置面板以它为锚点做浮层 */
  }
  .brand{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    flex:none;
  }
  .brand-mark{width:30px;height:30px;flex:none;display:block}
  .brand-text{display:flex;flex-direction:column;align-items:center}
  .brand-cn{
    font-size:9px;font-weight:500;line-height:1;
    letter-spacing:.06em;color:var(--gold);
    white-space:nowrap;
  }
  .brand-en{ display:none }

  /* 右侧：小太阳在上，麦克风状态在它正下方 */
  .header-right{
    display:flex;flex-direction:column;align-items:center;
    gap:2px;flex:none;
  }

  .mic{
    display:flex;align-items:center;gap:4px;
    font-size:8px;font-weight:500;color:var(--text-3);
    letter-spacing:.02em;
    order:2;
  }
  .mic .dot{
    width:4px;height:4px;border-radius:50%;
    background:#3d3830;transition:all .3s;
  }
  .mic.on .dot{background:var(--success);box-shadow:0 0 6px var(--success)}
  .mic.on{color:#e3c9a0}

  .settings-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);cursor:pointer;
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    padding:0;
    order:1;
  }
  .settings-btn:active{background:var(--surface-3);transform:scale(.94)}
  .settings-btn.active{color:var(--accent);background:var(--accent-soft)}
  .settings-btn svg{
    width:16px;height:16px;
    transition:transform .3s ease;
  }
  .settings-btn.active svg{transform:rotate(60deg)}

  /* ============ 设置面板 ============
     挂在 header 下方的浮层卡片，不参与文档流。
     注意：它曾以内联方式撑开（max-height:0 → 220px + 18px 外边距），
     展开时会把整页往下推 179px —— 调音页的「开始调音」按钮
     会被直接推出屏幕（780 屏上从 695 掉到 892，而屏幕只有 780）。 */
  .settings-panel{
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    width:min(74%, 272px);
    z-index:60;
    max-height:0;
    overflow:hidden;
    opacity:0;
    pointer-events:none;              /* 收起时不要隔着透明层挡点击 */
    transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .2s ease;
  }
  .settings-panel.open{
    max-height:260px;
    opacity:1;
    pointer-events:auto;
  }
  .settings-inner{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:4px 14px;
    box-shadow:0 20px 44px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.45);
  }
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;gap:10px;
  }
  .setting-row + .setting-row{border-top:1px solid var(--border)}
  .setting-label{
    font-size:12.5px;font-weight:500;color:var(--text-2);
    letter-spacing:.02em;
  }

  .a4-control{
    display:flex;align-items:center;gap:0;
    background:var(--surface-3);border-radius:10px;
    padding:2px;
  }
  .a4-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);font-size:15px;font-weight:500;
    width:30px;height:30px;border-radius:7px;cursor:pointer;
    font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .a4-btn:active{background:rgba(240,235,227,.08);color:var(--text)}
  .a4-value{
    font-size:12.5px;font-weight:500;color:var(--text);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    padding:0 10px;
    min-width:68px;text-align:center;
  }
  .a4-value .unit{
    font-size:10px;color:var(--text-3);margin-left:2px;
  }

  .view-toggle{
    display:flex;background:var(--surface-3);
    border-radius:10px;padding:2px;gap:2px;
  }
  .view-btn{
    appearance:none;border:0;background:transparent;
    color:var(--text-2);font-family:inherit;
    font-size:11.5px;font-weight:500;
    padding:6px 14px;border-radius:8px;cursor:pointer;
    letter-spacing:.02em;transition:all .2s;
  }
  .view-btn.active{
    background:var(--surface);
    color:var(--text);
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }

  /* ============ 模式标签 ============ */
  .mode-tabs{
    display:flex;background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;padding:3px;gap:2px;
    margin-bottom:0;flex:none;
  }
  .mode-tab{
    flex:1;appearance:none;border:0;background:transparent;
    color:var(--text-3);font-family:inherit;
    font-size:13px;font-weight:500;
    padding:9px 4px;border-radius:9px;cursor:pointer;
    transition:all .22s;letter-spacing:.04em;
  }
  .mode-tab:active{transform:scale(.97)}
  .mode-tab.active{
    background:var(--surface-3);
    color:var(--text);
  }

  /* ============ 中间区域（可变高） ============ */
  .center{
    flex:none;
    display:flex;flex-direction:column;
    min-height:0;
    /* 校准：整圆环直径 310px，与节拍器同尺寸。
       390x844 实测：圆心 395、弦按钮 624、音量 695、提示 738，
       与节拍页逐轴重合。 */
    margin:80px 0 0;
  }

  /* ============ 表盘区（含音名） ============ */
  .gauge-block{
    position:relative;
    width:100%;
    margin:0 auto;
    cursor:pointer;          /* 点它开始/停止 */
  }
  .gauge-svg{
    display:block;
    width:100%;max-width:310px;height:auto;
    margin:0 auto;overflow:visible;
  }
  /* 指针：从圆心指向刻度 */
  #needleLine, #needleTip{
    transition:stroke .25s, fill .25s;
  }
  .app.tuning-ok #needleLine{ stroke:var(--success); }
  .app.tuning-ok #needleTip{ fill:var(--success); }
  .app.tuning-ok .gauge-arc{ stroke:rgba(var(--success-rgb),.38); }

  /* 音名叠层
     运行中：音名精确居中于圆心（指针轴心），音分与赫兹固定在下方
     待机：三者回到正常流，整体居中 —— 否则「轻触开始」会偏下 */
  .gauge-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;justify-content:center;
    pointer-events:none;
    text-align:center;
  }
  .note{
    font-weight:500;line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
    transition:color .3s;
    font-variant-numeric:tabular-nums;
    /* 居中的是「字母」，八度靠右侧一个隐形孪生兄弟抵消宽度，
       因此字母中心 = 圆环圆心。见下面的 .ghost */
    display:flex;align-items:baseline;justify-content:center;
    /* 背景色光晕：指针从字后面穿过时，在笔画周围被柔化，
       像表盘上印的字盖住了指针 —— 比硬遮罩自然 */
    text-shadow:
      0 0 7px var(--surface), 0 0 7px var(--surface),
      0 0 3px var(--surface), 0 0 3px var(--surface);
  }
  .note .letter{font-size:84px;letter-spacing:-.04em}
  .note .oct{
    font-size:27px;font-weight:400;
    color:var(--text-2);
    margin-left:6px;
    letter-spacing:0;
  }
  /* 左侧的隐形孪生八度：宽度与右侧八度完全相等、镜像摆放。
     两边同宽 → justify-content:center 居中的就是字母本身。
     不用写死像素，八度变成两位也能自动平衡。 */
  .note .oct.ghost{
    visibility:hidden;
    margin-left:0;margin-right:6px;
  }
  .app.tuning-ok .note{color:var(--success)}
  .app.tuning-ok .note .oct{color:var(--success);opacity:.7}

  /* 音分：运行时固定在音名下方 */
  .cents{
    position:absolute;
    left:0;right:0;
    top:50%;margin-top:48px;
    font-size:15px;font-weight:500;
    letter-spacing:.04em;
    color:var(--text-3);
    transition:color .3s;
    font-variant-numeric:tabular-nums;
    text-shadow:
      0 0 9px var(--surface), 0 0 9px var(--surface),
      0 0 4px var(--surface);
  }
  .cents.high{color:var(--warn)}
  .cents.low{color:var(--warn)}
  .cents.ok{color:var(--success)}

  /* 赫兹：紧跟在音分下方 */
  .freq-line{
    position:absolute;
    left:0;right:0;
    top:50%;margin-top:73px;
    font-size:11.5px;font-weight:400;
    color:var(--text-2);
    letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    opacity:.72;
    text-shadow:
      0 0 9px var(--surface), 0 0 9px var(--surface),
      0 0 4px var(--surface);
  }
  .freq-line:empty{ display:none }

  /* 待机：三者回到正常流，整体居中 */
  .gauge-overlay.idle{
    flex-direction:column;
    gap:0;
  }
  .gauge-overlay.idle .cents{
    position:static;margin-top:0;
  }
  .gauge-overlay.idle .freq-line{
    position:static;margin-top:5px;
  }

  /* 音量条：16 格分段刻度（与节拍页同款）
     高度与间距跟节拍页一致，切页时不跳。 */
  .level-row{
    display:flex;flex-direction:column;align-items:stretch;gap:6px;
    width:min(84%, 312px);
    margin:19px auto 0;flex:none;
  }
  .level-label{
    font-size:10px;font-weight:500;color:var(--text-3);
    letter-spacing:.16em;flex:none;
  }
  .level-seg{
    display:flex;align-items:center;gap:8px;
    width:100%;height:20px;
    -webkit-tap-highlight-color:transparent;
  }
  .level-seg i{
    flex:1 1 0;min-width:0;
    height:20px;border-radius:6px;
    background:var(--surface-3);
    transition:background .12s ease-out;
  }
  .level-seg i.on{ background:var(--accent) }
  .level-seg i.tuned{ background:var(--success) }

  /* 频闪视图 */
  .strobe-view{display:none}
  .strobe-view.show{display:block}
  .gauge-block.hide{display:none}
  #strobeCanvas{
    display:block;width:100%;height:220px;
    border-radius:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
  }

  /* ============ 弦按钮 ============ */
  .target-area{margin:0 0 0;flex:none}
  /* 弦按钮整体坐在「钢琴琴键」的高度上（524-580）。
     钢琴的八度行占 482-514，弦乐此处留白 42px ——
     于是两种模式的按钮/琴键中线完全一致。 */
  .strings{display:grid;gap:7px;margin-top:42px}
  .strings.guitar{grid-template-columns:repeat(6,1fr)}
  .strings.ukulele{grid-template-columns:repeat(4,1fr)}
  .sbtn{
    appearance:none;cursor:pointer;font-family:inherit;
    border:1px solid var(--border);
    background:transparent;
    border-radius:13px;
    padding:0 2px 9px;
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;
    transition:all .22s ease;
  }
  .sbtn:active{transform:scale(.96)}
  /* 弦：按真实弦径画的粗细，两端渐隐 —— 像一根真的弦 */
  .wirewrap{
    width:100%;height:11px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .wire{
    width:88%;border-radius:2px;background:var(--text-3);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
    transition:background .22s, box-shadow .22s;
  }
  .sbtn .num{
    font-size:10px;font-weight:500;color:var(--text-3);
    letter-spacing:.04em;line-height:1;margin-top:5px;
    transition:color .22s;
  }
  .sbtn .nm{
    font-size:19px;font-weight:500;line-height:1;
    color:var(--text-2);transition:color .22s;
    letter-spacing:.01em;
    display:flex;align-items:baseline;margin-top:8px;
  }
  /* 八度下标：E₂ 与 E₄ 一眼分得开 */
  .sbtn .nm i{
    font-style:normal;font-size:11px;font-weight:400;
    color:var(--text-3);margin-left:1.5px;
    transition:color .22s;
  }
  .sbtn.active{
    border-color:rgba(var(--accent-rgb),.5);
    background:var(--accent-soft);
  }
  .sbtn.active .nm{color:var(--text)}
  .sbtn.active .nm i{color:rgba(var(--accent-rgb),.8)}
  .sbtn.active .num{color:rgba(var(--accent-rgb),.75)}
  .sbtn.active .wire{background:var(--accent);box-shadow:0 0 7px rgba(var(--accent-rgb),.55)}

  .sbtn.in-tune{
    border-color:rgba(var(--success-rgb),.6);
    background:rgba(var(--success-rgb),.10);
  }
  .sbtn.in-tune .nm{color:var(--success)}
  .sbtn.in-tune .nm i{color:rgba(var(--success-rgb),.82)}
  .sbtn.in-tune .num{color:rgba(var(--success-rgb),.74)}
  .sbtn.in-tune .wire{background:var(--success);box-shadow:0 0 10px rgba(var(--success-rgb),.65)}

  /* 钢琴 */
  .piano-area{display:none}
  /* 钢琴区比弦区矮 8px（键盘 56 vs 按钮 64），
     补一段下边距，让下面音量条在两种乐器下落在同一位置 */
  .piano-area.show{display:block;padding-bottom:8px}
  .octave-row{
    display:flex;align-items:center;justify-content:center;
    gap:14px;margin-bottom:10px;height:32px;
  }
  .oct-btn{
    width:36px;height:32px;border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-2);font-size:14px;font-weight:500;
    cursor:pointer;transition:all .15s;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
  }
  .oct-btn:active{transform:scale(.94);background:var(--surface-3)}
  .oct-btn:disabled{opacity:.25;cursor:not-allowed}
  .oct-display{
    min-width:74px;text-align:center;
    font-size:14px;font-weight:500;color:var(--text);
    letter-spacing:.08em;font-variant-numeric:tabular-nums;
    padding:6px 12px;border-radius:9px;
    background:var(--surface-2);
    border:1px solid var(--border);
  }
  /* 钢琴键盘：真钢琴布局
     7 个白键平铺，5 个黑键压在白键交界处（宽、高均约为白键 6 成）。
     整行高度锁 56px，与弦按钮同高 —— 两种模式的这一行始终对齐。 */
  .piano-keys{
    position:relative;
    height:56px;
  }
  .pk-white{
    display:flex;gap:3px;height:100%;
  }
  .pk-black{
    position:absolute;
    left:0;right:0;top:0;
    height:60%;
    pointer-events:none;        /* 容器不挡白键，黑键自己收事件 */
  }
  .pkey{
    appearance:none;cursor:pointer;font-family:inherit;
    font-weight:500;
    padding:0 2px;
    transition:background .12s, color .12s, transform .12s;
    letter-spacing:.01em;
  }
  /* 白键 */
  .pk-white .pkey{
    flex:1 1 0;min-width:0;
    border:1px solid rgba(0,0,0,.28);
    background:#e9e9e9;
    color:#5f5f5f;
    font-size:11.5px;
    border-radius:0 0 8px 8px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:5px;
  }
  .pk-white .pkey:active{ background:#cfcfcf }
  .pk-white .pkey.active{
    background:var(--accent);
    color:#1a1a1a;
  }
  .pk-white .pkey.in-tune{
    background:var(--success);
    color:#2a1f0d;
  }
  /* 黑键 */
  .pk-black .pkey{
    position:absolute;top:0;
    width:7.6%;
    height:100%;
    transform:translateX(-50%);
    pointer-events:auto;
    border:1px solid #000;
    background:#1c1c1c;
    color:#9a9a9a;
    font-size:9px;
    border-radius:0 0 5px 5px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:4px;
    box-shadow:0 2px 5px rgba(0,0,0,.55);
  }
  .pk-black .pkey:active{ background:#000 }
  .pk-black .pkey.active{
    background:var(--accent);
    color:#1a1a1a;
  }
  .pk-black .pkey.in-tune{
    background:var(--success);
    color:#2a1f0d;
  }

  /* ============ 主按钮 ============
     已停用：开始/停止改由点击圆环触发。
     元素保留是因为 start()/stop() 内部仍会读写它的状态，
     彻底删除会连带改十几处逻辑 —— 隐藏是风险最小的做法。 */
  .start{ display:none }
  .start-legacy{
    width:100%;appearance:none;border:0;cursor:pointer;
    font-family:inherit;
    margin-top:32px;
    padding:15px;border-radius:14px;
    font-size:15px;font-weight:500;
    letter-spacing:.14em;
    color:#1a1410;
    background:linear-gradient(180deg, var(--accent-light), var(--accent));
    box-shadow:
      0 1px 0 rgba(255,255,255,.25) inset,
      0 4px 14px rgba(var(--accent-rgb),.15);
    transition:all .2s;
    flex:none;
  }
  .start:active{transform:scale(.99);filter:brightness(.95)}
  .start.stop{
    background:transparent;
    color:var(--text-2);
    border:1px solid var(--border-2);
    box-shadow:none;
  }
  .start:disabled{opacity:.5;cursor:wait}

  .hint{
    text-align:center;
    font-size:11px;font-weight:400;
    color:var(--text-3);

  /* METRO-BLOCK:CSS */
  /* ══════════════════════════════════════════════════════

     ══════════════════════════════════════════════════════ */

  /* ── 顶部切换键：胶囊滑块 ──

  /* 页面容器 */

  /* 切换页时的显示差异 */

  /* ══════════════════════════════════════════════════════
     节拍器
     ══════════════════════════════════════════════════════ */
  .metro-wrap{
    display:flex;flex-direction:column;flex:1;
    min-height:0;
    /* 底部留白：让拍点落在 624、音量条落在 696（与调音页对齐）。
       末行提示占掉下方 37px，所以这里的 padding 相应减小 ——
       两页的内容底部边界便落在同一位置，切换时不再跳动。 */
    padding-bottom:12px;
  }

  /* ── 顶部：拍号选择器（居中）── */
  .metro-top{
    display:flex;justify-content:center;
    flex:none;margin-bottom:0;
  }
  .meter-btn{
    appearance:none;border:1px solid var(--border-2);
    background:var(--surface-2);
    color:var(--text);
    font-family:inherit;font-size:14px;font-weight:500;

    cursor:pointer;
    display:flex;align-items:center;gap:7px;
    transition:background .18s, border-color .18s;
    -webkit-tap-highlight-color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .meter-btn:active{ background:var(--surface-3) }
  .meter-btn .chev{
    width:9px;height:9px;flex:none;
    opacity:.55;
  }
  .meter-btn .chev path{
    stroke:currentColor;stroke-width:2;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
  }

  /* ── 圆环调速区 ── */
  .metro-ring-area{
    --ring-max:310px;          /* 圆环直径上限（小屏断点会调低） */
    flex:1;
    /* 高度封顶：屏幕很高时不再无限拉伸。
       否则圆环区会吸走全部剩余空间，把拍点/音量条/提示推到屏幕最底，
       而调音页的元素是堆在顶部的 —— 两页底部差几十像素，切页就会跳。
       463px 是设计基准屏（780）下这一区的自然高度；
       446px 是校准后的值：使圆环圆心落在 390、拍点中心落在 624，
       与调音页的弧圆心、音量条中心逐轴重合。 */
    max-height:446px;
    display:flex;align-items:center;justify-content:center;
    min-height:0;
    position:relative;
    overflow:hidden;
    /* 让圆环圆心落在 390，与调音页的弧圆心对齐 */
    padding-top:25px;
  }
  /* 圆环尺寸由 JS（syncRingSize）按可用空间算出，写进 --ring-size。
     这里必须给「固定」的宽高 —— 不能让尺寸由内容撑开，
     否则会形成「宽度→字号→数字宽度→宽度」的塌缩循环。 */
  .metro-ring{
    position:relative;
    width:var(--ring-size, 260px);
    height:var(--ring-size, 260px);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;          /* 拖动时不要触发页面滚动 */
    cursor:grab;
    -webkit-tap-highlight-color:transparent;
  }
  .metro-ring:active{ cursor:grabbing }
  .metro-ring svg{
    position:absolute;inset:0;width:100%;height:100%;
    overflow:visible;
  }

  /* 底圈：暗色轨道 */
  .ring-track{
    fill:none;
    stroke:var(--surface-3);
    stroke-width:2;
    stroke-linecap:round;
  }
  /* 进度弧：显示当前 BPM 在范围内的位置 */
  .ring-progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:3;
    stroke-linecap:round;
    opacity:.5;
    transition:stroke-dashoffset .1s linear;
  }
  /* 脉冲环：每拍扩散 */
  .pulse-ring{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.5;
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  .pulse-ring.beat{
    animation:metroPulse .44s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes metroPulse{
    0%   { opacity:.7; transform:scale(.68) }
    100% { opacity:0;  transform:scale(1.02) }

  .ring-center{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    width:80%;                  /* 限制在圆内 */
    pointer-events:none;        /* 空白处让拖动/点击穿透到圆环 */
  }

  /* 数字：占圆环直径的 1/3 以上，可点击输入 */
  /* 字号跟着圆环实际大小缩放 —— 这样"数字约占圆环 1/3"在任何屏幕上
     都成立。写死像素的话，小屏圆环被压小、字不变，就是"圈小字大"。
     内边距和圆角用 em，自动随字号等比缩放。 */
  .ring-bpm{
    pointer-events:auto;
    appearance:none;border:0;background:transparent;
    font-family:inherit;
    font-size:calc(var(--ring-size, 310px) * .339);
    font-weight:300;
    line-height:.92;
    color:var(--text);
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    padding:.057em .152em;
    border-radius:.152em;
    cursor:text;
    transition:color .2s, background .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .ring-bpm:active{ background:var(--surface-2) }
  .ring-bpm.hidden{ display:none }
  /* 播放中：数字变主色 */
  .ring-bpm.playing{ color:var(--accent) }

  /* 输入框：尺寸跟数字一致，避免跳动。
     宽度用 100%：自动跟随圆环大小，不会在大屏太宽、小屏溢出 */
  .ring-bpm-input{
    display:none;
    pointer-events:auto;
    font-family:inherit;
    font-size:calc(var(--ring-size, 310px) * .339);
    font-weight:300;
    line-height:.92;
    color:var(--accent);
    background:var(--surface-2);
    border:2px solid var(--accent);
    border-radius:.152em;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    padding:.057em .038em;
    outline:none;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    -webkit-appearance:none;
  }
  .ring-bpm-input.show{ display:block }

  .ring-term{
    font-size:clamp(11px, calc(var(--ring-size, 310px) * .042), 14px);
    color:var(--text-3);
    letter-spacing:.08em;
    margin-top:calc(var(--ring-size, 310px) * .026);
    min-height:18px;
    transition:color .2s;
  }
  /* 播放中术语也跟着亮一点 */
  .ring-center.playing .ring-term{ color:var(--accent); opacity:.75 }

  /* ── 拍点指示 ──
     亮起的点带光晕：亮起瞬间点亮（.04s），熄灭时慢慢消退（.22s），
     形成「闪一下」的观感。光晕颜色跟随主题色（--accent-rgb）。 */
  .beat-dots{
    display:flex;justify-content:center;align-items:center;
    gap:16px;flex:none;
    height:30px;
    margin-top:4px;
  }
  .beat-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--surface-3);
    transition:background .22s ease-out, transform .22s ease-out,
               box-shadow .22s ease-out;
  }
  .beat-dot.accent{ width:16px;height:16px }
  .beat-dot.on{
    background:var(--success);
    transform:scale(1.25);
    box-shadow:0 0 7px 1px rgba(var(--success-rgb), .8),
               0 0 18px 5px rgba(var(--success-rgb), .3);
    transition:background .04s, transform .04s, box-shadow .04s;
  }
  /* 拍子多的时候（比如 12/8）缩小一点，避免挤成一片 */
  .beat-dots.dense{ gap:10px }
  .beat-dots.dense .beat-dot{ width:10px;height:10px }
  .beat-dots.dense .beat-dot.accent{ width:12px;height:12px }
  .beat-dots.dense .beat-dot.on{
    transform:scale(1.35);
    box-shadow:0 0 6px 1px rgba(var(--success-rgb), .75),
               0 0 14px 3px rgba(var(--success-rgb), .26);
  }

  /* ── 音量条 ──
     左小喇叭 —— 滑杆 —— 右大喇叭，照抄常见播放器的心智模型。

  /* ── 音量条：16 格分段刻度 ──

  .vol-row{

  .metro-hint{ margin-top:21px }

  /* ══════════════════════════════════════════════════════
     拍号选择面板（底部弹出）
     ══════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════

  .meter-wheels{
    position:relative;
    display:flex;
    height:236px;              /* 5 行 × 46 + 留白 */
    margin-top:4px;
  }

  .meter-wheels::before{
    content:'';
    position:absolute;
    left:6px;right:6px;top:50%;
    height:52px;
    transform:translateY(-50%);
    border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--border-2);
    pointer-events:none;
  }
  .meter-wheel{
    position:relative;
    flex:1 1 0;min-width:0;
    height:100%;
    touch-action:none;
    cursor:grab;
    -webkit-tap-highlight-color:transparent;

  .meter-wheel-item{
    position:absolute;
    left:0;right:0;top:50%;
    height:46px;margin-top:-23px;
    display:flex;align-items:center;justify-content:center;

    font-variant-numeric:tabular-nums;

  .meter-wheel-item.sel{ color:var(--text);font-size:25px }
  .meter-wheel-item.far{ opacity:.45 }

  /* ── 小屏适配 ──
     数字保持占圆环直径的 1/3 左右；

<script>

  /* ===== 读取主题色（由 tools/fix_theme.py 自动插入）=====
     画布（canvas）读不到 CSS 变量，只能在运行时取出来。
     只读一次就缓存 —— getComputedStyle 很慢，不能放在动画循环里。 */
  let __themeCache = null;
  function theme(){
    if (__themeCache) return __themeCache;
    let cs = null;
    try { cs = getComputedStyle(document.documentElement); } catch(e){}
    const get = (name, fallback) => {
      if (!cs) return fallback;
      const v = cs.getPropertyValue(name);
      return (v && v.trim()) || fallback;
    };
    __themeCache = {
      accent:     get('--accent', '#a0a0a0'),
      accentRgb:  get('--accent-rgb', '160,160,160'),
      successRgb: get('--success-rgb', '127,200,127'),
      surface2:   get('--surface-2', '#1f1f1f'),
      text:       get('--text', '#f0f0f0')
    };
    return __themeCache;
  }

(function(){
  'use strict';

  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  const INSTRUMENTS = {
    guitar: {
      type: 'strings',
      /* gauge：真实弦径（英寸）—— 10-46 套装。
         用于弦按钮顶部的粗细，低音粗、高音细。 */
      gauge: [0.046, 0.036, 0.026, 0.017, 0.013, 0.010],
      prefix: 'guitar_',
      strings: [
        { num: 6, name: 'E', oct: 2, midi: 40 },
        { num: 5, name: 'A', oct: 2, midi: 45 },
        { num: 4, name: 'D', oct: 3, midi: 50 },
        { num: 3, name: 'G', oct: 3, midi: 55 },
        { num: 2, name: 'B', oct: 3, midi: 59 },
        { num: 1, name: 'E', oct: 4, midi: 64 },
      ],
      detectRange: [70, 400],
      hint: '拨响琴弦即可 · 点琴弦按钮可听标准音',
    },
    ukulele: {
      type: 'strings',
      /* gauge：high-G 套装。3 弦 C 最粗 —— 这是尤克里里的真实情况。 */
      gauge: [0.024, 0.031, 0.026, 0.021],
      prefix: 'uke_',
      strings: [
        { num: 4, name: 'G', oct: 4, midi: 67 },
        { num: 3, name: 'C', oct: 4, midi: 60 },
        { num: 2, name: 'E', oct: 4, midi: 64 },
        { num: 1, name: 'A', oct: 4, midi: 69 },
      ],
      detectRange: [200, 500],
      hint: '4 弦标准调弦 G-C-E-A · 拨弦自动识别',
    },
    piano: {
      type: 'piano',
      prefix: 'piano_',
      detectRange: [65, 2100],
      hint: '按钢琴键可听标准音 · 弹奏自动识别',
    },
  };

  const IN_TUNE        = 3;
  const RMS_MIN        = 0.004;
  /* 分析窗口：自适应。低音弦需要更长的窗口才能数够周期 ——
     E2 只有 82.4Hz，2048 样本（46ms）里才 3.8 个周期，
     自相关法至少要 5 个才稳。窗口由 minFreq 算出来，见 pitchWindow()。

     实测（tools/test_pitch_window.py，模拟非谐性+拍频+衰减）：
       弦已衰减、噪声占比高时，E2 的检测准确率
         2048 → 17% 落在 ±5 音分内
         4096 → 67%
     D3 在弱信号下 17% → 50%。高音弦两者相当，不受影响。

     另注：仿真里所有结果都偏高约 4-5 音分，来源是琴弦的非谐性
     （f_n = n·f0·√(1+B·n²)，高次谐波被拉高，平均周期偏短）。
     真实吉他的 B 通常小于仿真用的 4e-4，实际偏差会小一些。
     没有做补偿 —— 补偿量取决于弦的刚度和张力，逐琴不同，
     写死一个系数反而会引入系统性误差。 */
  const WINDOW_MIN     = 2048;
  const WINDOW_MAX     = 4096;
  const MIN_CYCLES     = 5;
  const ANALYSIS_MS    = 65;
  const HISTORY_SIZE   = 5;     /* 中位数取样多两帧，拨弦起音时更稳 */
  const SWITCH_NEED    = 3;
  const EMA_SLOW       = 0.12;
  const EMA_FAST       = 0.32;
  const EMA_FAST_GAP   = 28;
  const NC_MIN         = 0.55;  /* 自相关峰值阈值。0.45 太松，噪声也能过 */
  /* ── 指针物理 ──
     真实动圈表头是一个弹簧 - 阻尼系统：会轻轻冲过头，再回稳。
     NEEDLE_HZ   摆动快慢。3.8Hz ≈ 一个半来回 / 0.3 秒，跟真表头同量级。
     NEEDLE_ZETA 阻尼比。0.52 → 过冲 10.6%，峰值 100ms、稳定 400ms。
                 低于 0.4 会摆个不停，高于 0.7 就死板了。
     两个参数都是物理量，与刷新率无关 ——
     60/120Hz 屏上的手感一致（旧写法是逐帧系数，120Hz 下会快一倍）。 */
  const NEEDLE_HZ       = 3.8;
  const NEEDLE_ZETA     = 0.52;
  const NEEDLE_DEADZONE = 0.10;   /* 度 */
  const NEEDLE_STOP_VEL = 1.5;    /* 度/秒 */
  const STROBE_SPEED   = 1.0;
  const STROBE_PERIOD  = 28;
  const STROBE_STRIPE  = 12;

  /* 表盘几何：完整半圆（-90° → +90°） */
  const G_CX = 150, G_CY = 150, G_R = 131;
  const G_DEG_PER_CENT = 1.8;   /* 1 音分 = 1.8°（满量程 ±50 音分 = ±90°） */

  const appEl       = document.getElementById('app');
  const needleLine = document.getElementById('needleLine');
  const needleTip  = document.getElementById('needleTip');
  const ticksEl     = document.getElementById('ticks');
  const noteEl      = document.getElementById('noteName');
  const centsEl     = document.getElementById('centsText');
  const freqEl      = document.getElementById('freqText');
  const gaugeOverlay= document.querySelector('.gauge-overlay');
  const stringsEl   = document.getElementById('stringsEl');
  const pianoArea   = document.getElementById('pianoArea');
  const pianoKeysEl = document.getElementById('pianoKeys');
  const octDownEl   = document.getElementById('octDown');
  const octUpEl     = document.getElementById('octUp');
  const octValueEl  = document.getElementById('octValue');
  const modeTabsEl  = document.querySelectorAll('.mode-tab');
  const startBtn    = document.getElementById('startBtn');
  const micStatus   = document.getElementById('micStatus');
  const micText     = document.getElementById('micText');
  const levelSegEl  = document.getElementById('levelSeg');
  const hintText    = document.getElementById('hintText');
  const a4DownEl    = document.getElementById('a4Down');
  const a4UpEl      = document.getElementById('a4Up');
  const a4ValueEl   = document.getElementById('a4Value');
  const viewToggleEl= document.getElementById('viewToggle');
  const gaugeBlock  = document.getElementById('gaugeBlock');
  const strobeView  = document.getElementById('strobeView');
  const strobeCanvas= document.getElementById('strobeCanvas');
  const strobeCtx   = strobeCanvas.getContext('2d');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');

  let mode = 'guitar';
  let a4Cal = 440;
  let view = 'needle';
  let audioCtx = null;
  let analyser = null;
  let timeBuf  = null;
  let corrBuf  = null;
  let running  = false;
  let playingRef = false;

  let lockedKey = null;
  let activeKey = null;

  let freqHistory = [];
  let displayedId = null;
  let candidateId = null;
  let candidateN  = 0;
  let smoothCents = 0;
  let needleAngle = 0;
  let needleVel   = 0;
  let needleTarget= 0;
  let lastNeedleTs= 0;
  let strobePhase = 0;
  let smoothLevel = 0;
  let lastGoodTs  = 0;
  let missFrames  = 0;

  let pianoOctave = 4;

  function getFreq(midi){ return a4Cal * Math.pow(2, (midi - 69) / 12); }
  function freqToMidi(f){ return 69 + 12 * Math.log2(f / a4Cal); }
  function midiToNote(midi){
    const r = Math.round(midi);
    return { midi: r, name: NOTE_NAMES[((r % 12) + 12) % 12], octave: Math.floor(r / 12) - 1 };
  }

  settingsBtn.addEventListener('click', () => {
    const open = settingsPanel.classList.toggle('open');
    settingsBtn.classList.toggle('active', open);
  });

  /* 点面板和齿轮以外的地方就收起。
     面板现在是从 header 下弹出的浮层，会盖住乐器行；
     不主动收起的话，用户得再点一次齿轮才能看到被挡住的内容。 */
  document.addEventListener('click', (e) => {
    if (!settingsPanel.classList.contains('open')) return;
    if (e.target.closest('#settingsPanel') || e.target.closest('#settingsBtn')) return;
    settingsPanel.classList.remove('open');
    settingsBtn.classList.remove('active');
  });

  /* 画刻度
     半圆有 180° 空间，所以分三级：
       0       长绿（准音基准）
       ±25     中长
       其他     短（每 10 音分一格） */
  (function buildTicks(){
    const NS = 'http://www.w3.org/2000/svg';
    for (let c = -50; c <= 50; c += 10){
      const deg = c * G_DEG_PER_CENT;
      const rad = deg * Math.PI / 180;
      const isMain = (c === 0);
      const isMid  = (Math.abs(c) === 25);
      const rIn  = G_R - (isMain ? 14 : (isMid ? 10 : 5));
      const rOut = G_R;
      const x1 = G_CX + rIn * Math.sin(rad);
      const y1 = G_CY - rIn * Math.cos(rad);
      const x2 = G_CX + rOut * Math.sin(rad);
      const y2 = G_CY - rOut * Math.cos(rad);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1.toFixed(2));
      line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2));
      line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('stroke', isMain ? 'rgba(var(--success-rgb),.8)' : 'rgba(240,235,227,.2)');
      line.setAttribute('stroke-width', isMain ? '2' : (isMid ? '1.6' : '1.2'));
      line.setAttribute('stroke-linecap', 'round');
      ticksEl.appendChild(line);
    }
  })();

  let stringBtns = [];
  /* 弦径（英寸）→ 像素：2.5px（最细）到 8.0px（最粗），组内归一化 */
  function gaugeToPx(g, arr){
    if (!arr || !arr.length) return 4.5;
    const lo = Math.min.apply(null, arr), hi = Math.max.apply(null, arr);
    if (hi === lo) return 4.5;
    return Math.round((2.5 + (g - lo) / (hi - lo) * 5.5) * 100) / 100;
  }

  function buildStringButtons(){
    stringsEl.innerHTML = '';
    stringBtns = [];
    const inst = INSTRUMENTS[mode];
    if (inst.type !== 'strings') return;
    stringsEl.className = 'strings ' + mode;
    inst.strings.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'sbtn';
      b.type = 'button';
      const px = gaugeToPx(inst.gauge[i], inst.gauge);
      b.innerHTML =
        '<div class="wirewrap"><div class="wire" style="height:' + px + 'px"></div></div>' +
        '<span class="nm">' + s.name + '<i>' + s.oct + '</i></span>' +
        '<span class="num">' + s.num + '弦</span>';
      b.addEventListener('click', () => onStringClick(i));
      stringsEl.appendChild(b);
      stringBtns.push(b);
    });
  }

  let pianoKeyBtns = [];
  /* 建钢琴键盘：真钢琴布局
     白键 C D E F G A B 平铺；黑键 C# D# F# G# A# 压在交界处。
     pianoKeyBtns 按 pc（0-11）索引 —— updateButtons 依赖这个顺序。 */
  function buildPianoKeys(){
    pianoKeysEl.innerHTML = '';
    pianoKeyBtns = new Array(12).fill(null);

    const whiteBox = document.createElement('div');
    whiteBox.className = 'pk-white';
    const blackBox = document.createElement('div');
    blackBox.className = 'pk-black';

    // 白键：7 个
    [0, 2, 4, 5, 7, 9, 11].forEach(pc => {
      const b = document.createElement('button');
      b.className = 'pkey';
      b.type = 'button';
      b.textContent = NOTE_NAMES[pc];
      b.addEventListener('click', () => onPianoKeyClick(pc));
      whiteBox.appendChild(b);
      pianoKeyBtns[pc] = b;
    });

    // 黑键：5 个。at = 插在第几个白键之后（1 → C|D 之间）
    [[1, 1], [3, 2], [6, 4], [8, 5], [10, 6]].forEach(pair => {
      const pc = pair[0], at = pair[1];
      const b = document.createElement('button');
      b.className = 'pkey black';
      b.type = 'button';
      b.textContent = NOTE_NAMES[pc];
      b.style.left = (at * 100 / 7) + '%';
      b.addEventListener('click', () => onPianoKeyClick(pc));
      blackBox.appendChild(b);
      pianoKeyBtns[pc] = b;
    });

    pianoKeysEl.appendChild(whiteBox);
    pianoKeysEl.appendChild(blackBox);
  }

  function updateButtons(){
    if (mode === 'piano'){
      pianoKeyBtns.forEach((b, pc) => {
        const midi = (pianoOctave + 1) * 12 + pc;
        const isActive = (activeKey === midi);
        const isLocked = (lockedKey === midi);
        b.classList.toggle('active', isActive || isLocked);
        b.classList.toggle('in-tune', isLocked && running && Math.abs(smoothCents) <= IN_TUNE);
      });
    } else {
      stringBtns.forEach((b, i) => {
        const isActive = (activeKey === i);
        const isLocked = (lockedKey === i);
        b.classList.toggle('active', isActive || isLocked);
        b.classList.toggle('in-tune', isLocked && running && Math.abs(smoothCents) <= IN_TUNE);
      });
    }
  }

  function switchMode(newMode){
    if (mode === newMode) return;
    mode = newMode;
    lockedKey = null; activeKey = null;
    resetSmoothing();
    modeTabsEl.forEach(t => {
      t.classList.toggle('active', t.dataset.mode === newMode);
    });
    const inst = INSTRUMENTS[mode];
    if (inst.type === 'strings'){
      stringsEl.style.display = '';
      pianoArea.classList.remove('show');
      buildStringButtons();
    } else {
      stringsEl.style.display = 'none';
      pianoArea.classList.add('show');
      buildPianoKeys();
      updateOctaveDisplay();
    }
    hintText.innerHTML = inst.hint;
    clearDisplay();
    centsEl.textContent = running ? '拨响或弹奏一个音…' : '轻触开始';
    centsEl.className = 'cents';
    updateButtons();
  }

  modeTabsEl.forEach(t => {
    t.addEventListener('click', () => switchMode(t.dataset.mode));
  });

  function updateOctaveDisplay(){
    octValueEl.textContent = 'C' + pianoOctave;
    octDownEl.disabled = (pianoOctave <= 1);
    octUpEl.disabled   = (pianoOctave >= 7);
  }
  octDownEl.addEventListener('click', () => {
    if (pianoOctave > 1){
      pianoOctave--;
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateOctaveDisplay(); updateButtons();
    }
  });
  octUpEl.addEventListener('click', () => {
    if (pianoOctave < 7){
      pianoOctave++;
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateOctaveDisplay(); updateButtons();
    }
  });

  function updateA4Display(){
    a4ValueEl.innerHTML = a4Cal + '<span class="unit">Hz</span>';
  }
  function nudgeA4(delta){
    const next = Math.round((a4Cal + delta) * 10) / 10;
    if (next < 430 || next > 450) return;
    a4Cal = next;
    updateA4Display();
    resetSmoothing();
  }
  a4DownEl.addEventListener('click', () => nudgeA4(-0.5));
  a4UpEl.addEventListener('click', () => nudgeA4(0.5));

  viewToggleEl.addEventListener('click', (e) => {
    const t = e.target.closest('.view-btn');
    if (!t) return;
    view = t.dataset.view;
    viewToggleEl.querySelectorAll('.view-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    if (view === 'needle'){
      gaugeBlock.classList.remove('hide');
      strobeView.classList.remove('show');
    } else {
      gaugeBlock.classList.add('hide');
      strobeView.classList.add('show');
      resizeStrobe();
    }
  });

  function resizeStrobe(){
    const dpr = window.devicePixelRatio || 1;
    const rect = strobeCanvas.getBoundingClientRect();
    strobeCanvas.width  = Math.round(rect.width * dpr);
    strobeCanvas.height = Math.round(rect.height * dpr);
  }
  window.addEventListener('resize', resizeStrobe);

  async function onStringClick(i){
    if (lockedKey === i){
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateButtons(); return;
    }
    lockedKey = i; activeKey = i;
    resetSmoothing(); updateButtons();
    const inst = INSTRUMENTS[mode];
    const s = inst.strings[i];
    await playReference(getFreq(s.midi), 1.4, {
      key: inst.prefix + s.name.replace('#', 's') + s.oct,
      rate: 1
    });
  }

  async function onPianoKeyClick(pc){
    const midi = (pianoOctave + 1) * 12 + pc;
    if (lockedKey === midi){
      lockedKey = null; activeKey = null;
      resetSmoothing(); updateButtons(); return;
    }
    lockedKey = midi; activeKey = midi;
    resetSmoothing(); updateButtons();
    await playReference(getFreq(midi), 1.4, nearestPianoSample(midi));
  }

  /* 音量条：16 格，按电平点亮（与节拍页同一套视觉） */
  const LEVEL_SEGS = 16;
  let levelSegItems = [];

  function buildLevelSeg(){
    levelSegEl.innerHTML = '';
    levelSegItems = [];
    for (let i = 0; i < LEVEL_SEGS; i++){
      const s = document.createElement('i');
      levelSegEl.appendChild(s);
      levelSegItems.push(s);
    }
  }

  /* 传 0-100 的电平，点亮相应格数 */
  function paintLevel(v){
    const n = Math.round(Math.max(0, Math.min(100, v)) / 100 * LEVEL_SEGS);
    for (let i = 0; i < LEVEL_SEGS; i++){
      levelSegItems[i].classList.toggle('on', i < n);
    }
  }

  /* 给可能卡住的异步操作加超时。
     浏览器的 getUserMedia / AudioContext.resume 在某些情况下（权限弹窗
     被忽略、蓝牙耳机切换、系统音频服务异常）会一直 pending 不 resolve，
     导致界面停在「启动中」不动 —— 加上超时就变成可以理解的报错。 */
  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error(label + '超时')); }, ms);
      })
    ]);
  }

  async function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended'){
      // 只等 3 秒：拖太久就直接往下走，getUserMedia 可能照样能成功
      try { await withTimeout(audioCtx.resume(), 3000, '音频'); } catch(e){}
    }
    return audioCtx;
  }

  /* ══════════════════════════════════════════════
     真实乐器录音
     采样放在 audio/ 目录（与页面同源）。
     加载失败（如用 file:// 直接打开）就回退到下面的合成音。
     ══════════════════════════════════════════════ */
  const SAMPLE_DIR = 'audio/';
  const sampleBufs = {};      /* key → AudioBuffer */
  const sampleJobs = {};      /* key → Promise */

  /* 钢琴采样点（与 audio/ 里的文件一一对应） */
  const PIANO_POINTS = [24,30,36,42,48,54,60,66,72,78,84,90,96,102,108];  /* C1 Fs1 … C8 */

  function midiToSampleName(midi){
    const pc = midi % 12;
    const oct = Math.floor(midi / 12) - 1;
    return NOTE_NAMES[pc].replace('#', 's') + oct;
  }

  /* 找离 midi 最近的采样点，返回 {key, rate}；差太远则返回 null（改用合成音） */
  function nearestPianoSample(midi){
    let best = PIANO_POINTS[0], bd = Math.abs(midi - best);
    for (let i = 1; i < PIANO_POINTS.length; i++){
      const d = Math.abs(PIANO_POINTS[i] - midi);
      if (d < bd){ bd = d; best = PIANO_POINTS[i]; }
    }
    if (bd > 6) return null;          /* 变调过大会失真，不如用合成音 */
    return {
      key: 'piano_' + midiToSampleName(best),
      rate: Math.pow(2, (midi - best) / 12)
    };
  }

  function loadSample(key){
    if (sampleBufs[key]) return Promise.resolve(sampleBufs[key]);
    if (sampleJobs[key]) return sampleJobs[key];
    sampleJobs[key] = (async () => {
      try {
        const ctx = await ensureAudio();
        const res = await fetch(SAMPLE_DIR + key + '.m4a');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const raw = await res.arrayBuffer();
        const buf = await ctx.decodeAudioData(raw);
        sampleBufs[key] = buf;
        return buf;
      } catch (e){
        sampleJobs[key] = null;
        return null;
      }
    })();
    return sampleJobs[key];
  }

  /* 播放已缓存的采样；没缓存返回 false */
  function fireSample(key, rate, dur){
    const buf = sampleBufs[key];
    if (!buf || !audioCtx) return false;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    if (rate && Math.abs(rate - 1) > 1e-4) src.playbackRate.value = rate;
    const g = audioCtx.createGain();
    g.gain.value = 0.9;
    src.connect(g);
    g.connect(audioCtx.destination);
    src.start();
    playingRef = true;
    setTimeout(() => { playingRef = false; }, ((dur || 1.4) + 0.15) * 1000);
    return true;
  }

  /* 演奏一个标准音。
     sample = { key, rate } 时优先用真实录音。 */
  async function playReference(freq, duration, sample){
    duration = duration || 1.4;
    const ctx = await ensureAudio();

    if (sample && sample.key){
      if (fireSample(sample.key, sample.rate, duration)) return;
      /* 还没缓存：先加载，好了再补放一次 */
      const buf = await loadSample(sample.key);
      if (buf && fireSample(sample.key, sample.rate, duration)) return;
      /* 采样不可用 → 落到下面的合成音 */
    }

    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.12;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.22, now + 0.025);
    master.gain.setValueAtTime(0.22, now + duration - 0.15);
    master.gain.linearRampToValueAtTime(0.0001, now + duration);
    osc1.connect(master);
    osc2.connect(g2).connect(master);
    master.connect(ctx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + duration + 0.03);
    osc2.stop(now + duration + 0.03);
    playingRef = true;
    setTimeout(() => { playingRef = false; }, (duration + 0.15) * 1000);
  }

  /* 分析窗口长度：按最低频率算出需要多少个样本才是 2 的幂。
     吉他 70Hz → 5×44100/70 = 3150 → 4096
     尤克 200Hz → 1103 → 2048
     钢琴 65Hz → 3392 → 4096 */
  function pitchWindow(minFreq, sampleRate, avail){
    const need = Math.ceil(MIN_CYCLES * sampleRate / minFreq);
    let size = WINDOW_MIN;
    while (size < need && size < WINDOW_MAX) size *= 2;
    return Math.min(size, avail);
  }

  function detectPitch(buf, sampleRate, minFreq, maxFreq){
    const SIZE = pitchWindow(minFreq, sampleRate, buf.length);
    const offset = buf.length - SIZE;
    let mean = 0;
    for (let i = 0; i < SIZE; i++) mean += buf[offset + i];
    mean /= SIZE;
    const minLag = Math.max(2, Math.floor(sampleRate / maxFreq));
    /* 每个 lag 至少留 SIZE/3 个样本参与相关，否则统计量太少，峰值虚高 */
    const maxLag = Math.min(Math.floor(SIZE * 2 / 3), Math.floor(sampleRate / minFreq));
    const c = corrBuf;
    let maxVal = -1, maxPos = -1;
    for (let lag = minLag; lag <= maxLag; lag++){
      let num = 0, d1 = 0, d2 = 0;
      const limit = SIZE - lag;
      for (let i = 0; i < limit; i++){
        const a = buf[offset + i] - mean;
        const b = buf[offset + i + lag] - mean;
        num += a * b; d1 += a * a; d2 += b * b;
      }
      const den = Math.sqrt(d1 * d2);
      const nc = den > 1e-9 ? num / den : 0;
      c[lag] = nc;
      if (nc > maxVal){ maxVal = nc; maxPos = lag; }
    }
    if (maxPos < 0 || maxVal < NC_MIN) return null;
    const thr = maxVal * 0.93;
    for (let lag = minLag + 1; lag < maxPos; lag++){
      if (c[lag] > thr && c[lag] >= c[lag-1] && c[lag] >= c[lag+1]){ maxPos = lag; break; }
    }
    let delta = 0;
    if (maxPos > minLag && maxPos < maxLag){
      const y1 = c[maxPos-1], y2 = c[maxPos], y3 = c[maxPos+1];
      const den = 2 * (y1 + y3 - 2 * y2);
      if (den !== 0) delta = -(y3 - y1) / den;
      if (delta > 1) delta = 1;
      if (delta < -1) delta = -1;
    }
    const period = maxPos + delta;
    if (period <= 0) return null;
    const freq = sampleRate / period;
    if (freq < minFreq || freq > maxFreq) return null;
    return freq;
  }

  function processPitch(freqRaw){
    freqHistory.push(freqRaw);
    if (freqHistory.length > HISTORY_SIZE) freqHistory.shift();
    const sorted = freqHistory.slice().sort((a, b) => a - b);
    let median = sorted[Math.floor(sorted.length / 2)];

    /* 八度折叠
       吉他低音弦的基频很弱、谐波很强，自相关容易锁到二次谐波（高八度）。
       锁定某根弦时我们知道该是多少，把偏离超过一个八度的折回来。 */
    if (lockedKey !== null){
      const tf = (mode === 'piano')
        ? getFreq(lockedKey)
        : getFreq(INSTRUMENTS[mode].strings[lockedKey].midi);
      let guard = 0;
      while (median > tf * 1.6 && guard++ < 4) median /= 2;
      guard = 0;
      while (median < tf / 1.6 && guard++ < 4) median *= 2;
    }

    let candId;
    if (mode === 'piano'){
      candId = Math.round(freqToMidi(median));
    } else {
      const strings = INSTRUMENTS[mode].strings;
      let best = 0, bestC = Infinity;
      for (let i = 0; i < strings.length; i++){
        const c = Math.abs(1200 * Math.log2(median / getFreq(strings[i].midi)));
        if (c < bestC){ bestC = c; best = i; }
      }
      candId = best;
    }
    let displayId;
    if (lockedKey !== null){
      displayId = lockedKey;
      candidateId = null; candidateN = 0;
    } else if (displayedId === null){
      displayedId = candId; displayId = candId;
      smoothCents = 0; candidateId = null; candidateN = 0;
    } else if (candId === displayedId){
      candidateId = null; candidateN = 0; displayId = displayedId;
    } else {
      if (candidateId === candId) candidateN++;
      else { candidateId = candId; candidateN = 1; }
      if (candidateN >= SWITCH_NEED){
        displayedId = candId; displayId = candId;
        smoothCents = 0; candidateId = null; candidateN = 0;
      } else displayId = displayedId;
    }
    let targetFreq;
    if (mode === 'piano') targetFreq = getFreq(displayId);
    else targetFreq = getFreq(INSTRUMENTS[mode].strings[displayId].midi);
    const centsRaw = 1200 * Math.log2(median / targetFreq);
    const gap = Math.abs(centsRaw - smoothCents);
    const alpha = gap > EMA_FAST_GAP ? EMA_FAST : EMA_SLOW;
    smoothCents += (centsRaw - smoothCents) * alpha;
    updateDisplay(displayId, median, smoothCents);
  }

  function updateDisplay(displayId, freq, cents){
    const clamped = Math.max(-50, Math.min(50, cents));
    needleTarget = clamped * G_DEG_PER_CENT;
    const absC = Math.abs(cents);
    const ok = absC <= IN_TUNE;
    appEl.classList.toggle('tuning-ok', ok);

    let displayName, displayOct;
    if (mode === 'piano'){
      const n = midiToNote(displayId);
      displayName = n.name; displayOct = n.octave;
    } else {
      const s = INSTRUMENTS[mode].strings[displayId];
      displayName = s.name; displayOct = s.oct;
    }
    noteEl.innerHTML =
      /* 左侧隐形孪生八度：只占宽度，保证字母本身居中 */
      '<span class="oct ghost" aria-hidden="true">' + displayOct + '</span>' +
      '<span class="letter">' + displayName + '</span>' +
      '<span class="oct">' + displayOct + '</span>';
    /* 有音名了：回到「音名居中 + 音分/赫兹固定在下方」的布局 */
    gaugeOverlay.classList.remove('idle');
    freqEl.textContent = freq.toFixed(2) + ' Hz';
    if (ok){ centsEl.textContent = '准音'; centsEl.className = 'cents ok'; }
    else if (cents > 0){ centsEl.textContent = '+' + cents.toFixed(0) + '¢  偏高'; centsEl.className = 'cents high'; }
    else { centsEl.textContent = Math.abs(cents).toFixed(0) + '¢  偏低'; centsEl.className = 'cents low'; }
    activeKey = displayId;
    updateButtons();
  }

  function clearDisplay(){
    /* 不再画破折号占位 —— 84px 的横杠很抢眼。
       没有音名时切回 idle：提示文字回到圆心居中。 */
    noteEl.innerHTML = '';
    gaugeOverlay.classList.add('idle');
    centsEl.textContent = running ? '拨响一个音…' : '轻触开始';
    centsEl.className = 'cents';
    freqEl.textContent = '';
    needleTarget = 0; smoothCents = 0;
    displayedId = null; candidateId = null; candidateN = 0;
    activeKey = lockedKey;
    appEl.classList.remove('tuning-ok');
    updateButtons();
  }

  function resetSmoothing(){
    freqHistory = [];
    displayedId = null; candidateId = null; candidateN = 0;
    smoothCents = 0; needleVel = 0; needleTarget = 0;
  }

  function updateNeedle(ts){
    /* 用真实时间步长，60Hz / 120Hz 屏手感一致。
       切后台回来时 ts 会跳很大，限幅到 50ms，避免指针瞬移。 */
    let dt = lastNeedleTs ? (ts - lastNeedleTs) / 1000 : (1 / 60);
    lastNeedleTs = ts;
    if (!(dt > 0) || dt > 0.05) dt = 1 / 60;

    const w = 2 * Math.PI * NEEDLE_HZ;
    const accel = w * w * (needleTarget - needleAngle)
                - 2 * NEEDLE_ZETA * w * needleVel;
    needleVel   += accel * dt;
    needleAngle += needleVel * dt;

    if (Math.abs(needleTarget - needleAngle) < NEEDLE_DEADZONE &&
        Math.abs(needleVel) < NEEDLE_STOP_VEL){
      needleAngle = needleTarget; needleVel = 0;
    }

    const rad = needleAngle * Math.PI / 180;
    const rTip = G_R - 5;
    const x = G_CX + rTip * Math.sin(rad);
    const y = G_CY - rTip * Math.cos(rad);
    needleLine.setAttribute('x2', x.toFixed(2));
    needleLine.setAttribute('y2', y.toFixed(2));
    needleTip.setAttribute('cx', x.toFixed(2));
    needleTip.setAttribute('cy', y.toFixed(2));
  }

  function drawStrobe(){
    const W = strobeCanvas.width;
    const H = strobeCanvas.height;
    if (W === 0 || H === 0) return;
    strobeCtx.setTransform(1, 0, 0, 1, 0, 0);
    strobeCtx.clearRect(0, 0, W, H);
    strobeCtx.fillStyle = theme().surface2;
    strobeCtx.fillRect(0, 0, W, H);
    const dpr = window.devicePixelRatio || 1;
    const inTune = Math.abs(smoothCents) < 1.2;
    const period = STROBE_PERIOD * dpr;
    const stripe = STROBE_STRIPE * dpr;
    const offset = ((strobePhase * dpr) % period + period) % period;
    strobeCtx.fillStyle = inTune
        ? `rgba(${theme().successRgb},.55)`
        : `rgba(${theme().accentRgb},.42)`;
    for (let x = -period - offset; x < W + period; x += period){
      strobeCtx.fillRect(x, 0, stripe, H);
    }
  }

  let lastAnalysis = 0;
  function loop(ts){
    if (!running) return;
    if (!playingRef && ts - lastAnalysis > ANALYSIS_MS){
      lastAnalysis = ts;
      analyser.getFloatTimeDomainData(timeBuf);
      let sum = 0;
      for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
      const rms = Math.sqrt(sum / timeBuf.length);
      const targetLv = Math.min(100, Math.sqrt(rms) * 380);
      smoothLevel += (targetLv - smoothLevel) * 0.35;
      paintLevel(smoothLevel);
      if (rms < RMS_MIN){
        missFrames++;
        freqHistory = [];
        candidateId = null; candidateN = 0;
        if (missFrames > 12 && lastGoodTs && ts - lastGoodTs > 800) clearDisplay();
      } else {
        const [minF, maxF] = INSTRUMENTS[mode].detectRange;
        const f = detectPitch(timeBuf, audioCtx.sampleRate, minF, maxF);
        if (f){ missFrames = 0; lastGoodTs = ts; processPitch(f); }
        else {
          missFrames++;
          if (missFrames > 15 && lastGoodTs && ts - lastGoodTs > 900) clearDisplay();
        }
      }
    }
    updateNeedle(ts);
    if (Math.abs(smoothCents) >= 0.4){
      strobePhase += smoothCents * STROBE_SPEED;
      if (strobePhase > 1e6)  strobePhase -= 1e6;
      if (strobePhase < -1e6) strobePhase += 1e6;
    }
    if (view === 'strobe') drawStrobe();
    requestAnimationFrame(loop);
  }

  async function start(){
    startBtn.disabled = true;
    startBtn.textContent = '启动中';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('浏览器不支持麦克风');
      }
      const ctx = await ensureAudio();
      // 权限弹窗被忽略 / 麦克风被占 / 系统音频异常时，这个 Promise 会一直挂着。
      // 等 10 秒还没结果就报错，并在后台把迟到拿到的流关掉（不然麦克风被白占）。
      const gum = navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 }
      });
      let stream;
      try {
        stream = await withTimeout(gum, 10000, '麦克风');
      } catch (e){
        gum.then(function(s){
          try { s.getTracks().forEach(function(t){ t.stop(); }); } catch(_){}
        }).catch(function(){});
        throw e;
      }
      const src = ctx.createMediaStreamSource(stream);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 55; hp.Q.value = 0.6;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 3500; lp.Q.value = 0.6;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0;
      src.connect(hp); hp.connect(lp); lp.connect(analyser);
      timeBuf = new Float32Array(analyser.fftSize);
      corrBuf = new Float32Array(analyser.fftSize);
      running = true;
      lastGoodTs = performance.now();
      lastAnalysis = 0; missFrames = 0; smoothLevel = 0;
      resetSmoothing();
      micStatus.classList.add('on');
      micText.textContent = '监听中';
      startBtn.disabled = false;
      startBtn.textContent = '停止';
      startBtn.classList.add('stop');
      clearDisplay();
      centsEl.textContent = '拨响一个音…';
      requestAnimationFrame(() => {
        resizeStrobe();
        requestAnimationFrame(loop);
      });
    } catch (err){
      console.error(err);
      let msg = '无法访问麦克风';
      if (err && err.name === 'NotAllowedError') msg = '麦克风权限被拒绝';
      else if (err && err.name === 'NotFoundError') msg = '未找到麦克风设备';
      else if (err && err.name === 'NotReadableError') msg = '麦克风被其他程序占用';
      else if (err && /超时/.test(err.message || '')) {
        msg = err.message + '\n\n' +
              '可能是浏览器把麦克风权限拦住了。\n' +
              '点地址栏左边的图标 → 把「麦克风」改成「允许」，然后再试一次。';
      }
      else if (err && err.message) msg = err.message;
      startBtn.disabled = false;
      startBtn.textContent = '开始调音';
      micStatus.classList.remove('on');
      micText.textContent = '未启动';
      alert(msg);
    }
  }

  function stop(){
    running = false;
    if (audioCtx){ try { audioCtx.close(); } catch(e){} audioCtx = null; }
    analyser = null;
    smoothLevel = 0;
    paintLevel(0);
    micStatus.classList.remove('on');
    micText.textContent = '已停止';
    startBtn.textContent = '开始调音';
    startBtn.classList.remove('stop');
    clearDisplay();
    centsEl.textContent = '轻触开始';
  }

  startBtn.addEventListener('click', () => {
    if (running) stop(); else start();
  });

  /* ── 圆形命中检测 ──
     圆环元素的盒子是外接正方形，四角的空白不该响应点击。
     用点到圆心的距离判断，ratio = 圆半径 / 元素半宽。
     加上 2px 容差，让描边外侧的边缘也能点中。 */
  function hitCircle(el, clientX, clientY, ratio){
    if (!el) return false;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const rad = Math.min(r.width, r.height) / 2 * ratio + 2;
    const dx = clientX - cx, dy = clientY - cy;
    return dx * dx + dy * dy <= rad * rad;
  }

  /* 圆环点按 = 开始 / 停止（取代底部按钮）
     startBtn 已隐藏，但它仍是状态与文字的唯一来源，
     这里只把点击转过去，不改动 start()/stop() 的任何逻辑。

     触发区严格限定在圆内 —— SVG viewBox 是 300，圆半径 131，
     所以可见圆只占外接正方形的 87%（面积约 76%），四角是死区。 */
  const gaugeSvg  = gaugeBlock.querySelector('.gauge-svg');
  /* ratio = 圆半径 / 半宽。viewBox 300、圆 r=131 → 131 / 150 */
  const RING_RATIO = 131 / 150;
  gaugeBlock.addEventListener('click', (e) => {
    if (startBtn.disabled) return;        /* 「启动中」时忽略重复点击 */
    if (!hitCircle(gaugeSvg, e.clientX, e.clientY, RING_RATIO)) return;
    startBtn.click();
  });

  /* 频闪视图：点画布开始/停止。
     频闪是矩形画布，没有圆可参考，所以整块都可点。
     不加这个的话，切到频闪后就没地方可以开始了（圆环被 hide）。 */
  strobeView.addEventListener('click', () => {
    if (startBtn.disabled) return;
    startBtn.click();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    } else {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
  });

  buildStringButtons();
  buildPianoKeys();
  buildLevelSeg();
  updateOctaveDisplay();
  updateA4Display();
  updateButtons();
  clearDisplay();
  resizeStrobe();
})();
</script>
