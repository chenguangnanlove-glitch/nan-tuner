name: 构建安卓 APK

# 什么时候自动构建：
#   1. 你手动点「Run workflow」
#   2. 改了 android/ 或 web/app-version.json 并推送
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'web/app-version.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write        # 构建完成后把 APK 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 读取版本号（以 web/app-version.json 为唯一来源） ----------
      - name: 读取版本号
        id: ver
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open('web/app-version.json', encoding='utf-8'))
          print(f"code={v['versionCode']}")
          print(f"name={v['versionName']}")
          PY

      - name: 显示版本
        run: echo "即将构建 v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})"

      # ---------- 环境 ----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------- 签名密钥 ----------
      # 在仓库 Settings → Secrets and variables → Actions 里添加：
      #   KEYSTORE_BASE64    签名密钥文件的 base64 内容
      #   KEYSTORE_PASSWORD  密钥库密码
      #   KEY_PASSWORD       密钥密码
      #   KEY_ALIAS          密钥别名（默认 shixin）
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=缺少签名密钥::请在仓库 Secrets 里添加 KEYSTORE_BASE64（以及 KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS）后再构建。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "SHIXIN_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 构建 release APK
        working-directory: android
        env:
          SHIXIN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHIXIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SHIXIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} \
            --no-daemon

      - name: 检查产物
        id: apk
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error title=构建失败::没有生成 APK 文件"
            exit 1
          fi
          mkdir -p web/download
          cp "$SRC" web/download/shixin-tuner.apk
          SIZE=$(du -h web/download/shixin-tuner.apk | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "✅ 已生成 APK：$SIZE"

      # ---------- 上传到 Actions 产物（随时可手动下载） ----------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shixin-tuner-${{ steps.ver.outputs.name }}
          path: web/download/shixin-tuner.apk
          if-no-files-found: error

      # ---------- 提交回仓库，Netlify 会自动发布 ----------
      - name: 提交 APK 到仓库
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/download/shixin-tuner.apk
          if git diff --staged --quiet; then
            echo "APK 没有变化，跳过提交"
          else
            git commit -m "构建 APK v${{ steps.ver.outputs.name }} (${{ steps.apk.outputs.size }})"
            git push
          fi

      - name: 完成
        run: |
          echo "### ✅ APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})" >> $GITHUB_STEP_SUMMARY
          echo "- 大小：${{ steps.apk.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- 下载地址：你站点的 \`/download/shixin-tuner.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Netlify 会在约一分钟内自动发布，之后手机打开站点即可下载。" >> $GITHUB_STEP_SUMMARY
